  // Chạy code của mô hình trong Web Worker riêng: không có DOM, không có mạng, dừng sau 5 giây.
  function workerMain() {
    const out = [];
    const fmt = (v) => {
      if (typeof v === "string") return v;
      try { return JSON.stringify(v, null, 2) ?? String(v); } catch { return String(v); }
    };
    console.log = console.info = console.warn = console.error = (...a) => out.push(a.map(fmt).join(" "));
    self.fetch = self.XMLHttpRequest = self.WebSocket = self.importScripts = undefined;
    onmessage = async (e) => {
      try {
        let r = (0, eval)(e.data);
        if (r instanceof Promise) r = await r;
        if (r !== undefined && !out.length) out.push(fmt(r));
      } catch (err) { out.push("Lỗi: " + err.message); }
      postMessage(out.join("\n"));
    };
  }
  const workerUrl = URL.createObjectURL(new Blob([`(${workerMain})()`], { type: "text/javascript" }));

  function runJs(code) {
    return new Promise((resolve) => {
      const w = new Worker(workerUrl);
      const done = (text) => { clearTimeout(timer); w.terminate(); resolve(text); };
      const timer = setTimeout(() => done("Lỗi: code chạy quá 5 giây nên đã bị dừng."), 5000);
      w.onmessage = (e) => {
        const text = String(e.data).trim() || "(không có gì được in ra, hãy dùng console.log)";
        done(text.length > 4000 ? text.slice(0, 4000) + "\n…(đã cắt bớt)" : text);
      };
      w.onerror = (e) => { e.preventDefault(); done("Lỗi: " + e.message); };
      w.postMessage(code);
    });
  }

  // Python chạy bằng Pyodide trong một Web Worker riêng, giữ lại giữa các lần chạy để khỏi tải lại.
  // Sau khi tải xong, Worker bị tắt mạng (trừ lúc tự cài thư viện khi code có import), dừng sau 15 giây.
  const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.29.5/full/";
  function pyMain() {
    importScripts(PYODIDE + "pyodide.js");
    const realFetch = self.fetch.bind(self);
    const ready = loadPyodide({ indexURL: PYODIDE }).then((py) => {
      self.fetch = self.XMLHttpRequest = self.WebSocket = undefined;
      return py;
    });
    onmessage = async (e) => {
      const out = [];
      try {
        const py = await ready;
        postMessage({ ready: true });
        py.setStdout({ batched: (t) => out.push(t) });
        py.setStderr({ batched: (t) => out.push(t) });
        py.setStdin({ stdin: () => { throw new Error("input() không dùng được ở đây, hãy gán giá trị trực tiếp trong code."); } });
        self.fetch = realFetch;
        try { await py.loadPackagesFromImports(e.data, { messageCallback: () => {} }); } finally { self.fetch = undefined; }
        let r = await py.runPythonAsync(e.data, { globals: py.globals.get("dict")() });
        if (r !== undefined && r !== null && !out.length) out.push(String(r?.toString?.() ?? r));
        r?.destroy?.();
      } catch (err) {
        // Chỉ giữ phần cuối của traceback Python (phần đầu là code nội bộ của Pyodide).
        const msg = String(err.message || err).split("\n").filter((l) => !/\/lib\/python3|_pyodide|pyodide\//.test(l));
        out.push(msg.slice(-12).join("\n"));
      }
      postMessage({ out: out.join("\n") });
    };
  }
  let pyWorker = null, pyReady = false;
  function runPy(code) {
    pyWorker ??= new Worker(URL.createObjectURL(new Blob([`const PYODIDE = ${JSON.stringify(PYODIDE)};(${pyMain})()`], { type: "text/javascript" })));
    const w = pyWorker;
    return new Promise((resolve) => {
      let timer = null;
      const done = (text) => {
        clearTimeout(timer); w.onmessage = w.onerror = null;
        resolve(text.length > 4000 ? text.slice(0, 4000) + "\n…(đã cắt bớt)" : text);
      };
      // Code chạy quá lâu thì bỏ Worker này, lần sau tạo Worker mới.
      const kill = (msg) => { w.terminate(); pyWorker = null; pyReady = false; done(msg); };
      const arm = (ms, msg) => { clearTimeout(timer); timer = setTimeout(() => kill(msg), ms); };
      arm(90000, "Lỗi: không tải được Python. Kiểm tra kết nối mạng rồi thử lại.");
      w.onmessage = (e) => {
        if (e.data.ready) { pyReady = true; arm(15000 + (/^\s*(import|from)\s/m.test(code) ? 45000 : 0), "Lỗi: code chạy quá lâu nên đã bị dừng."); return; }
        done(String(e.data.out).trim() || "(không có gì được in ra, hãy dùng print)");
      };
      w.onerror = (e) => { e.preventDefault(); kill("Lỗi: " + e.message); };
      w.postMessage(code);
    });
  }

  async function apiError(res) {
    const text = await res.text();
    let msg = text;
    try { const j = JSON.parse(text); msg = j.error?.message || j.message || j.msg || text; } catch {}
    msg = String(msg).slice(0, 300);
    if (res.status === 401 || res.status === 403) return `Máy chủ từ chối yêu cầu (${res.status}): ${msg}`;
    if (res.status === 429) return `Đã vượt giới hạn số lượt hỏi, đợi một lúc rồi thử lại (429): ${msg}`;
    return `Server trả lỗi ${res.status}: ${msg}`;
  }

  // Gửi một yêu cầu và stream kết quả vào `reply`. Dừng sớm khi `stopOn(content)` trả về true.
  async function runPass(messages, reply, node, stopOn) {
    const t0 = performance.now();
    let tThinkEnd = null, tokens = 0, tFirst = null, stopped = false;
    const pass = new AbortController();
    const onAbort = () => pass.abort();
    controller.signal.addEventListener("abort", onAbort, { once: true });
    let pending = false;
    const repaint = () => {
      if (pending) return; pending = true;
      // Vẽ lại tối đa ~6 lần/giây để trình duyệt không tranh GPU với mô hình.
      setTimeout(() => { pending = false; if (controller) { paintAssistant(node, reply, true); scrollDown(); } }, 150);
    };
    try {
      const stream = apiDeltas(messages, reply, node, pass.signal);
      reply.truncated = false;
      for await (const { think, text, tps, finish } of stream) {
        if (finish) reply.truncated = finish === "length";
        if (think) reply.reasoning += think;
        if (text) { reply.content += text; delete reply.notice; }
        if (think || text) {
          tokens++; tFirst ??= performance.now();
          // Mốc kết thúc suy nghĩ: token trả lời đầu tiên sau phần reasoning, hoặc khi gặp </think>.
          if (tThinkEnd === null && ((reply.reasoning && text) || reply.content.includes("</think>"))) tThinkEnd = performance.now();
        }
        if (tps) reply.tps = tps.toFixed(1);
        repaint();
        if (stopOn?.(reply.content)) { stopped = true; pass.abort(); break; }
      }
    } catch (e) {
      if (!(stopped && e.name === "AbortError")) throw e;
    } finally {
      controller.signal.removeEventListener("abort", onAbort);
      if (tThinkEnd || reply.reasoning || reply.content.includes("</think>")) {
        reply.thinkSecs = (reply.thinkSecs || 0) + Math.max(1, Math.round(((tThinkEnd || performance.now()) - t0) / 1000));
      }
      if (!reply.tps && tokens > 1 && tFirst) reply.tps = (tokens / ((performance.now() - tFirst) / 1000)).toFixed(1);
    }
  }

  // API kiểu OpenAI (máy chủ chung): đọc luồng SSE, trả ra từng mẩu suy nghĩ/chữ.
  async function* apiDeltas(messages, reply, node, signal) {
    const notice = reply.notice;
    const show = (text) => { reply.notice = text; setStatus("", text); paintAssistant(node, reply, true); };
    const wait = (ms) => new Promise((ok, fail) => {
      const t = setTimeout(ok, ms);
      signal.addEventListener("abort", () => { clearTimeout(t); fail(new DOMException("", "AbortError")); }, { once: true });
    });
    // Bản miễn phí hay bị quá tải: 429/503 thì chờ rồi thử lại; máy chủ treo (502/504/524, hoặc 60 giây chưa trả lời)
    // thì chuyển ngay sang mô hình khác. Thứ tự: mô hình đang chọn trước, rồi các mô hình còn lại.
    // Câu hỏi có ảnh chỉ gửi được tới mô hình đọc ảnh, nên thử lại nhiều lần hơn thay vì đổi mô hình.
    const vision = messages.some((m) => Array.isArray(m.content));
    const order = vision ? [["shared", PROVIDERS.shared.vision]] : [[settings.provider, cloudModel()]];
    if (!vision) for (const id of Object.keys(PROVIDERS)) for (const m of PROVIDERS[id].models) if (id !== order[0][0] || m !== order[0][1]) order.push([id, m]);
    const retries = vision ? 4 : 1;
    let res = null, used, model;
    for (let i = 0; i < order.length; i++) {
      const [id, m] = order[i], p = PROVIDERS[id];
      used = id; model = m;
      const body = JSON.stringify({
        messages, stream: true,
        temperature: Number(settings.temperature), max_tokens: Number(settings.maxTokens), top_p: 0.95,
        model, ...p.extra,
      });
      let hung = false;
      for (let attempt = 0; ; attempt++) {
        const slow = new AbortController(), timer = setTimeout(() => slow.abort(), 60000);
        const both = AbortSignal.any ? AbortSignal.any([signal, slow.signal]) : signal;
        try {
          res = await fetch(p.url, { method: "POST", headers: { "Content-Type": "application/json" }, body, signal: both });
        } catch (e) {
          if (signal.aborted || !slow.signal.aborted) throw e;
          res = null;
        } finally { clearTimeout(timer); }
        hung = !res || [502, 504, 524].includes(res.status);
        if ((hung && !vision) || (res && res.status !== 429 && res.status !== 503 && !hung) || attempt >= retries) break;
        const text = res ? await res.text().catch(() => "") : "";
        const secs = Math.min(30, Number(res?.headers.get("Retry-After")) || Number(text.match(/retry after (\d+)/i)?.[1]) || 5 * (attempt + 1));
        show(`${modelTitle(id, m)} đang quá tải, tự thử lại sau ${secs} giây…`);
        await wait(secs * 1000);
      }
      const busy = hung || res.status === 429 || res.status === 503;
      if (!busy || i === order.length - 1) break;
      await res?.body?.cancel();
      show(`${modelTitle(id, m)} đang quá tải, chuyển sang ${modelTitle(...order[i + 1])}…`);
    }
    if (!res) throw new Error("Máy chủ GLM không phản hồi. Đợi một lúc rồi thử lại.");
    if (vision && [429, 502, 503, 504, 524].includes(res.status)) {
      await res.body?.cancel();
      throw new Error("Mô hình đọc ảnh (GLM-4.6V Flash, bản miễn phí) đang quá tải. Đợi khoảng một phút rồi bấm Tạo lại.");
    }
    reply.notice = notice;
    if (!res.ok) throw new Error(await apiError(res));
    if (vision) reply.via = `${modelTitle(used, model)} (mô hình đọc được ảnh)`;
    else if (used !== settings.provider || model !== cloudModel()) reply.via = `${modelTitle(used, model)} vì mô hình đã chọn đang quá tải`;
    setStatus("ok", `${PROVIDERS[used].name} · ${modelTitle(used, model)}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) return;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n"); buf = parts.pop();
      for (const line of parts) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        const delta = j.choices?.[0]?.delta || {};
        // Z.ai dùng reasoning_content, một số máy chủ khác dùng reasoning.
        yield { think: delta.reasoning_content || delta.reasoning, text: delta.content, tps: j.timings?.predicted_per_second, finish: j.choices?.[0]?.finish_reason };
      }
    }
  }

  // ---------- Nói thay vì gõ ----------
  // Dùng nhận giọng nói có sẵn của trình duyệt (Chrome, Edge, Safari). Trình duyệt không có (Firefox, Brave,
  // ứng dụng đã cài trên iPhone) thì bấm nút sẽ hiện cách nói bằng bàn phím của máy.
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const NO_MIC = /iPhone|iPad|Android/i.test(navigator.userAgent)
    ? "Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy bấm vào ô nhập tin nhắn rồi bấm nút micro trên bàn phím điện thoại để nói, hoặc mở trang bằng Chrome hay Safari (không mở từ ứng dụng đã cài)."
    : "Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy mở trang bằng Chrome, Edge hoặc Safari. Trên Mac cũng có thể bấm phím Fn hai lần (hoặc phím micro) để đọc chính tả vào ô nhập.";
  {
    const mic = $("micBtn");
    let rec = null;
    mic.onclick = () => {
      if (!Recognition) { alert(NO_MIC); return; }
      if (rec) { rec.stop(); return; }
      rec = new Recognition();
      rec.lang = "vi-VN"; rec.interimResults = true; rec.continuous = true;
      const base = els.input.value ? els.input.value.replace(/\s*$/, " ") : "";
      rec.onresult = (e) => {
        let said = "";
        for (const r of e.results) said += r[0].transcript;
        els.input.value = base + said;
        autosize();
      };
      rec.onerror = (e) => {
        if (e.error === "not-allowed") alert("Trình duyệt chưa cho dùng micro. Hãy cho phép quyền micro cho trang này rồi thử lại.");
        else if (e.error === "service-not-allowed" || e.error === "network" || e.error === "language-not-supported") alert(NO_MIC);
      };
      rec.onend = () => { rec = null; mic.classList.remove("on"); mic.title = "Nói thay vì gõ"; els.input.focus(); };
      rec.start();
      mic.classList.add("on"); mic.title = "Bấm để dừng ghi âm";
    };
  }

  // ---------- Nhân vật ----------
  // Mỗi nhân vật là một lời dặn thêm vào lời nhắc hệ thống. Có sẵn vài nhân vật, người dùng tạo thêm trong Cài đặt.
  const BUILTIN_PERSONAS = [
    { id: "default", name: "Mặc định", desc: "Trợ lý đa năng", prompt: "" },
    { id: "math", name: "Thầy dạy Toán", desc: "Giảng từng bước, dễ hiểu",
      prompt: "Bạn là một thầy giáo dạy Toán tận tâm. Giải thích từng bước, nêu rõ công thức và lý do của mỗi bước, dùng ví dụ số cụ thể. Nếu người dùng gửi bài tập, hỏi họ đã thử cách nào trước khi đưa lời giải đầy đủ chỉ khi họ muốn tự làm; còn không thì giải chi tiết rồi gợi ý một bài tương tự để luyện thêm." },
    { id: "ioi", name: "Huấn luyện viên IOI", desc: "Lập trình thi đấu, C++",
      prompt: "Bạn là huấn luyện viên đội tuyển tin học (IOI, ICPC). Với mỗi bài: phân tích ràng buộc, đưa ra từ ý tưởng ngây thơ đến tối ưu, giải thích độ phức tạp, viết C++17 sạch, chỉ ra lỗi hay gặp, và gợi ý bài luyện tập liên quan trên VNOI hoặc Codeforces." },
    { id: "translate", name: "Dịch giả Anh–Việt", desc: "Dịch tự nhiên, giữ ý",
      prompt: "Bạn là dịch giả Anh–Việt chuyên nghiệp. Người dùng gửi tiếng Việt thì dịch sang tiếng Anh, gửi tiếng Anh (hoặc ngôn ngữ khác) thì dịch sang tiếng Việt. Dịch tự nhiên như người bản xứ viết, giữ đúng ý và giọng văn, giữ nguyên thuật ngữ chuyên ngành khi cần. Chỉ đưa bản dịch, sau đó ghi chú ngắn những chỗ có nhiều cách hiểu." },
    { id: "english", name: "Gia sư tiếng Anh", desc: "Sửa lỗi, luyện hội thoại",
      prompt: "Bạn là gia sư tiếng Anh thân thiện. Trò chuyện với người dùng bằng tiếng Anh đơn giản; sau mỗi tin nhắn của họ, sửa lỗi ngữ pháp và từ vựng (giải thích ngắn bằng tiếng Việt), gợi ý cách nói tự nhiên hơn, rồi tiếp tục cuộc trò chuyện bằng một câu hỏi." },
    { id: "writer", name: "Trợ lý viết văn", desc: "Văn, bài luận, email",
      prompt: "Bạn là trợ lý viết văn. Giúp người dùng lập dàn ý, viết, sửa và nâng cấp bài văn, bài luận, email, bài đăng. Viết mạch lạc, giàu hình ảnh, đúng chính tả tiếng Việt; khi sửa bài thì chỉ ra chỗ đã sửa và lý do." },
  ];
  let customPersonas = store.get("glm.personas", []);
  const allPersonas = () => [...BUILTIN_PERSONAS, ...customPersonas];
  const currentPersona = () => allPersonas().find((p) => p.id === settings.persona) || BUILTIN_PERSONAS[0];
  function savePersonas() { store.set("glm.personas", customPersonas); markSynced("personas"); }

  function renderPersonas() {
    const list = $("personaList");
    list.innerHTML = customPersonas.length ? "" : '<li class="empty-mem">Chưa có nhân vật tự tạo.</li>';
    for (const p of customPersonas) {
      const li = document.createElement("li");
      const text = document.createElement("span"); text.textContent = p.name;
      const del = document.createElement("button");
      del.type = "button"; del.className = "icon-btn"; del.title = "Xoá"; del.innerHTML = ICON_TRASH;
      del.onclick = () => {
        customPersonas = customPersonas.filter((x) => x.id !== p.id);
        if (settings.persona === p.id) { settings.persona = "default"; store.set("glm.settings", settings); paintProvider(); }
        savePersonas(); renderPersonas();
      };
      li.append(text, del); list.append(li);
    }
  }
  $("personaAdd").onclick = () => {
    const name = $("personaName").value.trim(), prompt = $("personaPrompt").value.trim();
    if (!name || !prompt) { alert("Hãy nhập cả tên và lời dặn cho nhân vật."); return; }
    customPersonas.push({ id: "p" + Date.now().toString(36), name: name.slice(0, 40), desc: "Nhân vật của bạn", prompt });
    $("personaName").value = $("personaPrompt").value = "";
    savePersonas(); renderPersonas();
  };

  // ---------- Tìm đoạn văn liên quan (BM25) ----------
  // Dùng chung cho kho kiến thức và cho các câu trả lời đã thích. Bỏ dấu tiếng Việt để "phuong trinh" vẫn khớp "phương trình".
  const fold = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
  const STOP = new Set("la va cua co cho cac nhung mot duoc trong khong nay thi voi de nhu khi den tu ra vao the gi nao lam toi ban hay hoac neu vi tren duoi sau truoc the the is are the a an of to in and or for on with what how".split(" "));
  const tokens = (t) => fold(t).split(/[^a-z0-9]+/).filter((w) => w.length > 1 && !STOP.has(w));
  function rank(query, docs, k = 4) {
    const q = [...new Set(tokens(query))];
    if (!q.length || !docs.length) return [];
    const toks = docs.map((d) => tokens(d.text));
    const avg = toks.reduce((n, t) => n + t.length, 0) / toks.length || 1;
    const df = Object.fromEntries(q.map((w) => [w, toks.filter((t) => t.includes(w)).length]));
    return docs.map((d, i) => {
      const tf = {};
      for (const w of toks[i]) if (w in df) tf[w] = (tf[w] || 0) + 1;
      let score = 0, hit = 0;
      for (const w of q) {
        if (!tf[w]) continue;
        hit++;
        const idf = Math.log(1 + (docs.length - df[w] + 0.5) / (df[w] + 0.5));
        score += idf * (tf[w] * 2.2) / (tf[w] + 1.2 * (0.25 + 0.75 * toks[i].length / avg));
      }
      // ratio: tỉ lệ từ của câu hỏi có trong đoạn văn; dùng để lọc đoạn lạc đề (điểm BM25 tuyệt đối thay đổi theo số tài liệu).
      return { ...d, score, ratio: hit / q.length };
    }).filter((d) => d.score > 0).sort((a, b) => b.score - a.score).slice(0, k);
  }

  // Câu trả lời đã thích làm ví dụ mẫu: tìm những câu hỏi cũ giống câu đang hỏi.
  function likedExamples(question, chat) {
    const pool = [];
    for (const c of chats) c.messages.forEach((m, i) => {
      const q = c.messages[i - 1];
      if (m.role === "assistant" && m.good && q?.role === "user" && !(c === chat && i >= chat.messages.length - 2)) {
        pool.push({ text: q.content, answer: splitThink(m.content).answer.replace(MEMO_TAG, "").trim() });
      }
    });
    return rank(question, pool, 2).filter((d) => d.ratio >= 0.6);
  }

  // ---------- Kho kiến thức ----------
  // Tài liệu được chia thành đoạn khoảng 900 ký tự và lưu trong IndexedDB (dung lượng lớn hơn localStorage nhiều).
  const KB_DB = "glm-kb";
  let kbDocs = [];
  const idb = () => new Promise((ok, fail) => {
    const r = indexedDB.open(KB_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id" });
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  });
  async function kbTx(mode, fn) {
    const db = await idb();
    return new Promise((ok, fail) => {
      const tx = db.transaction("docs", mode), store = tx.objectStore("docs");
      const req = fn(store);
      tx.oncomplete = () => ok(req?.result); tx.onerror = () => fail(tx.error);
    });
  }
  async function kbLoad() {
    try { kbDocs = (await kbTx("readonly", (s) => s.getAll())) || []; } catch { kbDocs = []; }
    renderKb();
  }
  function chunk(text) {
    const paras = text.split(/\n\s*\n|\n(?=\[Trang )/).map((p) => p.trim()).filter(Boolean);
    const out = [];
    let cur = "";
    for (const p of paras) {
      if (cur && cur.length + p.length > 900) { out.push(cur); cur = ""; }
      if (p.length > 1400) { for (let i = 0; i < p.length; i += 900) out.push(p.slice(i, i + 1000)); continue; }
      cur += (cur ? "\n\n" : "") + p;
    }
    if (cur) out.push(cur);
    return out;
  }
  async function kbAdd(files) {
    for (const file of files) {
      const status = $("kbStatus");
      status.value = `Đang đọc ${file.name}…`;
      try {
        const { text } = await readFileText(file);
        const chunks = chunk(text);
        if (!chunks.length) throw new Error("file không có chữ");
        const doc = { id: "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: file.name, added: Date.now(), chars: text.length, chunks };
        await kbTx("readwrite", (s) => s.put(doc));
        kbDocs.push(doc);
        status.value = `Đã thêm ${file.name} (${chunks.length} đoạn).`;
      } catch (e) { status.value = `Không đọc được ${file.name}: ${e.message}.`; }
      renderKb();
    }
  }
  function renderKb() {
    const list = $("kbList");
    if (!list) return;
    list.innerHTML = kbDocs.length ? "" : '<li class="empty-mem">Chưa có tài liệu nào.</li>';
    for (const d of kbDocs) {
      const li = document.createElement("li");
      const text = document.createElement("span");
      text.textContent = `${d.name} · ${d.chars.toLocaleString("vi-VN")} ký tự`;
      const del = document.createElement("button");
      del.type = "button"; del.className = "icon-btn"; del.title = "Xoá"; del.innerHTML = ICON_TRASH;
      del.onclick = async () => {
        await kbTx("readwrite", (s) => s.delete(d.id)).catch(() => {});
        kbDocs = kbDocs.filter((x) => x.id !== d.id); renderKb();
      };
      li.append(text, del); list.append(li);
    }
  }
  $("kbAddBtn").onclick = () => $("kbInput").click();
  $("kbInput").onchange = (e) => { kbAdd([...e.target.files]); e.target.value = ""; };
  function kbSearch(question) {
    const pool = kbDocs.flatMap((d) => d.chunks.map((text) => ({ text, name: d.name })));
    return rank(question, pool, 4).filter((d) => d.ratio >= 0.5);
  }
  kbLoad();

  // Phần lời nhắc thêm cho từng câu hỏi: nhân vật, câu trả lời mẫu đã thích, đoạn tài liệu liên quan.
  function extraContext(chat) {
    const q = chat.messages.filter((m) => m.role === "user").at(-1)?.content || "";
    const parts = [], kb = [];
    const persona = currentPersona();
    if (persona.prompt) parts.push(`Vai trò của bạn (${persona.name}): ${persona.prompt}`);
    const liked = likedExamples(q, chat);
    if (liked.length) {
      parts.push("Người dùng đã đánh giá cao những câu trả lời sau cho câu hỏi tương tự. Hãy học văn phong, độ chi tiết và cách trình bày của chúng (không chép nguyên văn nếu câu hỏi khác):\n\n" +
        liked.map((d, i) => `Ví dụ ${i + 1}\nCâu hỏi: ${d.text.slice(0, 500)}\nCâu trả lời: ${d.answer.slice(0, 1500)}`).join("\n\n"));
    }
    const hits = kbSearch(q);
    if (hits.length) {
      parts.push("Các đoạn liên quan trong kho kiến thức riêng của người dùng. Ưu tiên dùng thông tin này khi trả lời và ghi rõ tên tài liệu đã dùng:\n\n" +
        hits.map((d) => `<tai_lieu ten="${d.name}">\n${d.text}\n</tai_lieu>`).join("\n\n"));
      kb.push(...new Set(hits.map((d) => d.name)));
    }
    return { text: parts.length ? "\n\n" + parts.join("\n\n") : "", kb };
  }

  // ---------- Tạo ảnh ----------
  // Ưu tiên Workers AI (FLUX) trên máy chủ chung; máy chủ chưa bật thì dùng Pollinations (miễn phí, có logo nhỏ).
  async function makeImage(prompt) {
    prompt = prompt.trim().slice(0, 1500);
    if (!prompt) return { out: "Lỗi: thiếu mô tả ảnh." };
    try {
      const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(90000)]) : controller.signal;
      const res = await fetch(SHARED_URL.replace(/\/$/, "") + "/image", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt }), signal,
      });
      if (res.ok) return { out: "Đã tạo xong ảnh và hiển thị cho người dùng.", image: (await res.json()).image };
      if (res.status !== 501 && res.status !== 404 && res.status !== 405) return { out: "Lỗi: " + (await apiError(res)) };
    } catch (e) {
      if (e.name === "AbortError" && controller?.signal.aborted) throw e;
    }
    const seed = Math.floor(Math.random() * 1e9);
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&seed=${seed}`;
    return { out: "Đã gửi yêu cầu tạo ảnh, ảnh đang hiển thị cho người dùng.", image: url };
  }

  // ---------- Tự đặt tên đoạn chat ----------
  async function autoTitle(chat) {
    if (chat.titled || chat.messages.length < 2) return;
    chat.titled = true;
    const q = chat.messages[0].content.slice(0, 1000);
    const a = splitThink(chat.messages[1].content || "").answer.slice(0, 1000);
    try {
      const res = await fetch(SHARED_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "glm-4.5-flash", stream: false, max_tokens: 40, temperature: 0.3, thinking: { type: "disabled" },
          messages: [{ role: "user", content: `Đặt tiêu đề ngắn (tối đa 6 từ, không dấu ngoặc kép, không dấu chấm cuối) cho đoạn chat này, cùng ngôn ngữ với câu hỏi.\n\nCâu hỏi: ${q}\n\nTrả lời: ${a}\n\nChỉ viết tiêu đề.` }],
        }),
      });
      if (!res.ok) return;
      const t = (await res.json()).choices?.[0]?.message?.content?.replace(/<think>[\s\S]*?<\/think>/g, "").replace(/["“”*#]/g, "").trim().split("\n")[0];
      if (t && t.length <= 80) { chat.title = t; chat.updated = Math.max(chat.updated, Date.now()); saveChats(); renderHistory(); }
    } catch {}
  }

  // ---------- Đồng bộ giữa các máy ----------
  // Bật bằng một mã bí mật; máy nào nhập cùng mã sẽ thấy cùng lịch sử chat, bộ nhớ và nhân vật.
  // Ảnh trong chat không đồng bộ (quá nặng), chỉ còn ở máy đã gửi/tạo ảnh.
  let syncState = store.get("glm.sync", { code: "", since: 0, pushed: {}, deleted: {}, meta: {} });
  syncState.pushed ??= {}; syncState.deleted ??= {}; syncState.meta ??= {};
  const saveSync = () => store.set("glm.sync", syncState);
  function markSynced(id) { syncState.meta[id] = Date.now(); saveSync(); scheduleSync(); }
  function markDeleted(chatId) { syncState.deleted[chatId] = Date.now(); saveSync(); scheduleSync(); }
  const stripChat = (c) => ({
    ...c,
    messages: c.messages.map((m) => {
      const x = { ...m };
      if (x.images?.length) { x.imagesDropped = (x.imagesDropped || 0) + x.images.length; delete x.images; }
      if (x.genImages) x.genImages = x.genImages.map((u) => (u?.startsWith("data:") ? null : u));
      if (x.files) x.files = x.files.map((f) => ({ ...f, text: (f.text || "").slice(0, 20000) }));
      return x;
    }),
  });
  let syncTimer = null, syncing = false;
  function scheduleSync(ms = 4000) {
    if (!syncState.code) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, ms);
  }
  async function syncNow() {
    if (!syncState.code || syncing) return;
    syncing = true;
    paintSync("Đang đồng bộ…");
    try {
      const changes = [];
      for (const c of chats) if (syncState.pushed["chat:" + c.id] !== c.updated) changes.push({ id: "chat:" + c.id, updated: c.updated, data: stripChat(c) });
      for (const [id, t] of Object.entries(syncState.deleted)) if (syncState.pushed["chat:" + id] !== -t) changes.push({ id: "chat:" + id, updated: t, data: null });
      for (const id of ["memory", "personas"]) {
        const t = syncState.meta[id];
        if (t && syncState.pushed[id] !== t) changes.push({ id, updated: t, data: id === "memory" ? memories : customPersonas });
      }
      const res = await fetch(SHARED_URL.replace(/\/$/, "") + "/sync", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: syncState.code, since: syncState.since, changes }),
      });
      if (!res.ok) throw new Error(res.status === 501 ? "Máy chủ chưa bật đồng bộ (xem worker/README.md)." : await apiError(res));
      const { now, items } = await res.json();
      for (const c of changes) syncState.pushed[c.id] = c.data === null ? -c.updated : c.updated;
      let changed = false;
      for (const it of items) {
        if (it.id.startsWith("chat:")) {
          const id = it.id.slice(5), i = chats.findIndex((c) => c.id === id);
          const local = chats[i];
          if (it.data === null) {
            if (local && local.updated <= it.updated && !controller) { chats.splice(i, 1); changed = true; if (id === currentId) currentId = null; }
            syncState.pushed[it.id] = -it.updated;
          } else if (!local || it.updated > local.updated) {
            if (local && controller && id === currentId) continue; // đang trả lời đoạn chat này thì để lần sau
            // Giữ lại ảnh của máy này cho các tin nhắn không đổi.
            if (local) it.data.messages.forEach((m, k) => {
              const lm = local.messages[k];
              if (lm && lm.content === m.content) {
                if (lm.images) { m.images = lm.images; delete m.imagesDropped; }
                if (lm.genImages) m.genImages = lm.genImages.map((u, j) => m.genImages?.[j] ?? u);
              }
            });
            if (i >= 0) chats[i] = it.data; else chats.push(it.data);
            delete syncState.deleted[id];
            syncState.pushed[it.id] = it.updated; changed = true;
          } else if (it.updated === local.updated) syncState.pushed[it.id] = it.updated;
        } else if (it.id === "memory" || it.id === "personas") {
          if (!(it.updated > (syncState.meta[it.id] || 0))) continue;
          if (it.id === "memory") { memories = it.data || []; store.set("glm.memory", memories); }
          else { customPersonas = it.data || []; store.set("glm.personas", customPersonas); }
          syncState.meta[it.id] = syncState.pushed[it.id] = it.updated;
        }
      }
      // Lùi mốc 1 phút để không bỏ sót thay đổi từ máy khác gửi lên cùng lúc.
      syncState.since = now - 60000;
      saveSync();
      if (changed) { saveChats(false); renderHistory(); if (!controller) renderThread(); }
      paintSync(`Đã đồng bộ lúc ${new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}.`);
    } catch (e) {
      paintSync("Lỗi đồng bộ: " + e.message);
    } finally { syncing = false; }
  }
  function paintSync(status) {
    const on = !!syncState.code;
    $("syncOff").hidden = $("syncOffJoin").hidden = on; $("syncOn").hidden = !on;
    if (on) $("syncCode").value = syncState.code;
    if (status) $("syncStatus").textContent = status;
  }
  // Máy tạo mã mới đẩy bộ nhớ và nhân vật của mình lên; máy nhập mã thì nhận bản trên máy chủ.
  function startSync(code, fresh) {
    const t = Date.now();
    syncState = { code, since: 0, pushed: {}, deleted: {}, meta: fresh ? { memory: t, personas: t } : {} };
    saveSync(); paintSync("Đang kết nối…"); syncNow();
  }
  $("syncNew").onclick = () => {
    const bytes = crypto.getRandomValues(new Uint8Array(15));
    const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const raw = [...bytes].map((b) => abc[b % 32]).join("");
    startSync(raw.match(/.{1,5}/g).join("-"), true);
  };
  $("syncJoin").onclick = () => {
    const code = $("syncInput").value.trim().toUpperCase().replace(/\s+/g, "");
    if (!/^[A-Z0-9-]{16,64}$/.test(code)) { alert("Mã đồng bộ không đúng. Hãy chép nguyên mã từ máy kia."); return; }
    startSync(code, false);
    $("syncInput").value = "";
  };
  $("syncCopy").onclick = async (e) => { await copy(syncState.code); flash(e.currentTarget, "Đã chép", "Chép mã"); };
  $("syncStop").onclick = () => {
    if (!confirm("Tắt đồng bộ trên máy này? Lịch sử chat trên máy này vẫn được giữ.")) return;
    syncState = { code: "", since: 0, pushed: {}, deleted: {}, meta: {} }; saveSync(); paintSync("Đồng bộ đang tắt.");
  };
  addEventListener("focus", () => scheduleSync(500));
  setInterval(() => scheduleSync(0), 120000);
  if (syncState.code) scheduleSync(1000);

  // ---------- Ghim, thư mục, đổi tên đoạn chat ----------
  function chatMenu(btn, c) {
    document.querySelector(".chat-menu")?.remove();
    const m = document.createElement("div");
    m.className = "chat-menu";
    m.innerHTML = `<button data-a="pin">${c.pinned ? "Bỏ ghim" : "Ghim lên đầu"}</button><button data-a="rename">Đổi tên</button>` +
      `<button data-a="folder">${c.folder ? "Đổi thư mục" : "Chuyển vào thư mục"}</button>${c.folder ? '<button data-a="unfolder">Bỏ khỏi thư mục</button>' : ""}` +
      `<button data-a="delete" class="danger">Xoá</button>`;
    document.body.append(m);
    const r = btn.getBoundingClientRect();
    m.style.left = Math.min(r.left, innerWidth - m.offsetWidth - 8) + "px";
    m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + "px";
    m.onclick = (e) => {
      const a = e.target.closest("[data-a]")?.dataset.a;
      if (!a) return;
      m.remove();
      if (a === "pin") c.pinned = !c.pinned;
      else if (a === "rename") { const t = prompt("Tên mới cho đoạn chat:", c.title || ""); if (!t?.trim()) return; c.title = t.trim().slice(0, 80); c.titled = true; }
      else if (a === "folder") {
        const names = [...new Set(chats.map((x) => x.folder).filter(Boolean))];
        const f = prompt(`Tên thư mục${names.length ? ` (đang có: ${names.join(", ")})` : ""}:`, c.folder || "");
        if (!f?.trim()) return;
        c.folder = f.trim().slice(0, 40);
      } else if (a === "unfolder") delete c.folder;
      else if (a === "delete") {
        if (!confirm("Xoá đoạn chat này?")) return;
        chats = chats.filter((x) => x.id !== c.id); markDeleted(c.id); saveChats();
        if (c.id === currentId) newChat(); else renderHistory();
        return;
      }
      c.updated = Date.now(); saveChats(); renderHistory();
    };
  }
  document.addEventListener("click", (e) => { if (!e.target.closest(".chat-menu, .history-item .more")) document.querySelector(".chat-menu")?.remove(); });

  // ---------- Ảnh và file đính kèm ----------
  // Ảnh được thu nhỏ còn tối đa 1280px (JPEG) trước khi gửi. File được đọc thành chữ ngay trong trình duyệt:
  // văn bản/code đọc thẳng, PDF dùng pdf.js, Word dùng mammoth, Excel dùng SheetJS (tải từ cdnjs khi cần).
  const MAX_FILE_CHARS = 60000, MAX_IMAGES = 4;
  const ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
  let attached = [];
  const scripts = {};
  const loadScript = (src) => (scripts[src] ??= new Promise((ok, fail) => {
    const sc = document.createElement("script");
    sc.src = src; sc.onload = ok;
    sc.onerror = () => { delete scripts[src]; sc.remove(); fail(new Error("không tải được thư viện, kiểm tra kết nối mạng")); };
    document.head.append(sc);
  }));
  const CDN = "https://cdnjs.cloudflare.com/ajax/libs/";

  const attChip = (name, info) =>
    `<div class="att"><span class="file-ico">${ICON_FILE}</span><span class="name">${esc(name)}<small>${esc(info)}</small></span></div>`;
  const fileInfo = (f) => (f.pages ? `${f.pages} trang · ` : "") + `${f.text.length.toLocaleString("vi-VN")} ký tự`;

  async function shrinkImage(file) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); // ảnh PNG trong suốt sẽ có nền trắng thay vì đen
    g.drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close();
    return c.toDataURL("image/jpeg", 0.85);
  }

  async function readFileText(file) {
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "pdf") {
      await loadScript(CDN + "pdf.js/3.11.174/pdf.min.js");
      pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + "pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const t = await (await pdf.getPage(i)).getTextContent();
        pages.push(`[Trang ${i}]\n` + t.items.map((x) => x.str + (x.hasEOL ? "\n" : "")).join(""));
        if (pages.join("").length > MAX_FILE_CHARS) break;
      }
      const text = pages.join("\n\n");
      if (!text.replace(/\[Trang \d+\]/g, "").trim()) throw new Error("PDF này là ảnh scan, không có chữ để đọc. Hãy chụp từng trang rồi gửi dạng ảnh");
      return { text, pages: pdf.numPages };
    }
    if (ext === "docx") {
      await loadScript(CDN + "mammoth/1.8.0/mammoth.browser.min.js");
      return { text: (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value };
    }
    if (["xlsx", "xls", "ods"].includes(ext)) {
      await loadScript(CDN + "xlsx/0.18.5/xlsx.full.min.js");
      const wb = XLSX.read(await file.arrayBuffer());
      return { text: wb.SheetNames.map((n) => `[Trang tính ${n}]\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n") };
    }
    if (["doc", "ppt", "pptx", "zip", "rar", "exe", "mp3", "mp4"].includes(ext)) throw new Error("định dạng này chưa đọc được");
    const text = await file.text();
    if (/\u0000/.test(text.slice(0, 2000))) throw new Error("định dạng này chưa đọc được");
    return { text };
  }

  async function addFiles(list) {
    for (const file of list) {
      const isImage = file.type.startsWith("image/");
      if (isImage && attached.filter((a) => a.kind === "image").length >= MAX_IMAGES) { alert(`Mỗi tin nhắn gửi tối đa ${MAX_IMAGES} ảnh.`); continue; }
      const item = { kind: isImage ? "image" : "file", name: file.name, loading: true };
      attached.push(item); paintAttachments();
      try {
        if (isImage) item.url = await shrinkImage(file);
        else {
          const r = await readFileText(file);
          item.text = r.text.length > MAX_FILE_CHARS ? r.text.slice(0, MAX_FILE_CHARS) + "\n…(file quá dài, phần sau đã bị cắt)" : r.text;
          item.pages = r.pages;
        }
        item.loading = false;
      } catch (e) {
        attached = attached.filter((a) => a !== item);
        alert(`Không đọc được ${file.name}: ${e.message}.`);
      }
      paintAttachments();
    }
  }

  function paintAttachments() {
    const box = $("attachments");
    box.hidden = !attached.length;
    box.innerHTML = attached.map((a, i) => {
      const rm = `<button type="button" class="rm" data-rm="${i}" title="Bỏ">×</button>`;
      if (a.kind === "image") return `<div class="att image${a.loading ? " loading" : ""}">${a.url ? `<img alt="" src="${a.url}">` : ""}${rm}</div>`;
      return `<div class="att${a.loading ? " loading" : ""}"><span class="file-ico">${ICON_FILE}</span>` +
        `<span class="name">${esc(a.name)}<small>${a.loading ? "Đang đọc…" : fileInfo(a)}</small></span>${rm}</div>`;
    }).join("");
    if (!controller) els.send.disabled = !els.input.value.trim() && !attached.length;
  }

  // Nội dung gửi cho mô hình: chữ của file đặt trước câu hỏi; ảnh gửi kèm theo dạng của API OpenAI.
  function apiContent(m, withImages) {
    let text = (m.files || []).filter((f) => f.text).map((f) => `Nội dung file "${f.name}":\n\`\`\`\n${f.text}\n\`\`\`\n\n`).join("") + m.content;
    const n = (m.images?.length || 0) + (m.imagesDropped || 0);
    if (!withImages || !m.images?.length) return n ? `(Người dùng đã gửi ${n} ảnh ở đây.)\n${text}` : text;
    return [{ type: "text", text }, ...m.images.map((url) => ({ type: "image_url", image_url: { url } }))];
  }

  $("attachBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
  $("attachments").onclick = (e) => {
    const b = e.target.closest("[data-rm]");
    if (b) { attached.splice(Number(b.dataset.rm), 1); paintAttachments(); }
  };
  els.input.addEventListener("paste", (e) => {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) { e.preventDefault(); addFiles(files); }
  });
  els.form.addEventListener("dragover", (e) => { e.preventDefault(); els.form.classList.add("drag"); });
  els.form.addEventListener("dragleave", () => els.form.classList.remove("drag"));
  els.form.addEventListener("drop", (e) => {
    e.preventDefault(); els.form.classList.remove("drag");
    if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]);
  });

  // ---------- Sự kiện ----------
  function autosize() {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 200) + "px";
    if (!controller) els.send.disabled = !els.input.value.trim() && !attached.length;
  }
  els.input.addEventListener("input", autosize);
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(els.input.value); }
  });
  els.form.addEventListener("submit", (e) => { e.preventDefault(); send(els.input.value); });
  els.send.addEventListener("click", (e) => { if (controller) { e.preventDefault(); controller.abort(); } });

  const deepBtn = $("deep");
  const paintDeep = () => deepBtn.classList.toggle("on", settings.deep);
  deepBtn.onclick = () => { settings.deep = !settings.deep; store.set("glm.settings", settings); paintDeep(); };
  paintDeep();

  $("newChat").onclick = newChat;
  $("newChatIcon").onclick = newChat;
  $("closeSide").onclick = () => els.sidebar.classList.add("hidden");
  $("openSide").onclick = () => els.sidebar.classList.remove("hidden");
  if (innerWidth <= 768) els.sidebar.classList.add("hidden");

  els.thread.addEventListener("click", async (e) => {
    const prevBtn = e.target.closest("[data-preview], [data-download], [data-full]");
    if (prevBtn) { codePreview(prevBtn); return; }
    const copyBtn = e.target.closest("[data-copy]");
    if (copyBtn) {
      const code = copyBtn.closest(".codeblock").querySelector("code").textContent;
      await copy(code); flash(copyBtn, `${ICON_CHECK}Đã chép`, `${ICON_COPY}Sao chép`); return;
    }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    const idx = Number(act.closest(".msg").dataset.idx);
    const chat = currentChat();
    if (act.dataset.act === "copy") {
      await copy(splitThink(chat.messages[idx].content).answer.trim());
      flash(act, ICON_CHECK, ICON_COPY);
    } else if (act.dataset.act === "good") {
      const m = chat.messages[idx];
      m.good = !m.good;
      chat.updated = Date.now();
      saveChats();
      paintAssistant(act.closest(".msg"), m, false);
    } else if (act.dataset.act === "regen" && !controller) {
      chat.messages.splice(idx);
      generate(chat);
    } else if (act.dataset.act === "speak") {
      speak(act, splitThink(chat.messages[idx].content).answer);
    }
  });

  // Đọc to câu trả lời bằng giọng có sẵn của máy (ưu tiên giọng tiếng Việt). Bấm lần nữa để dừng.
  let speakingBtn = null;
  function speak(btn, markdownText) {
    const synth = speechSynthesis, wasMe = speakingBtn === btn;
    synth.cancel();
    speakingBtn?.classList.remove("speaking"); speakingBtn = null;
    if (wasMe) return;
    const text = markdownText
      .replace(/```[\s\S]*?```/g, " (đoạn code) ")
      .replace(/\[\[[^\]]*\]\]/g, "")
      .replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1")
      .replace(/[*_#>`|~]/g, "")
      .replace(/\\[()[\]]|\$\$?/g, "")
      .replace(/\n{2,}/g, ". ").trim();
    if (!text) return;
    const lang = /[ăâđêôơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i.test(text) ? "vi-VN" : "en-US";
    const voice = synth.getVoices().find((v) => v.lang.replace("_", "-").startsWith(lang.slice(0, 2)));
    // Đọc từng câu: Chrome hay tự dừng khi một lần đọc quá dài.
    const parts = text.match(/[^.!?\n]+[.!?]*\s*/g) || [text];
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = lang; if (voice) u.voice = voice;
      if (i === parts.length - 1) u.onend = () => { if (speakingBtn === btn) { btn.classList.remove("speaking"); speakingBtn = null; } };
      synth.speak(u);
    });
    btn.classList.add("speaking"); speakingBtn = btn;
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const t = document.createElement("textarea"); t.value = text; document.body.append(t);
      t.select(); document.execCommand("copy"); t.remove();
    }
  }
  // Xem trước trang web/slide/hình trong khung riêng: sandbox không có allow-same-origin nên code không đọc được dữ liệu của trang chat.
  function codePreview(btn) {
    const block = btn.closest(".codeblock");
    if (!block) {
      const frame = btn.closest(".preview").querySelector("iframe");
      frame.requestFullscreen?.().then(() => frame.focus(), () => {});
      return;
    }
    const code = block.querySelector("code").textContent, kind = block.dataset.kind;
    if (btn.matches("[data-download]")) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([code], { type: kind === "svg" ? "image/svg+xml" : "text/html" }));
      a.download = kind === "svg" ? "hinh.svg" : "trang.html";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return;
    }
    const open = block.nextElementSibling?.classList.contains("preview") && block.nextElementSibling;
    if (open) { open.remove(); btn.innerHTML = `${ICON_PLAY}Xem trước`; return; }
    const box = document.createElement("div");
    box.className = "preview";
    box.innerHTML = `<div class="preview-bar"><span>Xem trước</span><button type="button" data-full>${ICON_FULL}Toàn màn hình</button></div>`;
    const frame = document.createElement("iframe");
    frame.sandbox = "allow-scripts allow-modals allow-forms allow-pointer-lock";
    frame.allow = "fullscreen";
    frame.srcdoc = kind === "svg" ? `<body style="margin:0;display:grid;place-items:center;min-height:100vh">${code}` : code;
    frame.onload = () => frame.focus();
    box.append(frame);
    block.after(box);
    btn.innerHTML = `${ICON_PLAY}Đóng xem trước`;
  }
  function flash(btn, on, off) { btn.innerHTML = on; setTimeout(() => (btn.innerHTML = off), 1500); }

  // ---------- Cài đặt ----------
  $("openSettings").onclick = () => {
    $("setProvider").value = currentChoice();
    fillProvider();
    $("setSystem").value = settings.system;
    $("setTemp").value = settings.temperature; $("setMax").value = settings.maxTokens;
    $("setThink").value = settings.think;
    $("setTools").checked = settings.tools;
    renderMemories();
    $("trainCount").value = `${trainingExamples().length} câu trả lời đã được thích`;
    renderPersonas(); renderKb(); paintSync();
    els.settings.showModal();
  };
  els.settings.addEventListener("close", () => {
    if (els.settings.returnValue !== "save") return;
    chooseModel($("setProvider").value);
    settings.system = $("setSystem").value;
    settings.temperature = parseFloat($("setTemp").value) || 0.6;
    settings.maxTokens = parseInt($("setMax").value) || 8192;
    settings.think = $("setThink").value;
    settings.tools = $("setTools").checked;
    store.set("glm.settings", settings);
    paintProvider(); checkServer(); renderThread();
  });
  function fillProvider() {
    const sel = $("setProvider");
    if (!sel.options.length) {
      for (const id of Object.keys(PROVIDERS)) {
        const g = document.createElement("optgroup");
        g.label = PROVIDERS[id].name;
        for (const m of PROVIDERS[id].models) g.append(new Option(modelTitle(id, m), `${id}:${m}`));
        sel.append(g);
      }
      sel.value = currentChoice();
    }
    $("modelHelp").textContent = PROVIDERS[sel.value.split(":")[0]].modelHelp;
  }
  $("setProvider").addEventListener("change", fillProvider);

  function renderMemories() {
    const list = $("memList");
    list.innerHTML = memories.length ? "" : '<li class="empty-mem">Chưa có ghi nhớ nào.</li>';
    for (const m of memories) {
      const li = document.createElement("li");
      const text = document.createElement("span"); text.textContent = m.text;
      const del = document.createElement("button");
      del.type = "button"; del.className = "icon-btn"; del.title = "Xoá"; del.innerHTML = ICON_TRASH;
      del.onclick = () => { memories = memories.filter((x) => x.id !== m.id); saveMemories(); renderMemories(); };
      li.append(text, del); list.append(li);
    }
  }
  const memSubmit = () => { addMemory($("memInput").value); $("memInput").value = ""; renderMemories(); };
  $("memAdd").onclick = memSubmit;
  $("memInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); memSubmit(); } });

  // Mỗi câu được thích thành một ví dụ: cả đoạn hội thoại trước đó, và câu trả lời kèm phần suy nghĩ trong <think>.
  function trainingExamples() {
    const out = [];
    for (const c of chats) {
      c.messages.forEach((m, i) => {
        if (m.role !== "assistant" || !m.good) return;
        const messages = c.messages.slice(0, i).map((x) => ({ role: x.role, content: splitThink(x.content).answer.trim() }));
        const think = (m.reasoning || "").trim();
        messages.push({ role: "assistant", content: (think ? `<think>${think}</think>` : "") + splitThink(m.content).answer.trim() });
        out.push({ messages });
      });
    }
    return out;
  }
  $("exportTrain").onclick = () => {
    const rows = trainingExamples();
    if (!rows.length) { alert("Chưa có câu trả lời nào được thích."); return; }
    const blob = new Blob([rows.map((r) => JSON.stringify(r)).join("\n") + "\n"], { type: "application/jsonl" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "data.jsonl"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  $("clearAll").onclick = () => {
    if (!confirm("Xoá toàn bộ lịch sử chat?")) return;
    for (const c of chats) syncState.deleted[c.id] = Date.now();
    saveSync();
    chats = []; saveChats(); els.settings.close(); newChat();
  };

  // ---------- Trạng thái ----------
  function checkServer() {
    setStatus("ok", `${PROVIDERS[settings.provider].name} · ${modelTitle(settings.provider, cloudModel())}`);
  }
  function setStatus(cls, text) { els.statusDot.className = "dot " + cls; els.statusText.textContent = text; }
  paintProvider();
  checkServer();

  // ---------- Web app ----------
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  let installEvent = null;
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvent = e; $("installBtn").hidden = false; });
  addEventListener("appinstalled", () => { $("installBtn").hidden = true; });
  $("installBtn").onclick = async () => {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null; $("installBtn").hidden = true;
  };

  renderHistory();
  renderThread();
})();
</script>
</body>
</html>
