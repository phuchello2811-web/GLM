  // ---------- Tìm đoạn văn liên quan (BM25) ----------
  // Dùng chung cho kho kiến thức và cho các câu trả lời đã thích. Bỏ dấu tiếng Việt để "phuong trinh" vẫn khớp "phương trình".
  const fold = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
  const STOP = new Set("la va cua co cho cac nhung mot duoc trong khong nay thi voi de nhu khi den tu ra vao the gi nao lam toi ban hay hoac neu vi tren duoi sau truoc the the is are the a an of to in and or for on with what how".split(" "));
  const tokens = (t) => fold(t).split(/[^a-z0-9]+/).filter((w) => w.length > 1 && !STOP.has(w));
  function rank(query, docs, k = 4) {
    const q = [...new Set(tokens(query))];
    if (!q.length || !docs.length) return [];
    const toks = docs.map((d) => tokens(d.text));
    const avg = toks.reduce((n, t) => n + t.length, 0) / toks.length || 1;
    const df = Object.fromEntries(q.map((w) => [w, toks.filter((t) => t.includes(w)).length]));
    return docs.map((d, i) => {
      const tf = {};
      for (const w of toks[i]) if (w in df) tf[w] = (tf[w] || 0) + 1;
      let score = 0, hit = 0;
      for (const w of q) {
        if (!tf[w]) continue;
        hit++;
        const idf = Math.log(1 + (docs.length - df[w] + 0.5) / (df[w] + 0.5));
        score += idf * (tf[w] * 2.2) / (tf[w] + 1.2 * (0.25 + 0.75 * toks[i].length / avg));
      }
      // ratio: tỉ lệ từ của câu hỏi có trong đoạn văn; dùng để lọc đoạn lạc đề (điểm BM25 tuyệt đối thay đổi theo số tài liệu).
      return { ...d, score, ratio: hit / q.length };
    }).filter((d) => d.score > 0).sort((a, b) => b.score - a.score).slice(0, k);
  }

  // Câu trả lời đã thích làm ví dụ mẫu: tìm những câu hỏi cũ giống câu đang hỏi.
  function likedExamples(question, chat) {
    const pool = [];
    for (const c of chats) c.messages.forEach((m, i) => {
      const q = c.messages[i - 1];
      if (m.role === "assistant" && m.good && q?.role === "user" && !(c === chat && i >= chat.messages.length - 2)) {
        pool.push({ text: q.content, answer: splitThink(m.content).answer.replace(MEMO_TAG, "").trim() });
      }
    });
    return rank(question, pool, 2).filter((d) => d.ratio >= 0.6);
  }

  // ---------- Kho kiến thức ----------
  // Tài liệu được chia thành đoạn khoảng 900 ký tự và lưu trong IndexedDB (dung lượng lớn hơn localStorage nhiều).
  const KB_DB = "glm-kb";
  let kbDocs = [];
  const idb = () => new Promise((ok, fail) => {
    const r = indexedDB.open(KB_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id" });
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  });
  async function kbTx(mode, fn) {
    const db = await idb();
    return new Promise((ok, fail) => {
      const tx = db.transaction("docs", mode), store = tx.objectStore("docs");
      const req = fn(store);
      tx.oncomplete = () => ok(req?.result); tx.onerror = () => fail(tx.error);
    });
  }
  async function kbLoad() {
    try { kbDocs = (await kbTx("readonly", (s) => s.getAll())) || []; } catch { kbDocs = []; }
    renderKb();
  }
  function chunk(text) {
    const paras = text.split(/\n\s*\n|\n(?=\[Trang )/).map((p) => p.trim()).filter(Boolean);
    const out = [];
    let cur = "";
    for (const p of paras) {
      if (cur && cur.length + p.length > 900) { out.push(cur); cur = ""; }
      if (p.length > 1400) { for (let i = 0; i < p.length; i += 900) out.push(p.slice(i, i + 1000)); continue; }
      cur += (cur ? "\n\n" : "") + p;
    }
    if (cur) out.push(cur);
    return out;
  }
  async function kbAdd(files) {
    for (const file of files) {
      const status = $("kbStatus");
      status.value = `Đang đọc ${file.name}…`;
      try {
        const { text } = await readFileText(file);
        const chunks = chunk(text);
        if (!chunks.length) throw new Error("file không có chữ");
        const doc = { id: "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: file.name, added: Date.now(), chars: text.length, chunks };
        await kbTx("readwrite", (s) => s.put(doc));
        kbDocs.push(doc);
        status.value = `Đã thêm ${file.name} (${chunks.length} đoạn).`;
      } catch (e) { status.value = `Không đọc được ${file.name}: ${e.message}.`; }
      renderKb();
    }
  }
  function renderKb() {
    const list = $("kbList");
    if (!list) return;
    list.innerHTML = kbDocs.length ? "" : '<li class="empty-mem">Chưa có tài liệu nào.</li>';
    for (const d of kbDocs) {
      const li = document.createElement("li");
      const text = document.createElement("span");
      text.textContent = `${d.name} · ${d.chars.toLocaleString("vi-VN")} ký tự`;
      const del = document.createElement("button");
      del.type = "button"; del.className = "icon-btn"; del.title = "Xoá"; del.innerHTML = ICON_TRASH;
      del.onclick = async () => {
        await kbTx("readwrite", (s) => s.delete(d.id)).catch(() => {});
        kbDocs = kbDocs.filter((x) => x.id !== d.id); renderKb();
      };
      li.append(text, del); list.append(li);
    }
  }
  $("kbAddBtn").onclick = () => $("kbInput").click();
  $("kbInput").onchange = (e) => { kbAdd([...e.target.files]); e.target.value = ""; };
  function kbSearch(question) {
    const pool = kbDocs.flatMap((d) => d.chunks.map((text) => ({ text, name: d.name })));
    return rank(question, pool, 4).filter((d) => d.ratio >= 0.5);
  }
  kbLoad();

  // Phần lời nhắc thêm cho từng câu hỏi: câu trả lời mẫu đã thích, đoạn tài liệu liên quan.
  function extraContext(chat) {
    const q = chat.messages.filter((m) => m.role === "user").at(-1)?.content || "";
    const parts = [], kb = [];
    const liked = likedExamples(q, chat);
    if (liked.length) {
      parts.push("Người dùng đã đánh giá cao những câu trả lời sau cho câu hỏi tương tự. Hãy học văn phong, độ chi tiết và cách trình bày của chúng (không chép nguyên văn nếu câu hỏi khác):\n\n" +
        liked.map((d, i) => `Ví dụ ${i + 1}\nCâu hỏi: ${d.text.slice(0, 500)}\nCâu trả lời: ${d.answer.slice(0, 1500)}`).join("\n\n"));
    }
    const hits = kbSearch(q);
    if (hits.length) {
      parts.push("Các đoạn liên quan trong kho kiến thức riêng của người dùng. Ưu tiên dùng thông tin này khi trả lời và ghi rõ tên tài liệu đã dùng:\n\n" +
        hits.map((d) => `<tai_lieu ten="${d.name}">\n${d.text}\n</tai_lieu>`).join("\n\n"));
      kb.push(...new Set(hits.map((d) => d.name)));
    }
    return { text: parts.length ? "\n\n" + parts.join("\n\n") : "", kb };
  }

  // ---------- Tạo ảnh ----------
  // Khối ```image: các dòng đầu có thể ghi tuỳ chọn "ratio: 16:9" và "edit: yes", phần còn lại là mô tả.
  // Ưu tiên Workers AI (FLUX.2) trên máy chủ chung; máy chủ chưa bật thì dùng Pollinations (miễn phí, không sửa được ảnh).
  const RATIOS = {
    "1:1": [1024, 1024], "16:9": [1344, 768], "9:16": [768, 1344], "4:3": [1152, 864], "3:4": [864, 1152],
    "3:2": [1216, 816], "2:3": [816, 1216], "21:9": [1536, 656],
  };
  // Phong cách có sẵn: thêm bộ từ khoá tối ưu cho mô hình vẽ.
  const STYLES = {
    photo: "photorealistic photograph, natural lighting, shot on 50mm lens, high detail, sharp focus, realistic textures",
    anime: "anime style illustration, clean line art, vibrant cel shading, expressive eyes, detailed background",
    ghibli: "Studio Ghibli inspired illustration, soft painted background, warm whimsical atmosphere, gentle colors",
    watercolor: "watercolor painting, soft washes, visible paper texture, delicate brush strokes",
    oil: "oil painting, rich impasto brush strokes, classical composition, dramatic lighting",
    "3d": "3D render, Pixar style, soft global illumination, smooth materials, octane render",
    pixel: "pixel art, 16-bit retro game style, crisp pixels, limited color palette",
    sketch: "pencil sketch, graphite shading, hand-drawn lines, white paper",
    flat: "flat vector illustration, minimal clean shapes, bold colors",
    cinematic: "cinematic film still, dramatic lighting, shallow depth of field, anamorphic lens, color graded",
    cyberpunk: "cyberpunk style, neon lights, rainy night city, high contrast, futuristic",
    poster: "graphic poster design, bold typography, strong composition, print quality",
  };
  const STYLE_ALIAS = { "ảnh thật": "photo", "chân thực": "photo", "hoạt hình": "anime", "màu nước": "watercolor", "sơn dầu": "oil", "chì": "sketch", "phẳng": "flat", "điện ảnh": "cinematic" };
  // Dòng tuỳ chọn ở đầu khối ```image: ratio, size, style, count, seed, edit.
  const IMAGE_OPTS = { ratio: /^(ratio|aspect|tỉ lệ|tỷ lệ|khổ)$/i, size: /^(size|cỡ|kích thước)$/i, edit: /^(edit|sửa)$/i,
    count: /^(count|n|số ảnh|số lượng)$/i, style: /^(style|phong cách)$/i, seed: /^seed$/i };
  function imageRequest(block) {
    const opts = {};
    const lines = block.trim().split("\n");
    while (lines.length) {
      const o = lines[0].match(/^\s*([\p{L}\d ]+?)\s*[:=]\s*(.+?)\s*$/u);
      const key = o && Object.keys(IMAGE_OPTS).find((k) => IMAGE_OPTS[k].test(o[1].trim()));
      if (!key) break;
      opts[key] = o[2].toLowerCase();
      lines.shift();
    }
    // Cách viết cũ: size: 16:9 nghĩa là tỉ lệ.
    const ratio = (opts.ratio || (/\d\s*[:x]\s*\d/.test(opts.size || "") ? opts.size : "")).replace(/\s/g, "").replace("x", ":");
    let [width, height] = RATIOS[ratio] || RATIOS["1:1"];
    if (/large|lớn|to|hd|2k/.test(opts.size || "")) {
      // Phóng to 1,5 lần nhưng cạnh dài không quá 1920 (giới hạn của máy vẽ), giữ đúng tỉ lệ.
      const k = Math.min(1.5, 1920 / Math.max(width, height)), big = (v) => Math.round((v * k) / 16) * 16;
      [width, height] = [big(width), big(height)];
    }
    const style = STYLES[STYLE_ALIAS[opts.style] || opts.style];
    const prompt = lines.join(" ").replace(/\s+/g, " ").trim();
    return {
      prompt: (prompt && style ? `${prompt}, ${style}` : prompt).slice(0, 1800), width, height,
      edit: /^(yes|có|true|1|last)/.test(opts.edit || ""),
      count: Math.min(4, Math.max(1, parseInt(opts.count) || 1)),
      seed: /^\d+$/.test(opts.seed || "") ? Number(opts.seed) : undefined,
    };
  }
  // Ảnh mẫu khi sửa ảnh: ảnh người dùng chọn "Sửa ảnh này", nếu không thì ảnh họ gửi kèm, nếu không thì ảnh vừa tạo.
  function editSources(chat) {
    const users = (chat?.messages || []).filter((m) => m.role === "user");
    const last = users.at(-1);
    if (last?.refImages?.length) return last.refImages;
    if (last?.images?.length) return last.images;
    for (const m of [...(chat?.messages || [])].reverse()) {
      const g = (m.genImages || []).filter(Boolean);
      if (g.length) return [g.at(-1)];
    }
    return [];
  }
  // FLUX.2 chỉ nhận ảnh mẫu nhỏ hơn 512x512.
  async function refImage(url) {
    const blob = await (await fetch(url)).blob();
    const bmp = await createImageBitmap(blob);
    const k = Math.min(1, 504 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close();
    return c.toDataURL("image/jpeg", 0.9);
  }
  async function makeImage(block, chat) {
    const req = typeof block === "string" ? imageRequest(block) : block;
    if (!req.prompt) return { out: "Lỗi: thiếu mô tả ảnh." };
    const forced = (chat?.messages || []).filter((m) => m.role === "user").at(-1)?.refImages?.length;
    let refs = [];
    if (req.edit || forced) {
      const got = await Promise.allSettled(editSources(chat).slice(0, 4).map(refImage));
      refs = got.filter((r) => r.status === "fulfilled").map((r) => r.value);
    }
    // Nhiều phiên bản: vẽ song song, mỗi ảnh một seed khác nhau.
    const results = await Promise.all(Array.from({ length: req.count || 1 }, (_, i) => drawOne(req, refs, i === 0 ? req.seed : undefined)));
    const ok = results.filter((r) => r.image);
    if (!ok.length) return { out: results[0].out };
    const first = ok[0].meta;
    return {
      out: (ok.length > 1 ? `Đã tạo ${ok.length} phiên bản ảnh ${first.width}x${first.height} bằng ${first.model} và hiển thị cho người dùng để chọn.` : ok[0].out) +
        (ok.length < results.length ? ` (${results.length - ok.length} ảnh không tạo được.)` : ""),
      images: ok.map((r) => r.image), metas: ok.map((r) => r.meta),

  }
  async function drawOne(req, refs, seed) {
    seed ??= Math.floor(Math.random() * 2 ** 31);
    const meta = { prompt: req.prompt, width: req.width, height: req.height, edit: refs.length > 0, seed };
    try {
      const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(90000)]) : controller.signal;
      const res = await fetch(SHARED_URL.replace(/\/$/, "") + "/image", {
        method: "POST", headers: { "Content-Type": "application/json" }, signal,
        body: JSON.stringify({ prompt: req.prompt, width: req.width, height: req.height, seed, refs }),
      });

      image: url, meta,

  }

  // ---------- Đồng bộ giữa các máy ----------
  // Bật bằng một mã bí mật; máy nào nhập cùng mã sẽ thấy cùng lịch sử chat, bộ nhớ và nhân vật.

  syncState.pushed ??= {}; syncState.deleted ??= {}; syncState.meta ??= {};
  const saveSync = () => store.set("glm.sync", syncState);

  function markDeleted(chatId) { syncState.deleted[chatId] = Date.now(); saveSync(); scheduleSync(); }
  const stripChat = (c) => ({
    ...c,
    messages: c.messages.map((m) => {
      const x = { ...m };
      if (x.images?.length) { x.imagesDropped = (x.imagesDropped || 0) + x.images.length; delete x.images; }
      if (x.genImages) x.genImages = x.genImages.map((u) => (u?.startsWith("data:") ? null : u));
      delete x.refImages;

  async function syncNow() {
    if (!syncState.code || syncing) return;

    try {
      const changes = [];
      for (const c of chats) if (syncState.pushed["chat:" + c.id] !== c.updated) changes.push({ id: "chat:" + c.id, updated: c.updated, data: stripChat(c) });
      for (const [id, t] of Object.entries(syncState.deleted)) if (syncState.pushed["chat:" + id] !== -t) changes.push({ id: "chat:" + id, updated: t, data: null });
      for (const id of ["memory"]) {
        const t = syncState.meta[id];
        if (t && syncState.pushed[id] !== t) changes.push({ id, updated: t, data: memories });
      }
      const res = await fetch(SHARED_URL.replace(/\/$/, "") + "/sync", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: syncState.code, since: syncState.since, changes }),
      });
      if (!res.ok) throw new Error(res.status === 501 ? "Máy chủ chưa bật đồng bộ (xem worker/README.md)." : await apiError(res));
      const { now, items } = await res.json();
      for (const c of changes) syncState.pushed[c.id] = c.data === null ? -c.updated : c.updated;
      let changed = false;
      for (const it of items) {
        if (it.id.startsWith("chat:")) {
          const id = it.id.slice(5), i = chats.findIndex((c) => c.id === id);
          const local = chats[i];
          if (it.data === null) {
            if (local && local.updated <= it.updated && !controller) { chats.splice(i, 1); changed = true; if (id === currentId) currentId = null; }
            syncState.pushed[it.id] = -it.updated;
          } else if (!local || it.updated > local.updated) {
            if (local && controller && id === currentId) continue; // đang trả lời đoạn chat này thì để lần sau
            // Giữ lại ảnh của máy này cho các tin nhắn không đổi.
            if (local) it.data.messages.forEach((m, k) => {

              if (lm && lm.content === m.content) {
                if (lm.images) { m.images = lm.images; delete m.imagesDropped; }
                if (lm.genImages) m.genImages = lm.genImages.map((u, j) => m.genImages?.[j] ?? u);

      paintSync(`Đã đồng bộ lúc ${new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}.`);
    } catch (e) {

  function paintSync(status) {

  // Máy tạo mã mới đẩy bộ nhớ và nhân vật của mình lên; máy nhập mã thì nhận bản trên máy chủ.
  function startSync(code, fresh) {

  addEventListener("focus", () => scheduleSync(500));
  setInterval(() => scheduleSync(0), 120000);

  // ---------- Ghim, thư mục, đổi tên đoạn chat ----------

  document.addEventListener("click", (e) => { if (!e.target.closest(".chat-menu, .history-item .more")) document.querySelector(".chat-menu")?.remove(); });

  // ---------- Ảnh và file đính kèm ----------
  // Ảnh được thu nhỏ còn tối đa 1280px (JPEG) trước khi gửi. File được đọc thành chữ ngay trong trình duyệt:
  // văn bản/code đọc thẳng, PDF dùng pdf.js, Word dùng mammoth, Excel dùng SheetJS (tải từ cdnjs khi cần).
  const MAX_FILE_CHARS = 60000, MAX_IMAGES = 4;
  const ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
  let attached = [];
  const scripts = {};
  const loadScript = (src) => (scripts[src] ??= new Promise((ok, fail) => {
    const sc = document.createElement("script");
    sc.src = src; sc.onload = ok;
    sc.onerror = () => { delete scripts[src]; sc.remove(); fail(new Error("không tải được thư viện, kiểm tra kết nối mạng")); };
    document.head.append(sc);
  }));
  const CDN = "https://cdnjs.cloudflare.com/ajax/libs/";

  // ---------- Dự án web nhiều file ----------
  // Mỗi file là một khối code có tên file ở dòng mở khối: ```html index.html, ```css css/style.css, ```js:js/app.js, ```index.html,
  // hoặc dòng đầu là chú thích tên file (<!-- about.html -->, // js/app.js, /* css/style.css */).
  // Dự án gộp các file của mọi câu trả lời trong đoạn chat (bản mới nhất của mỗi file thắng), nên có thể sửa dần từng file.
  const NOT_FILES = /^(js-run|py-run|python-run|cpp-run|output|search|wiki|web|news|research|read|weather|rate|papers|dev|dict|image|pptx|xlsx|docx|svg)$/i;
  const FILE_EXT = /^[\w@()[\] .-]+(\/[\w@()[\] .-]+)*\.[A-Za-z0-9]{1,8}$/;
  function cleanPath(p) {
    const parts = [];
    for (const seg of String(p).replace(/\\/g, "/").replace(/^\.?\//, "").split("/")) {
      if (!seg || seg === ".") continue;
      if (seg === "..") parts.pop(); else parts.push(seg);
    }
    return parts.join("/");
  }
  // Bản sửa dự án mà mô hình quên ghi đường dẫn ở dòng mở khối: ghép khối đó với file cũ cùng loại trong dự án
  // (chỉ có một file cùng đuôi, hoặc tên file xuất hiện trong nội dung, hoặc trang HTML chính), rồi ghi đường dẫn vào dòng mở khối.
  function nameBlocks(text, base) {
    if (!base?.size) return text;
    const named = new Set(filesIn(text).map(([p]) => p));
    return String(text).replace(/^([ \t]*```)([^\n`]*)\n([\s\S]*?)\n([ \t]*```)/gm, (all, open, info, body, close) => {
      const lang = (info.trim().match(/^[\w+#.-]+/) || [""])[0].toLowerCase();
      if (!LANG_EXT[lang] || NOT_FILES.test(lang) || filesIn(all).length) return all;
      const cands = [...base.keys()].filter((p) => LANG_EXT[lang].includes(extOf(p)) && !named.has(p));
      const low = body.toLowerCase().replace(/[-_]/g, "");
      const hit = cands.filter((p) => { const n = p.split("/").pop().replace(/\.\w+$/, "").toLowerCase().replace(/[-_]/g, ""); return n.length > 2 && low.includes(n); });
      const pick = cands.length === 1 ? cands[0] : /^html?$/.test(lang) && cands.includes(mainPage(base)) ? mainPage(base) : hit.length === 1 ? hit[0] : null;
      if (!pick) return all;
      named.add(pick);
      return `${open}${lang} ${pick}\n${body}\n${close}`;
    });
  }
  // Đuôi file ứng với ngôn ngữ ghi ở dòng mở khối code (để đoán tên cho khối không ghi đường dẫn).
  const LANG_EXT = { html: ["html", "htm"], htm: ["html", "htm"], xml: ["xml", "svg"], svg: ["svg"], css: ["css"], scss: ["scss"], less: ["less"],
    js: ["js", "mjs"], javascript: ["js", "mjs"], mjs: ["mjs", "js"], jsx: ["jsx", "js"], ts: ["ts"], typescript: ["ts"], tsx: ["tsx"], json: ["json"],
    md: ["md"], markdown: ["md"], py: ["py"], python: ["py"], java: ["java"], cpp: ["cpp", "cc", "h"], "c++": ["cpp"], c: ["c", "h"], go: ["go"], rust: ["rs"], rs: ["rs"],
    php: ["php"], ruby: ["rb"], sql: ["sql"], yaml: ["yml", "yaml"], yml: ["yml", "yaml"], sh: ["sh"], bash: ["sh"], vue: ["vue"], svelte: ["svelte"], csv: ["csv"], txt: ["txt"] };
  function filesIn(text) {
    const src = String(text || "");
    const blocks = [];
    for (const m of src.matchAll(/^[ \t]*```([^\n`]*)\n([\s\S]*?)\n[ \t]*```/gm)) {
      const info = m[1].replace(/\b(title|file|filename|path|name)\s*=\s*["']?([^"'\s]+)["']?/i, " $2").trim();
      const lang = (info.match(/^[\w+#.-]+/) || [""])[0];
      if (NOT_FILES.test(lang)) continue;
      let body = m[2];
      let path = info.split(/[\s:]+/).find((t) => FILE_EXT.test(t) && /\.[A-Za-z0-9]+$/.test(t) && !/^(\w+)$/.test(t));
      if (!path) {
        const first = body.match(/^\s*(?:<!--|\/\/|\/\*|#)\s*(?:file:?\s*)?([\w@()[\] ./-]+\.[A-Za-z0-9]{1,8})\s*(?:-->|\*\/)?\s*$/m);
        if (first && first.index < 3) { path = first[1].trim(); body = body.slice(first.index + first[0].length).replace(/^\n/, ""); }
      }
      blocks.push({ path: path ? cleanPath(path) : null, body, lang: lang.toLowerCase(), at: m.index });
    }
    // Khối không ghi đường dẫn trong một câu trả lời rõ ràng là dự án (đã có file ghi đường dẫn, hoặc có sơ đồ thư mục):
    // đoán tên từ dòng tiêu đề ngay trên khối, rồi từ sơ đồ thư mục theo đuôi file, cuối cùng trang HTML hoàn chỉnh là index.html.
    const unnamed = blocks.filter((b) => !b.path && LANG_EXT[b.lang]);
    const trees = treeFiles(src);
    if (unnamed.length && (blocks.some((b) => b.path) || trees.length)) {
      const used = new Set(blocks.filter((b) => b.path).map((b) => b.path));
      let tree = trees.flat();
      const top = tree[0]?.split("/")[0];
      if (top && tree.every((p) => p.startsWith(top + "/"))) tree = tree.map((p) => p.slice(top.length + 1));
      tree = [...new Set(tree.map(cleanPath))];
      for (const b of unnamed) {
        const exts = LANG_EXT[b.lang];
        const okExt = (p) => exts.includes(extOf(p));
        // 1) Dòng tiêu đề ngay trên khối: "### `js/player.js`", "**css/style.css**", "File: js/app.js:"
        const before = src.slice(0, b.at).split("\n").map((l) => l.trim()).filter(Boolean).slice(-2).reverse();
        let path = null;
        for (const l of before) {
          if (/^```/.test(l)) break;
          const t = (l.match(/[\w@()[\]./-]+\.[A-Za-z0-9]{1,8}/g) || []).map(cleanPath).find((x) => okExt(x) && !used.has(x));
          if (t) { path = t; break; }
        }
        // 2) Sơ đồ thư mục: file cùng đuôi chưa dùng, ưu tiên file có tên xuất hiện trong nội dung khối (class Player → player.js).
        if (!path) {
          const cands = tree.filter((p) => okExt(p) && !used.has(p));
          const low = b.body.toLowerCase();
          const score = (p) => { const n = p.split("/").pop().replace(/\.\w+$/, "").toLowerCase().replace(/[-_]/g, ""); return n.length > 2 && low.replace(/[-_]/g, "").includes(n) ? 1 : 0; };
          path = cands.sort((a, c) => score(c) - score(a))[0] || null;
        }
        // 3) Trang HTML hoàn chỉnh mà dự án chưa có trang chính.
        if (!path && /^html?$/.test(b.lang) && /<html\b|<!doctype/i.test(b.body) && !used.has("index.html")) path = "index.html";
        if (path) { b.path = path; used.add(path); }
      }
    }
    return blocks.filter((b) => b.path).map((b) => [b.path, b.body]);
  }
  // Dự án tính tới câu trả lời thứ idx: file của các câu trả lời trước, các bản đã tự sửa của câu này, rồi chính câu này.
  // Các file của dự án trước câu trả lời thứ idx (để biết câu trả lời này sửa tiếp hay mở dự án mới).
  function projectBefore(chat, idx) {
    const files = new Map();
    const add = (text) => { for (const [p, c] of filesIn(splitThink(text || "").answer)) files.set(p, c); };
    chat.messages.slice(0, idx).forEach((m) => {
      if (m.role === "user") { for (const f of m.files || []) if (f.zip) add(f.text); }
      else if (m.role === "assistant") add(m.content);
    });
    return files;
  }

        else if (open.length) show(open[Math.max(0, i - 1)]);
        else clearEditor();
        return;
      }
      if (t.dataset.file) show(t.dataset.file);
      else if (t.dataset.pal) { closePal(); show(t.dataset.pal); }
      else if (t.dataset.hit) { render = false; show(t.dataset.hit, +t.dataset.line); }
      else if (t.dataset.dir) { if (closed.has(t.dataset.dir)) closed.delete(t.dataset.dir); else closed.add(t.dataset.dir); drawTree(); }
      else if (t.dataset.tab) show(t.dataset.tab);
      else {
        const act = t.dataset.ide;
        if (act === "close") close();
        else if (act === "side") { if (matchMedia("(max-width: 760px)").matches) box.classList.toggle("side-open"); else setSide(!prefs.side); }
        else if (act === "p-files" || act === "p-search") {
          const p = act.slice(2);
          if (prefs.side && panel === p && !matchMedia("(max-width: 760px)").matches) setSide(false);
          else { setSide(true); setPanel(p); if (p === "search") $$('[data-in="search"]').focus(); }
        }
        else if (act === "collapse") { for (const p of paths) { const parts = p.split("/"); for (let i = 1; i < parts.length; i++) closed.add(parts.slice(0, i).join("/") + "/"); } drawTree(); }
        else if (act === "quick") openPal();
        else if (act === "render") { render = !render; drawDoc(); }
        else if (act === "wrap") toggleWrap();
        else if (act === "font+") font(1);
        else if (act === "font-") font(-1);
        else if (act === "find-next") stepFind(1);
        else if (act === "find-prev") stepFind(-1);
        else if (act === "find-close") closeFind();
        else if (act === "preview") togglePreview();
        else if (act === "p-reload") showPreview(prevPage);
        else if (act === "p-phone") { prevWidth = prevWidth ? "" : "390px"; t.classList.toggle("on", !!prevWidth); const f = $$(".ide-pframe iframe"); if (f) f.style.width = prevWidth; }
        else if (act === "zip") zipProject(files, name).catch((err) => alert("Không tạo được file .zip: " + err.message));
        else if (act === "run") { close(); onRun(); }
        else if (act === "copy" && active) copy(files.get(active)).then(() => { t.innerHTML = ICON_CHECK; setTimeout(() => (t.innerHTML = ICON_COPY), 1500); });
        else if (act === "dl" && active) saveBlob(new Blob([files.get(active)], { type: (MIME[extOf(active)] || "text/plain") + ";charset=utf-8" }), active.split("/").pop());
      }
    });
    box.addEventListener("input", (e) => {
      const which = e.target.dataset?.in;
      if (which === "filter") { filter = e.target.value.trim().toLowerCase(); drawTree(); }
      else if (which === "search") runSearch();
      else if (which === "find") runFind();
      else if (which === "pal") { palAt = 0; drawPal(); }
    });
    $$(".ide-prev select").addEventListener("change", (e) => showPreview(e.target.value));
    document.body.append(box);
    setSide(prefs.side && !matchMedia("(max-width: 760px)").matches ? true : prefs.side);
    setPanel("files");
    status();
    show(mainPage(files) || paths.find((p) => /(^|\/)readme\.md$/i.test(p)) || paths[0]);
    ed.focus();
  }

  // ---------- Xuất file PowerPoint, Excel, Word ----------
  // Mô hình viết nội dung (JSON cho pptx và xlsx, Markdown cho docx), trang tạo file thật ngay trong trình duyệt.
  const FILE_KINDS = { pptx: ["PowerPoint", "pptx"], xlsx: ["Excel", "xlsx"], docx: ["Word", "doc"] };
  const PPTX_LIB = "https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";
  // JSON do mô hình viết đôi khi có dấu phẩy thừa hoặc chú thích: sửa nhẹ trước khi đọc.
  function parseLoose(text) {
    try { return JSON.parse(text); } catch {}
    try { return JSON.parse(text.replace(/^\s*\/\/.*$/gm, "").replace(/,\s*([}\]])/g, "$1").replace(/,\s*$/, "")); } catch { return null; }
  }
  const fileName = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d")
    .replace(/[^\w-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "tai-lieu";
  function fileCard(kind, code) {
    const [label, ext] = FILE_KINDS[kind];
    let name, summary, preview;
    if (kind === "docx") {
      if (!code.trim()) return "";
      name = (code.match(/^#+\s+(.+)$/m)?.[1] || "Tài liệu").replace(/[*_`]/g, "").trim();
      summary = `${code.split(/\s+/).filter(Boolean).length.toLocaleString("vi-VN")} chữ`;
      preview = `<div class="content file-doc">${markdown(code)}</div>`;
    } else {
      const spec = parseLoose(code);
      if (kind === "pptx") {
        const slides = Array.isArray(spec?.slides) ? spec.slides : [];
        if (!slides.length) return "";
        name = spec.title || slides[0].title || "Bài thuyết trình";
        summary = `${slides.length} slide`;
        preview = `<ol class="file-outline">${slides.map((x) => `<li>${esc(String(x?.title || "(không tên)"))}</li>`).join("")}</ol>`;
      } else {
        const sheets = Array.isArray(spec?.sheets) ? spec.sheets.filter((x) => Array.isArray(x?.rows)) : [];
        if (!sheets.length) return "";
        name = spec.file || sheets[0].name || "Bảng tính";
        summary = `${sheets.length} trang tính, ${sheets.reduce((n, x) => n + x.rows.length, 0)} dòng`;
        const rows = sheets[0].rows;
        preview = `<div class="file-table"><table>${rows.slice(0, 15).map((r, i) => `<tr>${(Array.isArray(r) ? r : [r]).map((c) =>
          `<${i ? "td" : "th"}>${esc(String(c ?? ""))}</${i ? "td" : "th"}>`).join("")}</tr>`).join("")}</table></div>` +
          (rows.length > 15 ? `<small>… và ${rows.length - 15} dòng nữa</small>` : "");
      }
    }
    return `<div class="file-card" data-file="${kind}"><div class="file-head"><span class="file-badge ${kind}">${ext.toUpperCase()}</span>` +
      `<span class="file-name"><b>${esc(String(name))}</b><small>${label} · ${summary}</small></span>` +
      (kind === "pptx"
        ? `<span class="file-btns"><button type="button" class="btn primary" data-file-show>${ICON_PLAY}Trình chiếu</button>` +
          `<button type="button" class="btn" data-file-dl>${ICON_DOWN}PowerPoint</button><button type="button" class="btn" data-file-html>${ICON_DOWN}HTML</button></span>`
        : `<button type="button" class="btn primary" data-file-dl>${ICON_DOWN}Tải về</button>`) + `</div>` +
      `<details><summary>Xem nội dung</summary>${preview}</details><pre class="file-src" hidden>${esc(code)}</pre></div>`;
  }
  const saveBlob = (blob, name) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  // ---------- Bộ khung trình chiếu ----------
  // Mô hình chỉ viết nội dung (JSON); thiết kế, hiệu ứng và file do khung này lo, nên slide luôn đẹp và đồng bộ.
  // Một nội dung cho ra: trình chiếu HTML có hiệu ứng (xem ngay trong chat, tải về), và file PowerPoint có hiệu ứng chuyển slide.
  const DECK_THEMES = {
    midnight: { bg: "0F172A", text: "F1F5F9", muted: "94A3B8", accent: "38BDF8", accent2: "A78BFA", surface: "1E293B" },
    ocean: { bg: "F0F9FF", text: "0C4A6E", muted: "475569", accent: "0284C7", accent2: "14B8A6", surface: "FFFFFF" },
    sunset: { bg: "FFF7ED", text: "431407", muted: "78716C", accent: "EA580C", accent2: "DB2777", surface: "FFFFFF" },
    forest: { bg: "F0FDF4", text: "14532D", muted: "4B5563", accent: "16A34A", accent2: "CA8A04", surface: "FFFFFF" },
    minimal: { bg: "FFFFFF", text: "111827", muted: "6B7280", accent: "111827", accent2: "6366F1", surface: "F3F4F6" },
    corporate: { bg: "FFFFFF", text: "1E293B", muted: "64748B", accent: "1D4ED8", accent2: "0EA5E9", surface: "F1F5F9" },
    neon: { bg: "09090B", text: "FAFAFA", muted: "A1A1AA", accent: "22D3EE", accent2: "F472B6", surface: "18181B" },
    warm: { bg: "FFFBEB", text: "451A03", muted: "78716C", accent: "B45309", accent2: "DC2626", surface: "FFFFFF" },
  };
  function deckTheme(spec) {
    const t = spec.theme, o = t && typeof t === "object" ? t : {};
    const base = DECK_THEMES[typeof t === "string" ? t.toLowerCase() : o.preset] || DECK_THEMES.midnight;
    const hex = (c, d) => (/^#?[0-9a-f]{6}$/i.test(String(c || "")) ? String(c).replace("#", "").toUpperCase() : d);
    const th = {};
    for (const k of Object.keys(base)) th[k] = hex(o[k], base[k]);
    th.font = typeof o.font === "string" ? o.font : "Arial";
    return th;
  }
  // Biểu tượng SVG Lucide (https://lucide.dev, giấy phép ISC): slide ghi tên (ví dụ "rocket"), trang tải SVG về một lần rồi tô theo màu bộ màu.
  // Không phải tên Lucide (ví dụ emoji) thì hiện nguyên văn.
  const LUCIDE = "https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/";
  const iconCache = {};
  const isIconName = (v) => /^[a-z0-9]+(-[a-z0-9]+)*$/.test(String(v || ""));
  async function loadDeckIcons(spec) {
    const names = new Set();
    for (const sl of deckList(spec.slides)) {
      if (isIconName(sl?.icon)) names.add(sl.icon);
      for (const x of [...deckList(sl?.cards), ...deckList(sl?.stats), ...deckList(sl?.timeline)]) if (isIconName(x?.icon)) names.add(x.icon);
    }
    await Promise.all([...names].filter((n) => !(n in iconCache)).map(async (n) => {
      try {
        const r = await fetch(LUCIDE + n + ".svg");
        iconCache[n] = r.ok ? (await r.text()).replace(/<!--[\s\S]*?-->/g, "").replace(/\s+/g, " ").replace(/ class="[^"]*"/, "").trim() : "";
      } catch { iconCache[n] = ""; }
    }));
  }
  const deckIcon = (v) => (isIconName(v) ? (iconCache[v] || "").replace("<svg", '<svg class="ic" aria-hidden="true"') : v ? `<span class="emoji">${esc(String(v))}</span>` : "");
  // Biểu tượng thành ảnh PNG (cho file PowerPoint), tô một màu.
  async function iconPng(name, color, size = 192) {
    const svg = iconCache[name];
    if (!svg) return null;
    const url = URL.createObjectURL(new Blob([svg.replace(/currentColor/g, "#" + color).replace(/width="24"/, `width="${size}"`).replace(/height="24"/, `height="${size}"`)], { type: "image/svg+xml" }));
    try {
      const img = new Image();
      await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
      const c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, 0, 0, size, size);
      return c.toDataURL("image/png");
    } catch { return null; } finally { URL.revokeObjectURL(url); }
  }
  // Kiểu của một slide: theo layout ghi rõ, không thì đoán theo nội dung có trong slide.
  const slideKind = (sl, idx) => (["title", "section", "quote", "end"].includes(sl.layout) ? sl.layout
    : sl.stats ? "stats" : sl.cards ? "cards" : sl.timeline ? "timeline" : sl.chart ? "chart" : sl.table ? "table"
    : sl.left || sl.right ? "two" : sl.quote ? "quote" : idx === 0 && !sl.bullets ? "title" : "bullets");
  const deckList = (v) => (Array.isArray(v) ? v : v == null ? [] : [v]);
  const deckPlain = (t) => String(t ?? "").replace(/\*\*(.+?)\*\*/g, "$1");
  const deckFmt = (t) => esc(String(t ?? "")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const DECK_PALETTE = (th) => [th.accent, th.accent2, "F59E0B", "10B981", "EF4444", "8B5CF6", "EC4899"];

  // Biểu đồ SVG cho bản HTML (cột, đường, vùng, tròn, vành khuyên), có hiệu ứng vẽ dần.
  function deckChartSvg(chart, th) {
    const labels = deckList(chart.labels).map(String), series = deckList(chart.series).slice(0, 4);
    const colors = DECK_PALETTE(th).map((c) => "#" + c), type = String(chart.type || "bar");
    const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
    const fmtN = (v) => num(v).toLocaleString("vi-VN", { maximumFractionDigits: 2 });
    if (/pie|doughnut/.test(type)) {
      const vals = deckList(series[0]?.values).map(num), total = vals.reduce((a, b) => a + b, 0) || 1;
      const ring = type === "doughnut", r = ring ? 120 : 80, sw = ring ? 56 : 160;
      let acc = 0;
      const arcs = vals.map((v, i) => {
        const pct = (v / total) * 100, seg = `<circle class="arc" r="${r}" cx="200" cy="200" fill="none" stroke="${colors[i % colors.length]}" stroke-width="${sw}" pathLength="100" ` +
          `stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${-acc}" style="--d:${i * 120}ms" transform="rotate(-90 200 200)"/>`;
        acc += pct;
        return seg;
      }).join("");
      const legend = labels.map((l, i) => `<g transform="translate(430 ${90 + i * 46})"><rect width="22" height="22" rx="6" fill="${colors[i % colors.length]}"/>` +
        `<text x="34" y="17" class="lg">${esc(l)} · ${Math.round((num(vals[i]) / total) * 100)}%</text></g>`).join("");
      return `<svg viewBox="0 0 820 400" class="chart">${arcs}${legend}</svg>`;
    }
    const all = series.flatMap((s) => deckList(s.values).map(num)), max = Math.max(1, ...all), n = Math.max(1, labels.length);
    const X0 = 70, Y0 = 340, W = 720, H = 290, step = W / n;
    let g = "";
    for (let k = 0; k <= 4; k++) {
      const y = Y0 - (H * k) / 4;
      g += `<line x1="${X0}" x2="${X0 + W}" y1="${y}" y2="${y}" class="grid"/><text x="${X0 - 10}" y="${y + 6}" class="ax" text-anchor="end">${fmtN((max * k) / 4)}</text>`;
    }
    labels.forEach((l, i) => { g += `<text x="${X0 + step * (i + 0.5)}" y="${Y0 + 30}" class="ax" text-anchor="middle">${esc(l)}</text>`; });
    if (/line|area/.test(type)) {
      series.forEach((s, si) => {
        const pts = deckList(s.values).map((v, i) => [X0 + step * (i + 0.5), Y0 - (num(v) / max) * H]);
        if (!pts.length) return;
        const line = pts.map((p) => p.join(",")).join(" ");
        if (type === "area") g += `<polygon class="area" points="${X0 + step / 2},${Y0} ${line} ${pts.at(-1)[0]},${Y0}" fill="${colors[si]}" style="--d:${si * 200}ms"/>`;
        g += `<polyline class="draw" points="${line}" fill="none" stroke="${colors[si]}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="--d:${si * 200}ms"/>`;
        g += pts.map((p, i) => `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="8" fill="${colors[si]}" style="--d:${600 + i * 90}ms"/>`).join("");
      });
    } else {
      const bw = (step * 0.7) / Math.max(1, series.length);
      series.forEach((s, si) => deckList(s.values).forEach((v, i) => {
        const h = (num(v) / max) * H, x = X0 + step * i + step * 0.15 + bw * si;
        g += `<rect class="bar" x="${x}" y="${Y0 - h}" width="${bw - 6}" height="${h}" rx="6" fill="${colors[si]}" style="--d:${i * 90 + si * 60}ms"/>` +
          `<text x="${x + (bw - 6) / 2}" y="${Y0 - h - 10}" class="val" text-anchor="middle" style="--d:${500 + i * 90}ms">${fmtN(v)}</text>`;
      }));
    }
    const legend = series.length > 1 ? series.map((s, i) => `<g transform="translate(${X0 + i * 190} 12)"><rect width="18" height="18" rx="5" fill="${colors[i]}"/>` +
      `<text x="26" y="15" class="lg">${esc(String(s.name || ""))}</text></g>`).join("") : "";
    return `<svg viewBox="0 0 820 390" class="chart">${legend}${g}</svg>`;
  }

  // Bài trình chiếu HTML đứng riêng: chữ hiện dần, chuyển slide mượt, số đếm tăng dần, biểu đồ tự vẽ;
  // phím ← → (hoặc bấm, vuốt) để chuyển, F toàn màn hình, N xem ghi chú.
  function deckHtml(spec) {
    const th = deckTheme(spec), slides = deckList(spec.slides).filter(Boolean), N = slides.length;
    const c = (k) => "#" + th[k];
    let section = 0;
    const a = (i) => `data-a style="--i:${i}"`;
    const ul = (list, from = 0) => `<ul>${deckList(list).map((x, i) => {
      const t = String(x ?? ""), sub = /^\s*-\s+/.test(t);
      return `<li class="${sub ? "sub" : ""}" ${a(from + i)}>${deckFmt(t.replace(/^\s*-\s+/, ""))}</li>`;
    }).join("")}</ul>`;
    // Số liệu nổi bật: tách phần số để đếm tăng dần (1,2 tỷ; 95%; $4.5B…).
    const statValue = (v) => {
      const m = String(v ?? "").match(/^([^\d-]*)(-?[\d.,]+)(.*)$/);
      if (!m) return deckFmt(v);
      let s = m[2];
      s = s.includes(",") && !s.includes(".") ? s.replace(",", ".") : s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : /^\d{1,3}(\.\d{3})+$/.test(s) ? s.replace(/\./g, "") : s;
      const n = Number(s);
      if (!Number.isFinite(n) || (/^(19|20)\d\d$/.test(m[2]) && !m[1] && !m[3])) return deckFmt(v);
      const dec = (s.split(".")[1] || "").length;
      // Phần chữ trước và sau con số (đơn vị như %, nghìn tỷ, triệu) in nhỏ hơn để con số nổi bật và không xuống dòng.
      const unit = (t) => (t.trim() ? `<span class="unit">${esc(t)}</span>` : "");
      return `${unit(m[1])}<span data-count="${n}" data-dec="${dec}">${esc(m[2])}</span>${unit(m[3])}`;
    };
    // Tiêu đề lớn dài thì giảm cỡ chữ.
    const tsize = (t) => { const n = deckPlain(t).length; return n > 60 ? "t3" : n > 38 ? "t2" : ""; };
    // Cỡ chữ số liệu theo độ dài, để con số và đơn vị nằm trên một dòng.
    const statSize = (v) => {
      const t = String(v ?? ""), len = t.replace(/^[^\d-]*(-?[\d.,]+).*$/, "$1").length + t.replace(/[\d.,-]/g, "").length * 0.45;
      return !/\d/.test(t) ? (t.length > 8 ? " long" : "") : len > 7 ? " l3" : len > 5 ? " l2" : "";
    };
    const body = slides.map((sl, idx) => {
      const kind = slideKind(sl, idx);
      const h2 = `<h2 ${a(0)}>${deckFmt(sl.title)}</h2>`;
      let inner = "";
      if (kind === "title" || kind === "end") {
        inner = `<div class="blob b1"></div><div class="blob b2"></div><div class="center${kind === "end" ? " mid" : ""}">` +
          (sl.kicker ? `<div class="kicker" ${a(0)}>${deckFmt(sl.kicker)}</div>` : "") +
          `<h1 class="${tsize(sl.title || spec.title)}" ${a(1)}>${deckFmt(sl.title || spec.title)}</h1>` + (sl.subtitle ? `<p class="sub" ${a(2)}>${deckFmt(sl.subtitle)}</p>` : "") +
          `<div class="rule" ${a(3)}></div></div>` + (isIconName(sl.icon) ? `<div class="hero-ic" ${a(2)}>${deckIcon(sl.icon)}</div>` : "");
      } else if (kind === "section") {
        section++;
        inner = `<div class="blob b1"></div><div class="center"><div class="secnum" ${a(0)}>${esc(String(sl.number ?? String(section).padStart(2, "0")))}</div>` +
          `<h1 class="${tsize(sl.title)}" ${a(1)}>${deckFmt(sl.title)}</h1>` + (sl.subtitle ? `<p class="sub" ${a(2)}>${deckFmt(sl.subtitle)}</p>` : "") + `</div>` +
          (isIconName(sl.icon) ? `<div class="hero-ic" ${a(2)}>${deckIcon(sl.icon)}</div>` : "");
      } else if (kind === "quote") {
        inner = `<div class="blob b2"></div><div class="center"><div class="qmark" ${a(0)}>“</div><blockquote ${a(1)}>${deckFmt(sl.quote || sl.title)}</blockquote>` +
          (sl.author ? `<div class="author" ${a(2)}>— ${deckFmt(sl.author)}</div>` : "") + `</div>`;
      } else if (kind === "two") {
        const col = (t, list, i) => `<div class="col">${t ? `<h3 ${a(i)}>${deckFmt(t)}</h3>` : ""}${ul(list, i + 1)}</div>`;
        inner = h2 + `<div class="two">${col(sl.leftTitle, sl.left, 1)}${col(sl.rightTitle, sl.right, 1)}</div>`;
      } else if (kind === "table") {
        const rows = deckList(sl.table).map(deckList);
        inner = h2 + `<table>${rows.map((r, i) => `<tr ${a(i + 1)}>${r.map((x) => `<${i ? "td" : "th"}>${deckFmt(x)}</${i ? "td" : "th"}>`).join("")}</tr>`).join("")}</table>`;
      } else if (kind === "chart") {
        inner = h2 + `<div class="chartwrap${sl.bullets ? " with" : ""}"><div ${a(1)}>${sl.chart.title ? `<h3>${deckFmt(sl.chart.title)}</h3>` : ""}${deckChartSvg(sl.chart, th)}</div>` +
          (sl.bullets ? ul(sl.bullets, 2) : "") + `</div>`;
      } else if (kind === "stats") {
        inner = h2 + `<div class="grid">${deckList(sl.stats).slice(0, 4).map((x, i) =>
          `<div class="stat" ${a(i + 1)}>${x?.icon ? `<div class="sic">${deckIcon(x.icon)}</div>` : ""}<div class="big${statSize(x?.value)}">${statValue(x?.value)}</div><div class="lab">${deckFmt(x?.label)}</div></div>`).join("")}</div>`;

    let blob = await pptx.write({ outputType: "blob" });
    // Hiệu ứng chuyển slide: thư viện chưa hỗ trợ nên chèn thẳng vào XML của từng slide.

  // Mở hoặc đóng phần trình chiếu ngay dưới thẻ file.

  async function buildXlsx(spec) {
    await loadScript(CDN + "xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.utils.book_new(), used = new Set();
    spec.sheets.filter((x) => Array.isArray(x?.rows)).forEach((sh, i) => {
      // Ô bắt đầu bằng = là công thức (Excel tự tính khi mở file); số dạng chữ như "1.500" vẫn giữ là chữ.
      const rows = sh.rows.map((r) => (Array.isArray(r) ? r : [r]).map((c) => (typeof c === "string" && c.startsWith("=") ? { t: "n", f: c.slice(1) } : c ?? "")));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const ncol = Math.max(1, ...rows.map((r) => r.length));
      ws["!cols"] = Array.from({ length: ncol }, (_, c) => ({ wch: Number(sh.widths?.[c]) ||
        Math.min(50, Math.max(8, ...rows.map((r) => (typeof r[c] === "object" ? 10 : String(r[c] ?? "").length + 2)))) }));
      if (rows.length > 1) ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length - 1, c: ncol - 1 } }) };
      let name = String(sh.name || `Trang ${i + 1}`).replace(/[\[\]:*?/\\]/g, " ").slice(0, 31).trim() || `Trang ${i + 1}`;
      while (used.has(name.toLowerCase())) name = name.slice(0, 28) + " " + (i + 1);
      used.add(name.toLowerCase());
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    let data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    // Công thức chưa có giá trị tính sẵn: bật "tính lại toàn bộ khi mở" để Excel hiện ngay kết quả.
    try {
      const zip = XLSX.CFB.read(new Uint8Array(data), { type: "array" });
      const entry = zip.FileIndex[zip.FullPaths.findIndex((x) => /(^|\/)xl\/workbook\.xml$/.test(x))];
      const xml = new TextDecoder().decode(entry.content);
      if (!xml.includes("<calcPr")) {
        entry.content = new TextEncoder().encode(xml.replace("</workbook>", '<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>'));
        data = XLSX.CFB.write(zip, { fileType: "zip", type: "array" });
      }
    } catch (e) { console.warn("Không bật được tính lại khi mở:", e); }
    saveBlob(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), fileName(spec.file || spec.sheets[0]?.name || "bang-tinh") + ".xlsx");
  }
  // Word mở được file HTML đặt đuôi .doc: dựng từ Markdown, kèm kiểu chữ và bảng cho đẹp.
  function buildDoc(md) {
    const body = markdown(md).replace(/<div class="code-head">[\s\S]*?<\/div>/g, "");
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>tai lieu</title>` +
      `<style>body{font-family:"Times New Roman",serif;font-size:13pt;line-height:1.5}h1{font-size:18pt;text-align:center}h2{font-size:15pt}h3{font-size:13pt}` +
      `table{border-collapse:collapse;width:100%}td,th{border:1px solid #777;padding:4px 8px}th{background:#eee}pre{font-family:Consolas,monospace;font-size:10pt}</style></head><body>${body}</bo` + `dy></html>`; // tách chữ để Live Server không chèn mã vào giữa script
    saveBlob(new Blob(["\ufeff" + html], { type: "application/msword" }), fileName(md.match(/^#+\s+(.+)$/m)?.[1] || "tai-lieu") + ".doc");

  const attChip = (name, info) =>
    `<div class="att"><span class="file-ico">${ICON_FILE}</span><span class="name">${esc(name)}<small>${esc(info)}</small></span></div>`;
  const fileInfo = (f) => (f.zip ? `Dự án nén · ${f.count} file · ` : f.pages ? `${f.pages} trang · ` : "") + `${f.text.length.toLocaleString("vi-VN")} ký tự`;

  async function shrinkImage(file) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); // ảnh PNG trong suốt sẽ có nền trắng thay vì đen
    g.drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close();
    return c.toDataURL("image/jpeg", 0.85);
  }

  // Giải nén file .zip người dùng gửi: lấy các file chữ (code, tài liệu), bỏ thư mục thư viện, file nhị phân và file quá lớn;
  // mỗi file thành một khối có đường dẫn để mô hình đọc được cả dự án và sửa tiếp (thẻ dự án ghép với các file này).
  async function readZip(file) {
    if (!window.JSZip) await loadScript(CDN + "jszip/3.10.1/jszip.min.js");
    const zip = await JSZip.loadAsync(await new Response(file).arrayBuffer()); // đọc qua Response để dữ liệu luôn đúng kiểu của trang
    const entries = Object.values(zip.files).filter((f) => !f.dir && !/(^|\/)(__MACOSX|node_modules|\.git|dist|build|\.next|vendor|venv|\.venv|__pycache__)\//.test(f.name) &&
      !/(^|\/)(\.DS_Store|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$/.test(f.name));
    const files = new Map(), skipped = [];
    let total = 0;
    for (const f of entries.sort((a, b) => a.name.localeCompare(b.name))) {
      const binary = /\.(png|jpe?g|gif|webp|ico|bmp|avif|pdf|zip|rar|7z|gz|tar|mp3|mp4|wav|ogg|webm|mov|woff2?|ttf|otf|eot|exe|dll|so|dylib|class|jar|pyc|o|a|wasm|psd|ai|sketch|docx?|xlsx?|pptx?)$/i.test(f.name);
      if (binary) { skipped.push(f.name); continue; }
      const text = await f.async("string");
      if (/\u0000/.test(text.slice(0, 2000)) || text.length > 200000 || total + text.length > 180000) { skipped.push(f.name); continue; }
      files.set(cleanPath(f.name), text); total += text.length;
    }
    if (!files.size) throw new Error("trong file nén không có file chữ hay code nào đọc được");
    // Bỏ thư mục gốc chung (du-an/…) để đường dẫn gọn như trong dự án.
    const first = [...files.keys()][0].split("/")[0];
    let map = files;
    if ([...files.keys()].every((p) => p.startsWith(first + "/"))) map = new Map([...files].map(([p, c]) => [p.slice(first.length + 1), c]));
    const note = skipped.length ? `\n\n(Bỏ qua ${skipped.length} file nhị phân hoặc quá lớn: ${skipped.slice(0, 12).join(", ")}${skipped.length > 12 ? "…" : ""})` : "";
    return { text: projectDump(map) + note, zip: true, count: map.size };
  }
  async function readFileText(file) {
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext === "pdf") {
      await loadScript(CDN + "pdf.js/3.11.174/pdf.min.js");
      pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + "pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const t = await (await pdf.getPage(i)).getTextContent();
        pages.push(`[Trang ${i}]\n` + t.items.map((x) => x.str + (x.hasEOL ? "\n" : "")).join(""));
        if (pages.join("").length > MAX_FILE_CHARS) break;
      }
      const text = pages.join("\n\n");
      if (!text.replace(/\[Trang \d+\]/g, "").trim()) throw new Error("PDF này là ảnh scan, không có chữ để đọc. Hãy chụp từng trang rồi gửi dạng ảnh");
      return { text, pages: pdf.numPages };
    }
    if (ext === "docx") {
      await loadScript(CDN + "mammoth/1.8.0/mammoth.browser.min.js");
      return { text: (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value };
    }
    if (["xlsx", "xls", "ods"].includes(ext)) {
      await loadScript(CDN + "xlsx/0.18.5/xlsx.full.min.js");
      const wb = XLSX.read(await file.arrayBuffer());
      return { text: wb.SheetNames.map((n) => `[Trang tính ${n}]\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n") };
    }
    if (ext === "zip") return readZip(file);
    if (["doc", "ppt", "pptx", "rar", "7z", "exe", "mp3", "mp4"].includes(ext)) throw new Error("định dạng này chưa đọc được");
    const text = await file.text();
    if (/\u0000/.test(text.slice(0, 2000))) throw new Error("định dạng này chưa đọc được");
    return { text };
  }

  async function addFiles(list) {
    for (const file of list) {
      const isImage = file.type.startsWith("image/");
      if (isImage && attached.filter((a) => a.kind === "image").length >= MAX_IMAGES) { alert(`Mỗi tin nhắn gửi tối đa ${MAX_IMAGES} ảnh.`); continue; }
      const item = { kind: isImage ? "image" : "file", name: file.name, loading: true };
      attached.push(item); paintAttachments();
      try {
        if (isImage) item.url = await shrinkImage(file);
        else {
          const r = await readFileText(file);
          item.text = r.zip || r.text.length <= MAX_FILE_CHARS ? r.text : r.text.slice(0, MAX_FILE_CHARS) + "\n…(file quá dài, phần sau đã bị cắt)";
          item.pages = r.pages;
          if (r.zip) { item.zip = true; item.count = r.count; }
        }
        item.loading = false;
      } catch (e) {
        attached = attached.filter((a) => a !== item);
        alert(`Không đọc được ${file.name}: ${e.message}.`);
      }
      paintAttachments();
    }
  }

  function paintAttachments() {

    }).join("");
    if (!controller) els.send.disabled = !els.input.value.trim() && !attached.length;
  }

  // Nội dung gửi cho mô hình: chữ của file đặt trước câu hỏi; ảnh gửi kèm theo dạng của API OpenAI.
  function apiContent(m, withImages) {
    let text = (m.files || []).filter((f) => f.text).map((f) => f.zip
      ? `Dự án người dùng gửi (giải nén từ "${f.name}", ${f.count} file), mỗi file một khối có đường dẫn. Khi sửa, chỉ viết lại trọn những file thay đổi, đúng đường dẫn:\n\n${f.text}\n\n`
      : `Nội dung file "${f.name}":\n\`\`\`\n${f.text}\n\`\`\`\n\n`).join("") + m.content;
    if (m.refImages?.length) text = "(Người dùng đính kèm ảnh do bạn tạo trước đó và muốn sửa ảnh này.)\n" + text;
    const n = (m.images?.length || 0) + (m.imagesDropped || 0);
    if (!withImages || !m.images?.length) return n ? `(Người dùng đã gửi ${n} ảnh ở đây.)\n${text}` : text;
    return [{ type: "text", text }, ...m.images.map((url) => ({ type: "image_url", image_url: { url } }))];

  // Mức suy nghĩ: nhanh (tắt suy nghĩ dài), cân bằng, kỹ (suy nghĩ tối đa và tự chấm lại), tối đa (3 mô hình giải song song).
  const LEVELS = {
    fast: ["Nhanh", "Trả lời ngay, không suy nghĩ dài. Hợp chào hỏi, câu đơn giản"],
    normal: ["Cân bằng", "Suy nghĩ bình thường. Hợp hầu hết câu hỏi"],
    careful: ["Kỹ", "Phân tích đề → giải → mô hình khác soát lỗi → sửa. Mất khoảng 1–3 phút"],
    max: ["Tối đa", "Phân tích đề → 3 mô hình giải song song → kiểm tra chéo → tổng hợp → kiểm tra lần cuối. Mất 3–8 phút"],
    ultra: ["Ultra", "Hết công suất: 4 mô hình giải, trao đổi suy luận nhiều vòng tới khi thống nhất → giám khảo tổng hợp → kiểm tra chéo → tinh chỉnh → kiểm tra lần cuối. " +
      "Việc lập trình (làm web, app, game, công cụ) thì làm như lập trình viên chuyên nghiệp: kế hoạch Markdown → phản biện → code theo từng giai đoạn, chạy thử sau mỗi giai đoạn → " +
      "rà soát code chéo → sửa → chạy thử toàn bộ. Lưu ý: chạy RẤT LÂU (khoảng 6–30 phút), chỉ dùng cho bài khó hoặc việc lớn"],
  };
  // Cài đặt cũ chỉ có nút Nghĩ kỹ bật/tắt: đang bật thì chuyển thành mức Tối đa.
  if ("deep" in settings) { if (settings.deep) settings.level = "max"; delete settings.deep; store.set("glm.settings", settings); }
  if (!LEVELS[settings.level]) settings.level = "normal";
  // Khung chọn mức: tên mức ở trên, thanh trượt 5 nấc ở dưới (kéo, bấm hoặc dùng phím mũi tên).
  const LEVEL_KEYS = Object.keys(LEVELS);
  const deepBtn = $("deep"), levelPop = $("levelMenu");
  const paintDeep = () => {
    const [name, desc] = LEVELS[settings.level], i = LEVEL_KEYS.indexOf(settings.level);
    $("lpName").textContent = name;
    $("lpDesc").textContent = desc;
    $("lpDesc").classList.toggle("warn", settings.level === "ultra"); // Ultra chạy rất lâu: mô tả màu cam để lưu ý
    $("lpInput").value = i;
    $("lpInput").setAttribute("aria-valuetext", name);
    $("lpRange").style.setProperty("--f", i / (LEVEL_KEYS.length - 1));
    $("lpRange").classList.toggle("hot", settings.level === "ultra");
    $("lpLabels").innerHTML = LEVEL_KEYS.map((k, j) => `<button type="button" data-lv="${k}" class="${j === i ? "on" : ""}">${LEVELS[k][0]}</button>`).join("");
    deepBtn.title = `Mức suy nghĩ: ${name}`;
    deepBtn.classList.toggle("on", ["careful", "max", "ultra"].includes(settings.level));
    if (!levelPop.hidden) placeLevels(); // mô tả dài ngắn khác nhau nên căn lại vị trí
  };
  // Đặt khung phía trên nút, mép phải thẳng với mép phải của nút.
  const placeLevels = () => {
    const r = deepBtn.getBoundingClientRect();
    levelPop.style.left = Math.max(16, Math.min(r.right - levelPop.offsetWidth, innerWidth - levelPop.offsetWidth - 16)) + "px";
    levelPop.style.top = Math.max(16, r.top - levelPop.offsetHeight - 10) + "px";
  };
  const closeLevels = () => { levelPop.hidden = true; deepBtn.setAttribute("aria-expanded", "false"); };
  deepBtn.onclick = (e) => {
    e.stopPropagation();
    if (!levelPop.hidden) { closeLevels(); return; }
    toggleModelMenu(null);
    levelPop.hidden = false;
    deepBtn.setAttribute("aria-expanded", "true");
    paintDeep();
    $("lpInput").focus();
  };
  $("lpInput").oninput = (e) => {
    settings.level = LEVEL_KEYS[Number(e.target.value)];
    store.set("glm.settings", settings);
    paintDeep();
  };
  $("lpLabels").onclick = (e) => {
    const b = e.target.closest("[data-lv]");
    if (b) { settings.level = b.dataset.lv; store.set("glm.settings", settings); paintDeep(); }
  };
  // Bấm vào tên mức: hiện hoặc ẩn giải thích của cả 4 mức.
  $("lpTitle").onclick = () => {
    const more = $("lpMore"), open = more.hidden;
    more.hidden = !open;
    $("lpTitle").setAttribute("aria-expanded", String(open));
    more.innerHTML = LEVEL_KEYS.map((k) => `<p><b>${LEVELS[k][0]}</b>: ${LEVELS[k][1]}</p>`).join("");
    placeLevels();
  };
  document.addEventListener("click", (e) => { if (!e.target.closest("#levelMenu")) closeLevels(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !levelPop.hidden) { closeLevels(); deepBtn.focus(); } });
  paintDeep();

  $("newChat").onclick = newChat;
  $("newChatIcon").onclick = newChat;
  $("closeSide").onclick = () => els.sidebar.classList.add("hidden");
  $("openSide").onclick = () => els.sidebar.classList.remove("hidden");
  if (innerWidth <= 768) els.sidebar.classList.add("hidden");

  els.thread.addEventListener("click", async (e) => {
    const imgBtn = e.target.closest("[data-img]");
    if (imgBtn) { imageAction(imgBtn); return; }
    const fileBtn = e.target.closest("[data-file-dl]");
    if (fileBtn) { downloadFile(fileBtn.closest(".file-card"), fileBtn); return; }
    const showBtn = e.target.closest("[data-file-show]");
    if (showBtn) { showDeck(showBtn.closest(".file-card"), showBtn); return; }
    const htmlBtn = e.target.closest("[data-file-html]");
    if (htmlBtn) {
      const card = htmlBtn.closest(".file-card"), spec = parseLoose(card.querySelector(".file-src").textContent);
      loadDeckIcons(spec).then(() => saveBlob(new Blob([deckHtml(spec)], { type: "text/html" }), fileName(spec.file || spec.title || "bai-trinh-chieu") + ".html"));
      return;
    }
    const ideBtn = e.target.closest("[data-proj-ide]");
    if (ideBtn) {
      const node = ideBtn.closest(".msg"), card = ideBtn.closest(".file-card"), files = node?._project;
      if (!files) return;
      const run = card.querySelector("[data-proj-run]");
      openIde(files, card.querySelector(".file-name b").textContent, run ? () => { if (!card.nextElementSibling?.classList.contains("proj-preview")) run.click(); } : null, node._projectPrev);
      return;
    }
    const projBtn = e.target.closest("[data-proj-run], [data-proj-zip]");
    if (projBtn) {
      const node = projBtn.closest(".msg"), card = projBtn.closest(".file-card"), files = node?._project;
      if (!files) return;
      if (projBtn.matches("[data-proj-zip]")) {
        zipProject(files, card.querySelector(".file-name b").textContent).catch((err) => alert("Không tạo được file .zip: " + err.message));
      } else projBtn.innerHTML = `${ICON_PLAY}${runProject(files, card) ? "Đóng chạy thử" : "Chạy thử"}`;
      return;
    }
    // Đổi khổ xem trước: điện thoại, máy tính bảng, máy tính.
    const sizeBtn = e.target.closest("[data-size]");
    if (sizeBtn) {
      const box = sizeBtn.closest(".preview");
      box.querySelector("iframe").style.width = sizeBtn.dataset.size ? sizeBtn.dataset.size + "px" : "";
      box.querySelectorAll("[data-size]").forEach((b) => b.classList.toggle("on", b === sizeBtn));
      return;
    }
    const prevBtn = e.target.closest("[data-preview], [data-download], [data-full]");
    if (prevBtn) { codePreview(prevBtn); return; }
    const runBtn = e.target.closest("[data-run]");
    if (runBtn) { runCodeBlock(runBtn); return; }
    if (e.target.closest("[data-run-close]")) { e.target.closest(".run-out").remove(); return; }
    const dlBtn = e.target.closest("[data-dlfile]");
    if (dlBtn) {
      const block = dlBtn.closest(".codeblock"), path = block.dataset.path;
      saveBlob(new Blob([block.querySelector("code").textContent], { type: (MIME[extOf(path)] || "text/plain") + ";charset=utf-8" }), path.split("/").pop());
      return;
    }
    const copyBtn = e.target.closest("[data-copy]");
    if (copyBtn) {
      const code = copyBtn.closest(".codeblock").querySelector("code").textContent;
      await copy(code); flash(copyBtn, `${ICON_CHECK}Đã chép`, `${ICON_COPY}Sao chép`); return;
    }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    const idx = Number(act.closest(".msg").dataset.idx);
    const chat = currentChat();
    if (act.dataset.act === "copy") {
      await copy(splitThink(chat.messages[idx].content).answer.trim());
      flash(act, ICON_CHECK, ICON_COPY);
    } else if (act.dataset.act === "good") {
      const m = chat.messages[idx];
      m.good = !m.good;
      chat.updated = Date.now();
      saveChats();
      paintAssistant(act.closest(".msg"), m, false);
    } else if (act.dataset.act === "regen" && !controller) {
      chat.messages.splice(idx);
      generate(chat);
    } else if (act.dataset.act === "continue" && !controller) {
      // Viết nốt ngay trong câu trả lời này.
      resumeReply(chat, idx);
    } else if (act.dataset.act === "speak") {
      speak(act, splitThink(chat.messages[idx].content).answer);
    }
  });

  // Nút trên ảnh đã tạo.
  async function imageAction(btn) {
    const card = btn.closest(".gen-card"), node = btn.closest(".msg");
    const chat = currentChat(), m = chat?.messages[Number(node.dataset.idx)], i = Number(card.dataset.gen);
    const url = m?.genImages?.[i];
    if (!url) return;
    if (btn.dataset.img === "download") {
      const a = document.createElement("a");
      a.download = `glm-anh-${Date.now()}.${url.startsWith("data:image/png") ? "png" : "jpg"}`;
      try {
        a.href = url.startsWith("data:") ? url : URL.createObjectURL(await (await fetch(url)).blob());
        a.click();
      } catch { openImage(url); }
    } else if (btn.dataset.img === "edit") {
      attached = attached.filter((x) => x.kind !== "ref");
      attached.push({ kind: "ref", name: "Ảnh cần sửa", url });
      paintAttachments();
      if (!els.input.value.trim()) els.input.value = "Sửa ảnh này: ";
      els.input.focus(); els.input.setSelectionRange(els.input.value.length, els.input.value.length);
      autosize();
    } else if (btn.dataset.img === "again" && !controller) {
      controller = new AbortController();
      setBusy(true);
      card.classList.add("busy");
      try {
        const r = await makeImage({ ...m.genMeta[i], edit: false, seed: undefined, count: 1 }, null);
        if (r.images?.length) { m.genImages[i] = r.images[0]; m.genMeta[i] = r.metas[0]; chat.updated = Date.now(); saveChats(); }
        else alert(r.out);
      } catch (e) { if (e.name !== "AbortError") alert(e.message); }
      finally { controller = null; setBusy(false); paintAssistant(node, m, false); }
    }
  }

  // Đọc to câu trả lời bằng giọng có sẵn của máy (ưu tiên giọng tiếng Việt). Bấm lần nữa để dừng.
  let speakingBtn = null;
  function speak(btn, markdownText) {
    const synth = speechSynthesis, wasMe = speakingBtn === btn;
    synth.cancel();
    speakingBtn?.classList.remove("speaking"); speakingBtn = null;
    if (wasMe) return;
    const text = markdownText
      .replace(/```[\s\S]*?```/g, " (đoạn code) ")
      .replace(/\[\[[^\]]*\]\]/g, "")
      .replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1")
      .replace(/[*_#>`|~]/g, "")
      .replace(/\\[()[\]]|\$\$?/g, "")
      .replace(/\n{2,}/g, ". ").trim();
    if (!text) return;
    const lang = /[ăâđêôơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i.test(text) ? "vi-VN" : "en-US";
    const voice = synth.getVoices().find((v) => v.lang.replace("_", "-").startsWith(lang.slice(0, 2)));
    // Đọc từng câu: Chrome hay tự dừng khi một lần đọc quá dài.
    const parts = text.match(/[^.!?\n]+[.!?]*\s*/g) || [text];
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = lang; if (voice) u.voice = voice;
      if (i === parts.length - 1) u.onend = () => { if (speakingBtn === btn) { btn.classList.remove("speaking"); speakingBtn = null; } };
      synth.speak(u);
    });
    btn.classList.add("speaking"); speakingBtn = btn;
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const t = document.createElement("textarea"); t.value = text; document.body.append(t);
      t.select(); document.execCommand("copy"); t.remove();
    }
  }
  // Xem trước trang web/slide/hình trong khung riêng: sandbox không có allow-same-origin nên code không đọc được dữ liệu của trang chat.
  function codePreview(btn) {
    const block = btn.closest(".codeblock");
    if (!block) {
      const frame = btn.closest(".preview").querySelector("iframe");
      frame.requestFullscreen?.().then(() => frame.focus(), () => {});
      return;
    }
    const code = block.querySelector("code").textContent, kind = block.dataset.kind;
    if (btn.matches("[data-download]")) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([code], { type: kind === "svg" ? "image/svg+xml" : "text/html" }));
      a.download = kind === "svg" ? "hinh.svg" : "trang.html";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return;
    }
    const open = block.nextElementSibling?.classList.contains("preview") && block.nextElementSibling;
    if (open) { open.remove(); btn.innerHTML = `${ICON_PLAY}Xem trước`; return; }
    const box = document.createElement("div");
    box.className = "preview";
    box.innerHTML = `<div class="preview-bar"><span class="sizes">` +
      `<button type="button" data-size="390">Điện thoại</button><button type="button" data-size="768">Máy tính bảng</button><button type="button" data-size="" class="on">Máy tính</button></span>` +
      `<button type="button" data-full>${ICON_FULL}Toàn màn hình</button></div>`;
    const frame = document.createElement("iframe");
    frame.sandbox = "allow-scripts allow-modals allow-forms allow-pointer-lock";
    frame.allow = "fullscreen";
    // Trang HTML thuộc một dự án nhiều file: xem cùng CSS, JS, dữ liệu của dự án.
    const files = block.closest(".msg")?._project, path = block.dataset.path;
    frame.srcdoc = kind === "svg" ? `<body style="margin:0;display:grid;place-items:center;min-height:100vh">${code}`
      : files?.has(path) ? bundlePage(files, path) : withShim(code, storageShim());
    frame.onload = () => frame.focus();
    box.append(frame);
    block.after(box);
    btn.innerHTML = `${ICON_PLAY}Đóng xem trước`;
  }
  function flash(btn, on, off) { btn.innerHTML = on; setTimeout(() => (btn.innerHTML = off), 1500); }

  // ---------- Cài đặt ----------
  $("openSettings").onclick = () => {
    $("setProvider").value = currentChoice();
    fillProvider();
    $("setSystem").value = settings.system;
    $("setTemp").value = settings.temperature;
    $("setThink").value = settings.think;
    renderMemories();
    $("trainCount").value = `${trainingExamples().length} câu trả lời đã được thích`;
    renderKb(); paintSync();
    els.settings.showModal();
  };
  els.settings.addEventListener("close", () => {
    if (els.settings.returnValue !== "save") return;
    chooseModel($("setProvider").value);
    settings.system = $("setSystem").value;
    settings.temperature = parseFloat($("setTemp").value) || 0.6;
    settings.think = $("setThink").value;
    store.set("glm.settings", settings);
    paintProvider(); checkServer(); renderThread();
  });
  function fillProvider() {
    const sel = $("setProvider");
    if (!sel.options.length) {
      for (const id of Object.keys(PROVIDERS)) {
        const g = document.createElement("optgroup");
        g.label = PROVIDERS[id].name;
        for (const m of PROVIDERS[id].models) g.append(new Option(modelTitle(id, m), `${id}:${m}`));
        sel.append(g);
      }
      sel.value = currentChoice();
    }
    $("modelHelp").textContent = PROVIDERS[sel.value.split(":")[0]].modelHelp;
  }
  $("setProvider").addEventListener("change", fillProvider);

  function renderMemories() {
    const list = $("memList");
    list.innerHTML = memories.length ? "" : '<li class="empty-mem">Chưa có ghi nhớ nào.</li>';
    for (const m of memories) {
      const li = document.createElement("li");
      const text = document.createElement("span"); text.textContent = m.text;
      const del = document.createElement("button");
      del.type = "button"; del.className = "icon-btn"; del.title = "Xoá"; del.innerHTML = ICON_TRASH;
      del.onclick = () => { memories = memories.filter((x) => x.id !== m.id); saveMemories(); renderMemories(); };
      li.append(text, del); list.append(li);
    }
  }
  const memSubmit = () => { addMemory($("memInput").value); $("memInput").value = ""; renderMemories(); };
  $("memAdd").onclick = memSubmit;
  $("memInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); memSubmit(); } });

  // Mỗi câu được thích thành một ví dụ: cả đoạn hội thoại trước đó, và câu trả lời kèm phần suy nghĩ trong <think>.
  function trainingExamples() {
    const out = [];
    for (const c of chats) {
      c.messages.forEach((m, i) => {
        if (m.role !== "assistant" || !m.good) return;
        const messages = c.messages.slice(0, i).map((x) => ({ role: x.role, content: splitThink(x.content).answer.trim() }));
        const think = (m.reasoning || "").trim();
        messages.push({ role: "assistant", content: (think ? `<think>${think}</think>` : "") + splitThink(m.content).answer.trim() });
        out.push({ messages });
      });
    }
    return out;
  }
  $("exportTrain").onclick = () => {
    const rows = trainingExamples();
    if (!rows.length) { alert("Chưa có câu trả lời nào được thích."); return; }
    const blob = new Blob([rows.map((r) => JSON.stringify(r)).join("\n") + "\n"], { type: "application/jsonl" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "data.jsonl"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  $("clearAll").onclick = () => {
    if (!confirm("Xoá toàn bộ lịch sử chat?")) return;
    for (const c of chats) syncState.deleted[c.id] = Date.now();
    saveSync();
    chats = []; saveChats(); els.settings.close(); newChat();
  };

  // ---------- Trạng thái ----------
  function checkServer() {
    setStatus("ok", `${PROVIDERS[settings.provider].name} · ${modelTitle(settings.provider, cloudModel())}`);
  }
  function setStatus(cls, text) { els.statusDot.className = "dot " + cls; els.statusText.textContent = text; }
  paintProvider();
  checkServer();

  // ---------- Web app ----------
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  let installEvent = null;
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvent = e; $("installBtn").hidden = false; });
  addEventListener("appinstalled", () => { $("installBtn").hidden = true; });
  $("installBtn").onclick = async () => {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null; $("installBtn").hidden = true;
  };

  renderHistory();
  renderThread();
})();
</script>
</body>
</html>
