<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astra AI</title>
<meta name="description" content="Astra AI: trợ lý AI tiếng Việt miễn phí, suy nghĩ kỹ, giải toán, viết code, làm website, tra cứu. Không cần tài khoản.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Astra">
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f9f9f9;
    --surface: #f4f4f4;
    --hover: #ececec;
    --border: #e5e5e5;
    --text: #0d0d0d;
    --muted: #6b6b6b;
    --accent: #0d0d0d;
    --accent-text: #ffffff;
    --code-bg: #f6f6f6;
    --danger: #d93025;
    --ok: #10a37f;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
    --scroll: #c8c8c8;
    --brand: #0a78d1; --brand-2: #0f9f8f; --brand-soft: rgba(10,120,209,.07); --ring: rgba(10,120,209,.2);
    --hl-kw: #a626a4; --hl-str: #50a14f; --hl-num: #b76b01; --hl-fn: #4078f2; --hl-type: #c18401; --hl-meta: #0184bc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121; --sidebar: #171717; --surface: #303030; --hover: #2a2a2a;
      --border: #3a3a3a; --text: #ececec; --muted: #a0a0a0; --accent: #ececec;
      --accent-text: #0d0d0d; --code-bg: #171717; --shadow: 0 2px 12px rgba(0,0,0,.3);
      --scroll: #4a4a4a; color-scheme: dark;
      --brand: #4fb0ff; --brand-2: #3fd2bf; --brand-soft: rgba(79,176,255,.12); --ring: rgba(79,176,255,.25);
    --hl-kw: #c678dd; --hl-str: #98c379; --hl-num: #d19a66; --hl-fn: #61afef; --hl-type: #e5c07b; --hl-meta: #56b6c2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #212121; --sidebar: #171717; --surface: #303030; --hover: #2a2a2a;
    --border: #3a3a3a; --text: #ececec; --muted: #a0a0a0; --accent: #ececec;
    --accent-text: #0d0d0d; --code-bg: #171717; --shadow: 0 2px 12px rgba(0,0,0,.3);
    --scroll: #4a4a4a; color-scheme: dark;
    --brand: #4fb0ff; --brand-2: #3fd2bf; --brand-soft: rgba(79,176,255,.12); --ring: rgba(79,176,255,.25);
    --hl-kw: #c678dd; --hl-str: #98c379; --hl-num: #d19a66; --hl-fn: #61afef; --hl-type: #e5c07b; --hl-meta: #56b6c2;
  }

  * { box-sizing: border-box; }
  /* Thanh cuộn mảnh, nền trong suốt, theo màu giao diện sáng/tối. */
  * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* Sidebar */
  .sidebar {
    width: 260px; background: var(--sidebar); display: flex; flex-direction: column;
    padding: 8px; gap: 4px; transition: margin-left .2s ease; flex-shrink: 0;
  }
  .sidebar.hidden { margin-left: -260px; }
  .side-top { display: flex; justify-content: space-between; align-items: center; padding: 4px; }
  .icon-btn { padding: 8px; border-radius: 8px; display: inline-flex; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .new-chat {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; font-weight: 500; text-align: left; width: 100%;
  }
  .new-chat:hover { background: var(--hover); }
  .history-label { font-size: 12px; color: var(--muted); padding: 16px 12px 6px; font-weight: 500; }
  .history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .history-search { margin: 8px 4px 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; outline: 0; }
  .history-search:focus { border-color: var(--muted); }
  .history .no-result { color: var(--muted); font-size: 13px; padding: 8px 12px; }
  .mic.on { color: #fff; background: #d93025; border-color: #d93025; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(217,48,37,.2); } }
  .msg.user .edit-btn { opacity: 0; transition: opacity .15s; }
  .msg.user:hover .edit-btn, .msg.user .edit-btn:focus { opacity: 1; }
  @media (hover: none) { .msg.user .edit-btn { opacity: .6; } }
  .msg.user .user-row { display: flex; align-items: flex-start; gap: 4px; justify-content: flex-end; max-width: 100%; }
  .edit-box { width: min(100%, 640px); background: var(--surface); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .edit-box textarea { width: 100%; min-height: 80px; border: 0; outline: 0; resize: vertical; background: transparent; color: var(--text); font: inherit; }
  .edit-box .row { display: flex; justify-content: flex-end; gap: 8px; }
  .edit-box .row button { padding: 6px 14px; border-radius: 999px; font-size: 14px; border: 1px solid var(--border); }
  .edit-box .row .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .actions .icon-btn.speaking { color: #0b7fd6; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .history-item {
    display: flex; align-items: center; border-radius: 10px; font-size: 14px; position: relative;
  }
  .history-item:hover, .history-item.active { background: var(--hover); }
  .history-item .title {
    flex: 1; padding: 8px 12px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .history-item .more { opacity: 0; padding: 6px; margin-right: 4px; border-radius: 6px; color: var(--muted); }
  .history-item:hover .more, .history-item.active .more { opacity: 1; }
  .history-item .more:hover { color: var(--text); }
  .history-item .more svg { width: 16px; height: 16px; }
  @media (hover: none) { .history-item .more { opacity: .7; } }
  .history-item .pin { width: 12px; height: 12px; color: var(--muted); flex-shrink: 0; margin-left: 10px; }
  .chat-menu { position: fixed; z-index: 40; min-width: 180px; padding: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.16); display: flex; flex-direction: column; }
  .chat-menu button { text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .chat-menu button:hover { background: var(--hover); }
  .chat-menu .danger { color: var(--danger); }
  .gen-img { display: block; max-width: min(100%, 512px); border-radius: 12px; margin: 0 0 12px; border: 1px solid var(--border); background: var(--surface); min-height: 120px; }
  .gen-img-gone { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .sync-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .05em; }
  .side-bottom { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 8px 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--danger); }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; height: 56px; }
  .hero-logo { width: 56px; height: 56px; border-radius: 15px; margin-bottom: -12px; }
  /* Menu chọn mô hình và chọn chế độ: thẻ có ô biểu tượng màu, mục đang chọn được tô nền và viền. */
  .model-menu { position: fixed; z-index: 30; max-height: calc(100vh - 32px); overflow-y: auto; width: min(372px, calc(100vw - 32px)); padding: 8px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 18px 48px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.06);
    animation: menu-in .16s ease-out both; scrollbar-width: thin; }
  .model-menu.modes { width: min(440px, calc(100vw - 32px)); }
  @keyframes menu-in { from { opacity: 0; transform: translateY(6px) scale(.985); } }
  .menu-head { padding: 8px 10px 6px; }
  .menu-head b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .menu-head small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .model-menu .group { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 10px 6px; }
  .model-menu .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 12px;
    border: 1px solid transparent; transition: background .12s, border-color .12s, transform .12s; }
  .model-menu .opt:hover { background: var(--hover); }
  .model-menu .opt:active { transform: scale(.99); }
  .model-menu .opt:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
  .model-menu .opt[aria-checked="true"] { background: var(--hover); border-color: var(--border); }
  /* Ô biểu tượng đơn sắc (kiểu Grok): nền trung tính, viền mảnh; mục đang chọn thì đảo màu. */
  .opt-ic { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); transition: background .15s, color .15s, border-color .15s; }
  .opt:hover .opt-ic, .mode-card:hover .opt-ic { border-color: var(--muted); }
  .opt[aria-checked="true"] > .opt-ic, .mode-card.on .opt-ic { background: var(--text); color: var(--bg); border-color: var(--text); }
  .opt-ic svg { width: 19px; height: 19px; }
  .opt-tx { flex: 1; min-width: 0; }
  .model-menu b { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 600; font-size: 14px; }
  .model-menu small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }
  .model-menu small.opt-sub { color: var(--text); opacity: .8; font-weight: 500; margin-top: 1px; }
  .model-menu .st { font-style: normal; font-weight: 600; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; }
  .model-menu .st:empty { display: none; }
  .model-menu .st.ok { color: var(--ok); background: rgba(16,163,127,.12); }
  .model-menu .st.busy { color: var(--danger); background: rgba(217,48,37,.1); }
  .model-menu .st.wait { color: var(--muted); background: var(--surface); }
  .model-menu .tick { margin-left: auto; flex: none; width: 22px; height: 22px; padding: 4px; border-radius: 50%; color: var(--bg); background: var(--text);
    opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
  .model-menu [aria-checked="true"] .tick { opacity: 1; transform: none; }
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 2px 2px; }
  .mode-grid .opt { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; border: 1px solid var(--border); position: relative; }
  .mode-grid .opt .tick { position: absolute; top: 10px; right: 10px; }
  @media (max-width: 420px) { .mode-grid { grid-template-columns: 1fr; } .mode-grid .opt { flex-direction: row; align-items: center; } .mode-grid .opt .tick { position: static; } }
  /* Nút chọn trong khung chat: ô biểu tượng nhỏ cùng màu với mục đang chọn. */
  .chip-ic { display: inline-flex; }
  .chip-ic .opt-ic { width: 20px; height: 20px; border: 0; background: none; color: inherit; }
  .chip-ic .opt-ic svg { width: 16px; height: 16px; }
  .deep.chip[aria-expanded="true"] { background: var(--brand-soft); color: var(--brand); }
  /* Thẻ chọn chế độ ở màn hình chào. */
  .mode-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(640px, 100%); margin-top: 18px; }
  .mode-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px 12px; border-radius: 16px; border: 1px solid var(--border);
    background: var(--bg); text-align: center; transition: border-color .15s, background .15s, transform .15s, box-shadow .15s; }
  .mode-card:hover { transform: translateY(-2px); border-color: var(--muted); box-shadow: 0 8px 22px rgba(0,0,0,.08); }
  .mode-card:focus-visible { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
  .mode-card.on { border-color: var(--text); background: var(--surface); }
  .mode-card .opt-ic { width: 40px; height: 40px; border-radius: 13px; }
  .mode-card b { font-size: 14px; font-weight: 650; }
  .mode-card small { font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .mode-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mode-exs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(640px, 100%); margin-top: 4px; }
  .mode-ex { font-size: 13px; color: var(--muted); padding: 7px 12px; border-radius: 999px; border: 1px dashed var(--border); background: transparent;
    max-width: 100%; text-align: left; transition: color .15s, border-color .15s, background .15s; }
  .mode-ex:hover { color: var(--text); border-style: solid; border-color: var(--ring); background: var(--brand-soft); }
  @media (max-width: 560px) { .mode-ex:nth-child(n+3) { display: none; } }
  @media (prefers-reduced-motion: reduce) { .model-menu, .mode-card, .model-menu .opt, .model-menu .tick { animation: none; transition: none; } }
  .brand-ai { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); letter-spacing: .04em; }
  .topbar .spacer { flex: 1; }
  .open-side { display: none; }
  .sidebar.hidden ~ .main .open-side { display: inline-flex; }

  .scroll { flex: 1; overflow-y: auto; }
  .thread { max-width: 768px; margin: 0 auto; padding: 16px 24px 32px; }

  .empty {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 24px; gap: 28px;
  }
  .empty h1 { font-size: 28px; font-weight: 600; margin: 0; text-align: center; letter-spacing: -.01em; }

  .msg { margin: 24px 0; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--surface); padding: 10px 18px; border-radius: 22px; max-width: 75%;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.assistant .content { word-wrap: break-word; }
  .msg.assistant .actions { display: flex; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity .15s; }
  .msg.assistant:hover .actions, .msg.assistant:last-child .actions { opacity: 1; }
  .actions .icon-btn { padding: 6px; }
  .actions .icon-btn.good { color: var(--text); }
  .actions .icon-btn.good svg { fill: currentColor; }
  .actions svg { width: 16px; height: 16px; }
  .meta { font-size: 12px; color: var(--muted); align-self: center; margin-left: 6px; }

  .think { margin-bottom: 12px; }
  .think summary {
    cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; display: inline-flex;
    align-items: center; gap: 6px; user-select: none;
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::after { content: "›"; font-size: 18px; line-height: 1; transition: transform .15s; }
  .think[open] summary::after { transform: rotate(90deg); }
  .think .think-body {
    border-left: 2px solid var(--border); padding: 2px 0 2px 14px; margin-top: 8px;
    color: var(--muted); font-size: 14px; white-space: pre-wrap;
  }
  .think .think-body.draft { white-space: normal; color: var(--muted); }
  .memo {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 10px; border-radius: 999px;
    background: var(--surface); color: var(--muted); font-size: 13px;
  }
  .memo svg { width: 14px; height: 14px; color: var(--ok); }
  .dlg-body { max-height: 70vh; overflow-y: auto; }
  .check { flex-direction: row !important; align-items: center; gap: 8px !important; font-weight: 400 !important; }
  .check input { width: 16px; height: 16px; }
  .mem-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; max-height: 180px; overflow-y: auto; }
  .mem-list li { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; font-size: 14px; font-weight: 400; }
  .mem-list li + li { border-top: 1px solid var(--border); }
  .mem-list li span { flex: 1; }
  .mem-list .empty-mem { color: var(--muted); padding: 10px 12px; }
  .mem-list button svg { width: 16px; height: 16px; }
  .mem-add { display: flex; gap: 8px; }
  .mem-add input { flex: 1; }
  .deep {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px;
    font-size: 14px; color: var(--muted); border: 1px solid var(--border); flex-shrink: 0;
  }
  .deep:hover { background: var(--hover); color: var(--text); }
  .deep.on { color: #0b7fd6; border-color: #0b7fd6; background: rgba(11,127,214,.1); }
  .deep svg { width: 16px; height: 16px; }
  .shimmer {
    background: linear-gradient(90deg, var(--muted) 0%, var(--text) 50%, var(--muted) 100%);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .cursor::after {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--text); margin-left: 4px; vertical-align: middle; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(.6); opacity: .5; } }
  .error { color: var(--danger); font-size: 14px; }

  /* Markdown */
  .content > :first-child { margin-top: 0; }
  .content > :last-child { margin-bottom: 0; }
  .content p { margin: 0 0 12px; }
  .content h1, .content h2, .content h3, .content h4 { margin: 20px 0 8px; line-height: 1.3; font-weight: 600; }
  .content h1 { font-size: 1.5em; } .content h2 { font-size: 1.3em; } .content h3 { font-size: 1.15em; }
  .content ul, .content ol { margin: 0 0 12px; padding-left: 26px; }
  .content li { margin: 4px 0; }
  .content a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .content blockquote { margin: 0 0 12px; padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted); }
  .content hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
  .content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .875em;
    background: var(--surface); padding: 2px 5px; border-radius: 5px;
  }
  .content .math { margin: 0 0 12px; text-align: center; font-style: italic; font-size: 1.05em; overflow-x: auto; }
  .content table { border-collapse: collapse; margin: 0 0 12px; font-size: 14px; display: block; overflow-x: auto; }
  .content th, .content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  .content th { background: var(--surface); font-weight: 600; }
  /* Trình xem code kiểu VS Code (luôn nền tối, màu cú pháp Dark+). */
  /* Trình xem code kiểu VS Code: tối giản, theo giao diện sáng/tối của trang. */
  .ide { --ib: #1f1f1f; --iside: #181818; --ibar: #181818; --iline: #2b2b2b; --ifg: #cccccc; --idim: #8b8b8b; --ihover: rgba(255,255,255,.06); --isel: rgba(255,255,255,.1);
    --iacc: #0078d4; --icode: #d4d4d4; --igut: #6e7681; --icur: rgba(255,255,255,.045); --iadd: #73c991; --imod: #e2c08d; --iflash: rgba(255,200,0,.28);
    --hl-kw: #569cd6; --hl-str: #ce9178; --hl-num: #b5cea8; --hl-fn: #dcdcaa; --hl-type: #4ec9b0; --hl-meta: #9cdcfe;

    animation: menu-in .16s ease-out both; }

    background: var(--bg); color: var(--text); font-weight: 400;
  }
  .dlg-body textarea { resize: vertical; min-height: 70px; }

  .btn { padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; border: 1px solid var(--border); }

  @media (max-width: 768px) {

  }

  /* ---------- Giao diện ---------- */
  body { -webkit-font-smoothing: antialiased; }
  .sidebar { border-right: 1px solid var(--border); }
  .brand { flex: 1; display: flex; align-items: center; gap: 9px; padding: 0 6px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; min-width: 0; }
  .brand img { width: 26px; height: 26px; border-radius: 8px; }
  #newChat { border: 1px solid var(--border); background: var(--bg); margin: 6px 0 2px; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: border-color .15s, background .15s, color .15s; }
  #newChat:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .history-item { transition: background .12s; }
  .history-item.active { background: var(--brand-soft); }
  .history-item.active .title { color: var(--brand); font-weight: 500; }
  .top-title { position: absolute; left: 50%; transform: translateX(-50%); max-width: 46%; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .empty { gap: 12px; }
  .hero-logo { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 8px; box-shadow: 0 12px 32px var(--ring); }
  .empty h1 { font-size: clamp(26px, 4vw, 34px); background: linear-gradient(90deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 2px; }
  .hero-sub { margin: 0; color: var(--muted); text-align: center; max-width: 520px; font-size: 15px; }
  .msg { animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg.assistant { position: relative; padding-left: 44px; }
  .msg.assistant::before { content: ""; position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 9px; background: url(icons/icon.svg) center/cover; box-shadow: 0 2px 10px var(--ring); }
  .msg.user .bubble { background: var(--brand-soft); border: 1px solid var(--ring); border-bottom-right-radius: 8px; }
  .think summary { padding: 3px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; }
  .think summary:hover { color: var(--text); }
  .content a { color: var(--brand); text-decoration-color: var(--ring); }
  .content a:hover { text-decoration-color: currentColor; }
  .content blockquote { border-left-color: var(--brand); }
  .content table { border-radius: 10px; }
  .content tr:nth-child(even) td { background: var(--brand-soft); }
  .content h1, .content h2, .content h3 { letter-spacing: -.01em; }
  .codeblock { border-radius: 14px; }
  .composer { border-radius: 28px; transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring), var(--shadow); }
  .composer.drag { border-color: var(--brand); }
  .send { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 4px 14px var(--ring); transition: opacity .15s, transform .15s; }
  .send:not(:disabled):hover { transform: translateY(-1px); }
  .send:disabled { box-shadow: none; }
  .deep.on { color: var(--brand); border-color: var(--brand); background: var(--brand-soft); }
  .composer-wrap { position: relative; }
  /* Hoàn thiện giao diện (kiểu Grok): đơn sắc, tương phản rõ, viền mảnh; màu thương hiệu chỉ giữ cho logo và đường dẫn. */
  ::selection { background: color-mix(in srgb, var(--text) 18%, transparent); }
  .empty h1 { background: none; -webkit-background-clip: border-box; background-clip: border-box; color: var(--text); font-weight: 600; letter-spacing: -.025em; }
  .hero-logo { box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .composer { background: var(--surface); border-color: var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06); }
  .composer:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring), var(--shadow); } /* giữ hào quang xanh quanh khung chat */
  .composer.drag { border-color: var(--brand); border-style: dashed; }
  /* Nút gửi giữ gradient xanh của thương hiệu (đồng bộ với hào quang quanh khung chat). */
  .send { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 4px 14px var(--ring); }
  .send:not(:disabled):hover { transform: translateY(-1px); opacity: 1; }
  .send:disabled { opacity: .3; box-shadow: none; }
  .deep.on, .deep.chip[aria-expanded="true"] { color: var(--text); border-color: color-mix(in srgb, var(--text) 30%, var(--border)); background: var(--hover); }
  .msg.user .bubble { background: var(--surface); border: 1px solid transparent; border-radius: 22px; border-bottom-right-radius: 8px; }
  .msg.assistant::before { box-shadow: none; }
  #newChat:hover { border-color: color-mix(in srgb, var(--text) 25%, var(--border)); color: var(--text); background: var(--hover); }
  .history-item.active { background: var(--hover); }
  .history-item.active .title { color: var(--text); font-weight: 600; }
  .mode-ex { border-style: solid; background: transparent; }
  .mode-ex:hover { border-color: color-mix(in srgb, var(--text) 25%, var(--border)); background: var(--hover); color: var(--text); }
  .mode-card { transition: border-color .15s, background .15s; }
  .mode-card:hover { transform: none; box-shadow: none; background: var(--hover); }
  .content tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .content blockquote { border-left-color: var(--border); color: var(--muted); }
  .sources a:hover { border-color: color-mix(in srgb, var(--text) 25%, var(--border)); background: var(--hover); }
  .think summary { border: 1px solid var(--border); background: transparent; }
  .think summary:hover { background: var(--hover); }
  :focus-visible { outline-color: color-mix(in srgb, var(--text) 55%, transparent); }
  .to-bottom { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--muted); z-index: 4; }
  .to-bottom:hover { color: var(--text); }
  .to-bottom[hidden] { display: none; }
  .to-bottom svg { width: 18px; height: 18px; }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .sources .src-label { width: 100%; font-size: 12px; color: var(--muted); font-weight: 600; }
  .sources a { display: inline-flex; align-items: center; gap: 6px; max-width: 250px; padding: 4px 10px 4px 6px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 12px; color: var(--text); text-decoration: none; background: var(--bg); transition: border-color .15s, background .15s; }
  .sources a:hover { border-color: var(--brand); background: var(--brand-soft); }
  .sources img { width: 16px; height: 16px; border-radius: 4px; flex: none; }
  .sources span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sources b { font-weight: 600; color: var(--muted); }
  .gen-card { position: relative; display: inline-block; max-width: min(100%, 560px); margin: 0 0 12px; vertical-align: top; }
  .gen-card .gen-img { margin: 0; max-width: 100%; cursor: zoom-in; box-shadow: var(--shadow); }
  .gen-card.busy .gen-img { opacity: .35; filter: blur(2px); transition: opacity .2s, filter .2s; }
  .gen-tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .gen-card:hover .gen-tools, .gen-card:focus-within .gen-tools { opacity: 1; }
  @media (hover: none) { .gen-tools { opacity: 1; } }
  .gen-tools button { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; font-size: 12px; background: rgba(0,0,0,.6); color: #fff; backdrop-filter: blur(6px); }
  .gen-tools button:hover { background: rgba(0,0,0,.82); }
  .gen-tools svg { width: 14px; height: 14px; }
  .gen-cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
  /* Nhiều phiên bản ảnh trên cùng một dòng: hiện thành lưới 2 cột. */
  .content p:has(.gen-card + .gen-card) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .content p:has(.gen-card + .gen-card) .gen-card { max-width: 100%; margin: 0; }
  /* Thẻ file PowerPoint, Excel, Word. */
  .file-card { margin: 0 0 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); overflow: hidden; }
  .file-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .file-badge { flex: none; width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .03em; }
  .file-badge.proj { background: linear-gradient(135deg, #6d28d9, #2563eb); }
  .file-card pre.tree { margin: 8px 0 4px; padding: 10px 12px; border-radius: 10px; background: var(--hover); font-size: 13px; line-height: 1.55; overflow-x: auto; }
  .proj-preview .preview-bar select { max-width: 42%; min-width: 0; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
  .code-head .code-path { font-weight: 600; color: var(--text); }
  .file-badge.pptx { background: #c43e1c; } .file-badge.xlsx { background: #107c41; } .file-badge.docx { background: #185abd; }
  .file-name { flex: 1; min-width: 0; }
  .file-name b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-name small { color: var(--muted); font-size: 12px; }
  .file-card .btn { display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .file-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  @media (max-width: 560px) { .file-head { flex-wrap: wrap; } .file-btns { width: 100%; justify-content: flex-start; } }
  .deck-preview iframe { aspect-ratio: 16 / 9; height: auto; resize: none; background: #000; }
  .file-card .btn svg { width: 16px; height: 16px; }
  .file-card details { border-top: 1px solid var(--border); padding: 8px 14px; }
  .file-card summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .file-outline { margin: 8px 0 4px; padding-left: 22px; font-size: 14px; }
  .file-table { overflow-x: auto; margin-top: 8px; }
  .file-table table { border-collapse: collapse; font-size: 13px; display: table; }
  .file-table th, .file-table td { border: 1px solid var(--border); padding: 4px 8px; white-space: nowrap; }
  .file-table th { background: var(--surface); }
  .file-doc { margin-top: 8px; max-height: 360px; overflow-y: auto; font-size: 14px; }
  dialog { width: min(560px, calc(100vw - 32px)); border-radius: 20px; }
  dialog::backdrop { backdrop-filter: blur(3px); }
  .sec-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); padding-top: 14px; border-top: 1px solid var(--border); }
  .sec-title:first-child { border-top: 0; padding-top: 0; }
  .btn.primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); border-color: transparent; color: #fff; }
  @media (max-width: 768px) {
    .msg.assistant { padding-left: 0; }
    .msg.assistant::before { position: static; display: block; width: 24px; height: 24px; border-radius: 7px; margin-bottom: 8px; }
    .top-title { max-width: 58%; }
  }
  /* Khung chọn mức suy nghĩ: tên mức và thanh trượt 5 nấc. */
  .level-pop { position: fixed; z-index: 30; width: min(340px, calc(100vw - 32px)); padding: 14px 16px 16px; border-radius: 22px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: 0 14px 40px rgba(0,0,0,.28); }
  .level-pop[hidden] { display: none; }
  .lp-title { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; margin-bottom: 12px; font-size: 18px; font-weight: 600; }
  .lp-title svg { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
  .lp-title[aria-expanded="true"] svg { transform: rotate(90deg); }
  .lp-range { --f: .25; --k: 44px; position: relative; height: var(--k); border-radius: 999px; background: rgba(128,128,128,.22); }
  .lp-range::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand);
    width: calc(var(--k) + (100% - var(--k)) * var(--f)); transition: width .15s ease; }
  .lp-dot { position: absolute; top: 50%; left: calc(var(--k) / 2 + (100% - var(--k)) * var(--i) / 4); width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); transform: translate(-50%, -50%); }
  .lp-range input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .lp-range input:focus { outline: none; }
  .lp-range input::-webkit-slider-runnable-track { height: var(--k); background: transparent; }
  .lp-range input::-moz-range-track { height: var(--k); background: transparent; }
  .lp-range input::-webkit-slider-thumb { -webkit-appearance: none; width: var(--k); height: var(--k); border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); cursor: grab; }
  .lp-range input::-moz-range-thumb { width: var(--k); height: var(--k); border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); cursor: grab; }
  .lp-range input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--ring), 0 2px 10px rgba(0,0,0,.35); }
  .lp-range::before { background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
  .lp-range.hot::before { background: linear-gradient(90deg, #f59e0b, #ef4444); }
  .lp-labels { display: grid; grid-template-columns: repeat(5, 1fr); margin: 8px -6px 0; }
  .lp-labels button { font-size: 11.5px; color: var(--muted); padding: 4px 0; border-radius: 8px; transition: color .12s, background .12s; }
  .lp-labels button:hover { color: var(--text); background: var(--hover); }
  .lp-labels button.on { color: var(--brand); font-weight: 650; }
  .lp-desc { margin-top: 12px; font-size: 13px; line-height: 1.45; color: var(--muted); text-align: center; }
  .lp-desc.warn { color: #c2410c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lp-desc.warn { color: #fdba74; } }
  :root[data-theme="dark"] .lp-desc.warn { color: #fdba74; }
  .lp-more { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.45; color: var(--muted); }
  .lp-more p { margin: 0 0 6px; }
  .lp-more b { color: var(--text); font-weight: 600; }

  /* Màn hình hẹp: chip mô hình co lại, nút Nghĩ kỹ chỉ còn biểu tượng để hàng nút không tràn ra ngoài. */
  .deep.chip { flex-shrink: 1; }
  @media (max-width: 480px) {
    #deep, #modeChip { font-size: 0; gap: 0; padding: 0 8px; }
    #modeChip .chev { display: none; }
    .composer-tools { gap: 4px; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="side-top">
    <div class="brand"><img src="icons/icon.svg" alt="">Astra <span class="brand-ai">AI</span></div>
    <button class="icon-btn" id="closeSide" title="Đóng thanh bên">

    </button>
    <button class="icon-btn" id="newChatIcon" title="Đoạn chat mới">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </div>
  <button class="new-chat" id="newChat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Đoạn chat mới
  </button>

  <div class="history" id="history"></div>
  <div class="side-bottom">
    <button class="new-chat" id="installBtn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      Cài thành ứng dụng
    </button>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Đang kết nối…</span></div>
    <button class="new-chat" id="openSettings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      Cài đặt
    </button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="icon-btn open-side" id="openSide" title="Mở thanh bên">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <div class="model-menu" id="modelMenu" role="menu" hidden></div>
    <div class="top-title" id="topTitle"></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="exportBtn" title="Tải đoạn chat này về (Markdown)" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Đổi giao diện sáng/tối">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>

  <div class="scroll" id="scroll">
    <div class="empty" id="empty">
      <img class="hero-logo" src="icons/icon.svg" alt="">
      <h1 id="hello">Hôm nay bạn muốn hỏi gì?</h1>
      <p class="hero-sub" id="heroSub">Giải toán, viết code, tra tin mới, nghiên cứu nhiều nguồn, vẽ và sửa ảnh. Cứ hỏi bằng tiếng Việt.</p>
      <div class="mode-cards" id="modeCards" role="group" aria-label="Chọn chế độ"></div>
      <div class="mode-exs" id="modeEx" aria-label="Câu hỏi mẫu"></div>
    </div>
    <div class="thread" id="thread" hidden></div>
  </div>

  <div class="composer-wrap">
    <button class="to-bottom" id="toBottom" type="button" title="Cuộn xuống cuối" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>
    <form class="composer" id="form">
      <div class="attachments" id="attachments" hidden></div>
      <textarea id="input" rows="1" placeholder="Hỏi Astra bất cứ điều gì" autofocus></textarea>
      <div class="composer-tools">
      <button class="icon-btn attach" id="attachBtn" type="button" title="Thêm ảnh hoặc file (PDF, Word, Excel, code, văn bản)">

      titles: {

        "nemotron-3-ultra": ["Titan 3 Ultra", "Rất thông minh: suy luận, toán và code rất tốt"],

        const order = [...chats.filter((c) => c.id !== currentId), ...chats.filter((c) => c.id === currentId)];
        const victim = order.flatMap((c) => c.messages).find((m) => m.images?.length || m.refImages?.length || m.genImages?.some((u) => u?.startsWith("data:")) || m.files?.some((f) => f.text));
        if (!victim) return;
        if (victim.genImages?.some((u) => u?.startsWith("data:"))) victim.genImages = victim.genImages.map((u) => (u?.startsWith("data:") ? null : u));
        else if (victim.refImages?.length) victim.refImages = [];
        else if (victim.images?.length) { victim.imagesDropped = (victim.imagesDropped || 0) + victim.images.length; victim.images = []; }
        else for (const f of victim.files) if (f.text) { f.text = ""; f.dropped = true; }
      }
    }
  }
  const currentChat = () => chats.find((c) => c.id === currentId);

  // ---------- Theme ----------
  const applyTheme = (t) => {
    if (t) document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  };
  applyTheme(store.get("glm.theme", null));
  $("themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    applyTheme(next);
    store.set("glm.theme", next);
  };

  // ---------- Markdown ----------
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // Đổi LaTeX đơn giản mà mô hình hay viết (\frac, \times, \implies…) thành ký hiệu dễ đọc.
  const TEX = {
    implies: "⇒", Rightarrow: "⇒", rightarrow: "→", to: "→", Leftrightarrow: "⇔", iff: "⇔",
    times: "×", cdot: "·", div: "÷", pm: "±", le: "≤", leq: "≤", ge: "≥", geq: "≥", neq: "≠", ne: "≠",
    approx: "≈", infty: "∞", sum: "∑", prod: "∏", int: "∫", sqrt: "√", pi: "π", alpha: "α", beta: "β",
    gamma: "γ", delta: "δ", Delta: "Δ", theta: "θ", lambda: "λ", mu: "μ", sigma: "σ", omega: "ω",
    in: "∈", forall: "∀", exists: "∃", cup: "∪", cap: "∩", subset: "⊂", circ: "°", ldots: "…", dots: "…",
    quad: " ", qquad: "  ",
  };
  function tex(s) {
    for (let k = 0; k < 3; k++) {
      s = s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1)/($2)")
        .replace(/\\sqrt\{([^{}]*)\}/g, "√($1)")
        .replace(/\\(?:text|mathrm|mathbf|boxed|operatorname)\{([^{}]*)\}/g, "$1");
    }
    return s.replace(/\(([^()+\-*/\s]+)\)\/\(([^()+\-*/\s]+)\)/g, "$1/$2")
      .replace(/\\([A-Za-z]+)/g, (m, w) => TEX[w] ?? m)
      .replace(/\^\{([^{}]*)\}|\^(\w)/g, (_, a, b) => "^" + (a ?? b))
      .replace(/_\{([^{}]*)\}/g, "_$1")
      .replace(/\\[,;! ]/g, " ").replace(/\\left|\\right/g, "").replace(/[{}]/g, "");
  }

  // Công thức: hiện tạm dạng chữ đơn giản, rồi renderMath() thay bằng KaTeX khi câu trả lời đã xong.
  const mathSpan = (raw, display) =>
    `<${display ? "div" : "span"} class="${display ? "math" : "tex"}" data-tex="${esc(raw)}">${esc(tex(raw))}</${display ? "div" : "span"}>`;
  function inline(s) {
    const codes = [], maths = [];
    s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    s = s.replace(/\\\((.+?)\\\)/g, (_, m) => { maths.push(m.trim()); return `\u0001${maths.length - 1}\u0001`; });
    // $...$ chỉ tính là công thức khi bên trong có ký hiệu toán, để "giá $5 và $10" không bị nhầm.
    s = s.replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g, (all, m) => {
      if (!/[\\^_=]/.test(m)) return all;
      maths.push(m); return `\u0001${maths.length - 1}\u0001`;
    });
    s = esc(s)
      .replace(/!\[([^\]]*)\]\(genimg:(\d+)\)/g, '<img class="gen-img" data-gen="$2" alt="$1">')
      .replace(/!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g, '<img class="gen-img" src="$2" alt="$1" loading="lazy" referrerpolicy="no-referrer">')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/__([^_]+)__/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`)
      .replace(/\u0001(\d+)\u0001/g, (_, i) => mathSpan(maths[i], false));
  }

  const CODE_LABELS = { "js-run": "JavaScript · đã chạy", "py-run": "Python · đã chạy", "python-run": "Python · đã chạy", "cpp-run": "C++ · đã chạy", search: "Tra cứu Wikipedia và web", news: "Tin tức", research: "Nghiên cứu sâu", wiki: "Tra cứu Wikipedia", web: "Tìm trên web", read: "Đọc trang web", image: "Tạo ảnh",
    weather: "Thời tiết", rate: "Tỷ giá", papers: "Tìm bài báo khoa học", dev: "Tìm trên Stack Overflow và GitHub", dict: "Tra từ điển", output: "Kết quả" };
  // Ngôn ngữ để tô màu code; khối không có tên ngôn ngữ thì để highlight.js tự đoán.
  const HL_LANG = new Proxy({ "js-run": "javascript", "py-run": "python", "python-run": "python", "cpp-run": "cpp", search: null, news: null, research: null, wiki: null, web: null, read: null, image: null, weather: null, rate: null, papers: null, dev: null, dict: null, output: null, "": "auto" }, {
    get: (t, k) => (k in t ? t[k] : String(k).toLowerCase()),
  });

  // Mở ảnh cỡ lớn trong tab mới (ảnh data: phải chuyển sang blob vì trình duyệt chặn mở thẳng).
  async function openImage(url) {
    if (!url.startsWith("data:")) { open(url, "_blank", "noopener"); return; }
    const blob = await (await fetch(url)).blob();
    open(URL.createObjectURL(blob), "_blank", "noopener");
  }

  // Vẽ công thức toán bằng KaTeX (tải từ cdnjs lần đầu cần), chỉ khi câu trả lời đã xong.
  const KATEX = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/";
  function renderMath(node) {
    const items = node.querySelectorAll("[data-tex]:not([data-done])");
    if (!items.length) return;
    if (!document.querySelector(`link[href^="${KATEX}"]`)) {
      const l = document.createElement("link");
      l.rel = "stylesheet"; l.href = KATEX + "katex.min.css";
      document.head.append(l);
    }
    loadScript(KATEX + "katex.min.js").then(() => {
      for (const el of items) {
        if (!el.isConnected) continue;
        try { katex.render(el.dataset.tex, el, { displayMode: el.tagName === "DIV", throwOnError: false, strict: false }); } catch {}
        el.dataset.done = "1";
      }
    }, () => {});
  }

  // Tô màu code bằng highlight.js, chỉ khi câu trả lời đã xong (tô lúc đang stream sẽ làm trang giật).
  function highlightCode(node) {
    const blocks = node.querySelectorAll("pre code[class^='language-']:not([data-hl])");
    if (!blocks.length) return;
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js").then(() => {
      for (const el of blocks) {
        if (!el.isConnected) continue;
        const lang = el.className.slice(9);
        const r = lang !== "auto" && hljs.getLanguage(lang) ? hljs.highlight(el.textContent, { language: lang }) : hljs.highlightAuto(el.textContent);
        el.innerHTML = r.value; el.dataset.hl = "1";
      }
    }, () => {});
  }

  function markdown(src) {
    const lines = src.replace(/\r\n?/g, "\n").split("\n");
    let html = "", i = 0;
    const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
    const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

    while (i < lines.length) {
      const line = lines[i];
      let m;
      if ((m = line.match(/^\s*```\s*([\w+#.-]*)[\s:]*(.*)$/))) {
        // Dòng mở khối có thể kèm tên file (```css css/style.css, ```js:js/app.js, ```index.html): hiện tên file ở đầu khối.
        const fi = fenceInfo(m[1] + " " + m[2]), path = fi.path;
        let lang = fi.path && m[1].includes(".") ? fi.lang : m[1] === "htm" ? "html" : m[1];
        const buf = []; i++;
        // Dấu đóng khối là ``` đứng riêng; mô hình đôi khi viết dính chữ phía sau (```Đã xong…): vẫn coi là đóng khối,
        // phần chữ phía sau được đọc tiếp như một dòng thường.
        const closes = (l) => /^\s*```\s*$/.test(l) || /^\s*```(?![\w+#.-]*\s*$)/.test(l);
        while (i < lines.length && !closes(lines[i])) buf.push(lines[i++]);
        if (i < lines.length) {
          const rest = lines[i].replace(/^\s*```/, "");
          if (rest.trim()) lines[i] = rest; else i++;
        }
        const code = buf.join("\n"), kind = lang.toLowerCase();
        // Khối pptx, xlsx, docx: hiện thẻ file có nút Tải về (khi đang viết dở, JSON chưa đọc được thì hiện như code bình thường).
        if (FILE_KINDS[kind]) { const card = fileCard(kind, code); if (card) { html += card; continue; } }
        // Hình SVG đã viết xong thì hiện ảnh luôn (thẻ <img> không chạy được script trong SVG).
        if (kind === "svg" && /<\/svg>\s*$/.test(code)) html += `<div class="svg-preview"><img alt="Hình do mô hình vẽ" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(code)}"></div>`;
        const preview = kind === "html" || kind === "svg"
          ? `<button type="button" data-preview>${ICON_PLAY}Xem trước</button><button type="button" data-download>${ICON_DOWN}Tải về</button>` : "";
        // Code Python, JavaScript, C++ (không phải khối công cụ) có nút Chạy ngay trong câu trả lời; khối có tên file có nút Tải file.
        const runner = RUNNABLE[kind] && !preview ? `<button type="button" data-run="${RUNNABLE[kind]}">${ICON_PLAY}Chạy</button>` : "";
        const fileBtn = path && !preview ? `<button type="button" data-dlfile>${ICON_DOWN}Tải file</button>` : "";
        html += `<div class="codeblock"${preview ? ` data-kind="${kind}"` : ""}${path ? ` data-path="${esc(path)}"` : ""}><div class="code-head">` +
          `<span>${esc(CODE_LABELS[lang] || lang || "code")}${path ? ` · <b class="code-path">${esc(path)}</b>` : ""}</span>` +
          `<span class="code-btns">${preview}${runner}${fileBtn}<button type="button" data-copy>${ICON_COPY}Sao chép</button></span></div>` +
          `<pre><code${HL_LANG[lang] ? ` class="language-${HL_LANG[lang]}"` : ""}>${esc(code)}</code></pre></div>`;
        continue;
      }
      if ((m = line.match(/^\s*(\\\[|\$\$)(.*)$/))) {
        const end = m[1] === "$$" ? "$$" : "\\]";
        let body = m[2]; i++;
        if (!body.includes(end)) {
          while (i < lines.length && !lines[i].includes(end)) body += " " + lines[i++].trim();
          if (i < lines.length) body += " " + lines[i++];
        }
        html += mathSpan(body.slice(0, body.lastIndexOf(end) >= 0 ? body.lastIndexOf(end) : undefined).trim(), true);
        continue;
      }
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^(#{1,6})\s+(.*)/))) { const n = Math.min(m[1].length, 4); html += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { html += "<hr>"; i++; continue; }
      if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        const head = cells(line); i += 2;
        let t = "<table><thead><tr>" + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
          t += "<tr>" + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>"; i++;
        }
        html += t + "</tbody></table>"; continue;
      }
      if (/^\s*>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
        html += `<blockquote>${markdown(buf.join("\n"))}</blockquote>`; continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        const ordered = /^\s*\d/.test(line);
        const sameKind = (l) => (m = l.match(/^\s*([-*+]|\d+[.)])\s+(.*)/)) && /\d/.test(m[1]) === ordered;
        const items = [];
        while (i < lines.length) {
          const l = lines[i];
          if (sameKind(l)) { items.push(m[2]); i++; }
          else if (l.trim() && /^\s{2,}/.test(l) && !/^\s*(\\\[|\$\$|```)/.test(l) && items.length) { items[items.length - 1] += "\n" + l.trim(); i++; }
          else if (!l.trim() && i + 1 < lines.length && sameKind(lines[i + 1])) i++;
          else break;
        }
        const tag = ordered ? "ol" : "ul";
        const start = ordered ? parseInt(line, 10) : 1;
        html += `<${tag}${start > 1 ? ` start="${start}"` : ""}>` + items.map((it) => `<li>${inline(it).replace(/\n/g, "<br>")}</li>`).join("") + `</${tag}>`;
        continue;
      }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|([-*+]|\d+[.)])\s+)/.test(lines[i])) buf.push(lines[i++]);
      if (!buf.length) buf.push(lines[i++]);
      html += `<p>${inline(buf.join("\n")).replace(/\n/g, "<br>")}</p>`;
    }
    return html;
  }

  // Tách phần suy nghĩ <think>…</think> khỏi câu trả lời.
  function splitThink(text) {
    const open = text.indexOf("<think>");
    const close = text.indexOf("</think>");
    if (open === -1 && close === -1) return { think: "", answer: text, thinking: false };
    if (close === -1) return { think: text.slice(open + 7), answer: text.slice(0, open), thinking: true };
    const start = open === -1 || open > close ? 0 : open + 7;
    return { think: text.slice(start, close), answer: text.slice(0, open === -1 || open > close ? 0 : open) + text.slice(close + 8), thinking: false };
  }

  // ---------- Render ----------
  function renderHistory() {
    els.history.innerHTML = "";
    $("exportBtn").hidden = !currentChat()?.messages.length;
    $("topTitle").textContent = currentChat()?.messages.length ? currentChat().title || "" : "";
    // Tìm theo tên đoạn chat và nội dung tin nhắn, không phân biệt hoa thường và dấu.
    const fold = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d").toLowerCase();
    const q = fold($("historySearch").value.trim());
    const list = [...chats].sort((a, b) => b.updated - a.updated)
      .filter((c) => !q || fold(c.title || "").includes(q) || c.messages.some((m) => fold(m.content || "").includes(q)));
    if (q && !list.length) els.history.innerHTML = '<div class="no-result">Không tìm thấy đoạn chat nào.</div>';
    // Nhóm: đã ghim, rồi từng thư mục (theo tên), rồi các đoạn chat còn lại.
    const groups = [["Đã ghim", list.filter((c) => c.pinned)]];
    const folders = [...new Set(list.filter((c) => !c.pinned && c.folder).map((c) => c.folder))].sort((a, b) => a.localeCompare(b, "vi"));
    for (const f of folders) groups.push([`📁 ${f}`, list.filter((c) => !c.pinned && c.folder === f)]);
    groups.push(["Gần đây", list.filter((c) => !c.pinned && !c.folder)]);
    for (const [label, items] of groups) {
      if (!items.length) continue;
      const h = document.createElement("div");
      h.className = "history-label"; h.textContent = label;
      els.history.append(h);
      for (const c of items) {
        const item = document.createElement("div");
        item.className = "history-item" + (c.id === currentId ? " active" : "");
        const title = document.createElement("button");
        title.className = "title"; title.textContent = c.title || "Đoạn chat mới";
        title.onclick = () => openChat(c.id);
        const more = document.createElement("button");
        more.className = "more"; more.title = "Tuỳ chọn"; more.innerHTML = ICON_MORE;
        more.onclick = (e) => { e.stopPropagation(); chatMenu(more, c); };
        if (c.pinned) item.insertAdjacentHTML("afterbegin", ICON_PIN);
        item.append(title, more);
        els.history.append(item);
      }
    }
  }

  function renderThread() {
    const chat = currentChat();
    const has = chat && chat.messages.length;
    els.empty.hidden = !!has;
    els.empty.style.display = has ? "none" : "";
    els.thread.hidden = !has;
    els.thread.innerHTML = "";
    $("toBottom").hidden = true;
    if (!has) {
      const h = new Date().getHours();
      $("hello").textContent = `Chào buổi ${h < 11 && h >= 4 ? "sáng" : h < 13 && h >= 4 ? "trưa" : h < 18 && h >= 4 ? "chiều" : "tối"}, mình giúp gì được bạn?`;
      return;
    }
    chat.messages.forEach((m, idx) => els.thread.append(m.role === "user" ? userNode(m, idx) : assistantNode(m, idx)));
    scrollDown(true);
  }

  function userNode(m, idx) {
    const d = document.createElement("div");
    d.className = "msg user";
    d.dataset.idx = idx;
    if (m.images?.length || m.refImages?.length || m.files?.length || m.imagesDropped) {
      const a = document.createElement("div");
      a.className = "attachments";
      a.innerHTML = [...(m.refImages || []), ...(m.images || [])].map((u) => `<div class="att image"><img alt="Ảnh đính kèm" src="${u}"></div>`).join("") +
        (m.files || []).map((f) => attChip(f.name, f.dropped ? "Đã xoá nội dung để tiết kiệm bộ nhớ" : fileInfo(f))).join("") +
        (m.imagesDropped ? attChip(`${m.imagesDropped} ảnh`, "Đã xoá để tiết kiệm bộ nhớ") : "");
      d.append(a);
    }
    const row = document.createElement("div");
    row.className = "user-row";
    row.innerHTML = `<button class="icon-btn edit-btn" type="button" title="Sửa rồi hỏi lại">${ICON_EDIT}</button>`;
    const b = document.createElement("div");
    b.className = "bubble"; b.textContent = m.content;
    row.append(b);
    d.append(row);
    row.querySelector(".edit-btn").onclick = () => editMessage(d, idx);
    return d;
  }

  // Sửa câu hỏi đã gửi: các tin nhắn phía sau bị bỏ, rồi mô hình trả lời lại câu đã sửa (ảnh/file đính kèm được giữ).
  function editMessage(node, idx) {
    if (controller) return;
    const chat = currentChat(), m = chat.messages[idx];
    const row = node.querySelector(".user-row");
    const box = document.createElement("div");
    box.className = "edit-box";
    box.innerHTML = `<textarea></textarea><div class="row"><button type="button" data-cancel>Huỷ</button><button type="button" class="primary" data-save>Gửi</button></div>`;
    const ta = box.querySelector("textarea");
    ta.value = m.content;
    row.replaceWith(box);
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    box.querySelector("[data-cancel]").onclick = () => renderThread();
    const save = () => {
      const text = ta.value.trim();
      if (!text) return;
      m.content = text;
      chat.messages.splice(idx + 1);
      chat.updated = Date.now();
      saveChats(); renderHistory(); renderThread();
      generate(chat);
    };
    box.querySelector("[data-save]").onclick = save;
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); save(); }
      if (e.key === "Escape") renderThread();
    });
  }

  function assistantNode(m, idx) {
    const d = document.createElement("div");
    d.className = "msg assistant";
    d.dataset.idx = idx;
    paintAssistant(d, m, false);
    return d;
  }

  function paintAssistant(node, m, streaming) {
    // Khi đang stream mà chưa có chữ trả lời, phần reasoning vẫn chưa kết thúc.
    const closed = !streaming || m.content ? "</think>" : "";
    const raw = (m.reasoning ? `<think>${m.reasoning}${closed}` : "") + (m.content || "");
    const { think, answer, thinking } = splitThink(raw);
    // Đường nhanh khi đang suy nghĩ: chỉ cập nhật chữ, không dựng lại cả khối HTML.
    const live = node.querySelector(".think[data-live] > .think-body");
    if (streaming && thinking && live && !m.notice) { live.textContent = think.trim(); return; }
    let html = "";
    const drafts = m.drafts || (m.draft ? [m.draft] : []);
    drafts.forEach((dr, i) => {
      const d = splitThink((dr.reasoning ? `<think>${dr.reasoning}</think>` : "") + dr.content);
      const secs = dr.thinkSecs ? `, suy nghĩ ${dr.thinkSecs} giây` : "";
      const name = esc(dr.label || (drafts.length > 1 ? `Lời giải nháp ${i + 1}` : "Bản nháp đầu tiên")) + (dr.model ? ` (${esc(dr.model)})` : "");

      const cited = (s) => (answer.includes(s.url) ? 0 : 1);
      const list = [...m.sources].sort((a, b) => cited(a) - cited(b)).slice(0, 8);
      html += `<div class="sources"><span class="src-label">Nguồn</span>` + list.map((s, i) => {

    if (m.kb?.length) html += `<div class="memo">${ICON_BOOK}Dùng kho kiến thức: ${esc(m.kb.join(", "))}</div>`;

    node._project = null;
    if (!streaming) {
      const chat = [genChat, currentChat()].find((c) => c?.messages.includes(m));
      const files = chat && projectAt(chat, chat.messages.indexOf(m));
      if (files) { node._project = files; node._projectPrev = projectBefore(chat, chat.messages.indexOf(m)); html += projectCard(files, chat); }

    const keepOpen = prev && prev.dataset.user ? prev.open : null;
    node.innerHTML = html;
    node.querySelectorAll(".draft").forEach((el) => el.parentElement.classList.add("is-draft"));

    if (det && keepOpen !== null) { det.open = keepOpen; det.dataset.user = "1"; }

      if (url) {
        img.src = url; img.title = "Bấm để mở ảnh cỡ lớn"; img.onclick = () => openImage(url);

        const meta = m.genMeta?.[i];

  function nearBottom() {
    const s = els.scroll;
    return s.scrollHeight - s.scrollTop - s.clientHeight < 120;
  }
  function scrollDown(force) { if (force || nearBottom()) els.scroll.scrollTop = els.scroll.scrollHeight; }
  els.scroll.addEventListener("scroll", () => { $("toBottom").hidden = nearBottom(); }, { passive: true });

  async function send(text) {
    text = text.trim();
    if (controller || (!text && !attached.length)) return;
    if (attached.some((a) => a.loading)) return;
    const images = attached.filter((a) => a.kind === "image").map((a) => a.url);
    const files = attached.filter((a) => a.kind === "file").map(({ name, text, pages, zip, count }) => ({ name, text, pages, ...(zip ? { zip, count } : {}) }));
    const refImages = attached.filter((a) => a.kind === "ref").map((a) => a.url);
    if (!text && refImages.length && !images.length) text = "Vẽ lại ảnh này đẹp hơn.";
    if (!text) text = images.length ? "Hãy mô tả và phân tích ảnh này." : "Hãy tóm tắt nội dung file này.";
    attached = []; paintAttachments();
    let chat = currentChat();
    if (!chat) {
      chat = { id: Date.now().toString(36), title: text.slice(0, 50), messages: [], updated: Date.now() };
      chats.push(chat); currentId = chat.id;
    }
    const msg = { role: "user", content: text };
    if (images.length) msg.images = images;
    if (refImages.length) msg.refImages = refImages;
    if (files.length) msg.files = files;
    chat.messages.push(msg);
    chat.updated = Date.now();
    saveChats(); renderHistory();
    els.input.value = ""; autosize();
    await generate(chat);
  }
