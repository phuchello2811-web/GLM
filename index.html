<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLM Chat</title>
<meta name="description" content="Trò chuyện miễn phí với các mô hình GLM, không cần API key hay tài khoản.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GLM">
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f9f9f9;
    --surface: #f4f4f4;
    --hover: #ececec;
    --border: #e5e5e5;
    --text: #0d0d0d;
    --muted: #6b6b6b;
    --accent: #0d0d0d;
    --accent-text: #ffffff;
    --code-bg: #f6f6f6;
    --danger: #d93025;
    --ok: #10a37f;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
    --scroll: #c8c8c8;
    --hl-kw: #a626a4; --hl-str: #50a14f; --hl-num: #b76b01; --hl-fn: #4078f2; --hl-type: #c18401; --hl-meta: #0184bc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121; --sidebar: #171717; --surface: #303030; --hover: #2a2a2a;
      --border: #3a3a3a; --text: #ececec; --muted: #a0a0a0; --accent: #ececec;
      --accent-text: #0d0d0d; --code-bg: #171717; --shadow: 0 2px 12px rgba(0,0,0,.3);
      --scroll: #4a4a4a; color-scheme: dark;
    --hl-kw: #c678dd; --hl-str: #98c379; --hl-num: #d19a66; --hl-fn: #61afef; --hl-type: #e5c07b; --hl-meta: #56b6c2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #212121; --sidebar: #171717; --surface: #303030; --hover: #2a2a2a;
    --border: #3a3a3a; --text: #ececec; --muted: #a0a0a0; --accent: #ececec;
    --accent-text: #0d0d0d; --code-bg: #171717; --shadow: 0 2px 12px rgba(0,0,0,.3);
    --scroll: #4a4a4a; color-scheme: dark;
    --hl-kw: #c678dd; --hl-str: #98c379; --hl-num: #d19a66; --hl-fn: #61afef; --hl-type: #e5c07b; --hl-meta: #56b6c2;
  }

  * { box-sizing: border-box; }
  /* Thanh cuộn mảnh, nền trong suốt, theo màu giao diện sáng/tối. */
  * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* Sidebar */
  .sidebar {
    width: 260px; background: var(--sidebar); display: flex; flex-direction: column;
    padding: 8px; gap: 4px; transition: margin-left .2s ease; flex-shrink: 0;
  }
  .sidebar.hidden { margin-left: -260px; }
  .side-top { display: flex; justify-content: space-between; align-items: center; padding: 4px; }
  .icon-btn { padding: 8px; border-radius: 8px; display: inline-flex; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .new-chat {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; font-weight: 500; text-align: left; width: 100%;
  }
  .new-chat:hover { background: var(--hover); }
  .history-label { font-size: 12px; color: var(--muted); padding: 16px 12px 6px; font-weight: 500; }
  .history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
  .history-search { margin: 8px 4px 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; outline: 0; }
  .history-search:focus { border-color: var(--muted); }
  .history .no-result { color: var(--muted); font-size: 13px; padding: 8px 12px; }
  .mic.on { color: #fff; background: #d93025; border-color: #d93025; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(217,48,37,.2); } }
  .msg.user .edit-btn { opacity: 0; transition: opacity .15s; }
  .msg.user:hover .edit-btn, .msg.user .edit-btn:focus { opacity: 1; }
  @media (hover: none) { .msg.user .edit-btn { opacity: .6; } }
  .msg.user .user-row { display: flex; align-items: flex-start; gap: 4px; justify-content: flex-end; max-width: 100%; }
  .edit-box { width: min(100%, 640px); background: var(--surface); border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .edit-box textarea { width: 100%; min-height: 80px; border: 0; outline: 0; resize: vertical; background: transparent; color: var(--text); font: inherit; }
  .edit-box .row { display: flex; justify-content: flex-end; gap: 8px; }
  .edit-box .row button { padding: 6px 14px; border-radius: 999px; font-size: 14px; border: 1px solid var(--border); }
  .edit-box .row .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .actions .icon-btn.speaking { color: #0b7fd6; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .history-item {
    display: flex; align-items: center; border-radius: 10px; font-size: 14px; position: relative;
  }
  .history-item:hover, .history-item.active { background: var(--hover); }
  .history-item .title {
    flex: 1; padding: 8px 12px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .history-item .more { opacity: 0; padding: 6px; margin-right: 4px; border-radius: 6px; color: var(--muted); }
  .history-item:hover .more, .history-item.active .more { opacity: 1; }
  .history-item .more:hover { color: var(--text); }
  .history-item .more svg { width: 16px; height: 16px; }
  @media (hover: none) { .history-item .more { opacity: .7; } }
  .history-item .pin { width: 12px; height: 12px; color: var(--muted); flex-shrink: 0; margin-left: 10px; }
  .chat-menu { position: fixed; z-index: 40; min-width: 180px; padding: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.16); display: flex; flex-direction: column; }
  .chat-menu button { text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .chat-menu button:hover { background: var(--hover); }
  .chat-menu .danger { color: var(--danger); }
  .gen-img { display: block; max-width: min(100%, 512px); border-radius: 12px; margin: 0 0 12px; border: 1px solid var(--border); background: var(--surface); min-height: 120px; }
  .gen-img-gone { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .sync-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .05em; }
  .side-bottom { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 8px 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--danger); }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; height: 56px; }
  .hero-logo { width: 56px; height: 56px; border-radius: 15px; margin-bottom: -12px; }
  .model-menu { position: fixed; z-index: 30; max-height: calc(100vh - 32px); overflow-y: auto; width: min(340px, calc(100vw - 32px)); padding: 6px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.16); }
  .model-menu .group { font-size: 12px; color: var(--muted); padding: 8px 10px 4px; }
  .model-menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; }
  .model-menu button:hover { background: var(--hover); }
  .model-menu b { display: block; font-weight: 600; font-size: 14px; }
  .model-menu small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  .model-menu .tick { margin-left: auto; width: 18px; height: 18px; flex: none; visibility: hidden; }
  .model-menu [aria-checked="true"] .tick { visibility: visible; }
  .topbar .spacer { flex: 1; }
  .open-side { display: none; }
  .sidebar.hidden ~ .main .open-side { display: inline-flex; }

  .scroll { flex: 1; overflow-y: auto; }
  .thread { max-width: 768px; margin: 0 auto; padding: 16px 24px 32px; }

  .empty {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 24px; gap: 28px;
  }
  .empty h1 { font-size: 28px; font-weight: 600; margin: 0; text-align: center; letter-spacing: -.01em; }

  .msg { margin: 24px 0; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--surface); padding: 10px 18px; border-radius: 22px; max-width: 75%;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.assistant .content { word-wrap: break-word; }
  .msg.assistant .actions { display: flex; gap: 2px; margin-top: 4px; opacity: 0; transition: opacity .15s; }
  .msg.assistant:hover .actions, .msg.assistant:last-child .actions { opacity: 1; }
  .actions .icon-btn { padding: 6px; }
  .actions .icon-btn.good { color: var(--text); }
  .actions .icon-btn.good svg { fill: currentColor; }
  .actions svg { width: 16px; height: 16px; }
  .meta { font-size: 12px; color: var(--muted); align-self: center; margin-left: 6px; }

  .think { margin-bottom: 12px; }
  .think summary {
    cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; display: inline-flex;
    align-items: center; gap: 6px; user-select: none;
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::after { content: "›"; font-size: 18px; line-height: 1; transition: transform .15s; }
  .think[open] summary::after { transform: rotate(90deg); }
  .think .think-body {
    border-left: 2px solid var(--border); padding: 2px 0 2px 14px; margin-top: 8px;
    color: var(--muted); font-size: 14px; white-space: pre-wrap;
  }
  .think .think-body.draft { white-space: normal; color: var(--muted); }
  .memo {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 10px; border-radius: 999px;
    background: var(--surface); color: var(--muted); font-size: 13px;
  }
  .memo svg { width: 14px; height: 14px; color: var(--ok); }
  .dlg-body { max-height: 70vh; overflow-y: auto; }
  .check { flex-direction: row !important; align-items: center; gap: 8px !important; font-weight: 400 !important; }
  .check input { width: 16px; height: 16px; }
  .mem-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; max-height: 180px; overflow-y: auto; }
  .mem-list li { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; font-size: 14px; font-weight: 400; }
  .mem-list li + li { border-top: 1px solid var(--border); }
  .mem-list li span { flex: 1; }
  .mem-list .empty-mem { color: var(--muted); padding: 10px 12px; }
  .mem-list button svg { width: 16px; height: 16px; }
  .mem-add { display: flex; gap: 8px; }
  .mem-add input { flex: 1; }
  .deep {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px;
    font-size: 14px; color: var(--muted); border: 1px solid var(--border); flex-shrink: 0;
  }
  .deep:hover { background: var(--hover); color: var(--text); }
  .deep.on { color: #0b7fd6; border-color: #0b7fd6; background: rgba(11,127,214,.1); }
  .deep svg { width: 16px; height: 16px; }
  .shimmer {
    background: linear-gradient(90deg, var(--muted) 0%, var(--text) 50%, var(--muted) 100%);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .cursor::after {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--text); margin-left: 4px; vertical-align: middle; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(.6); opacity: .5; } }
  .error { color: var(--danger); font-size: 14px; }

  /* Markdown */
  .content > :first-child { margin-top: 0; }
  .content > :last-child { margin-bottom: 0; }
  .content p { margin: 0 0 12px; }
  .content h1, .content h2, .content h3, .content h4 { margin: 20px 0 8px; line-height: 1.3; font-weight: 600; }
  .content h1 { font-size: 1.5em; } .content h2 { font-size: 1.3em; } .content h3 { font-size: 1.15em; }
  .content ul, .content ol { margin: 0 0 12px; padding-left: 26px; }
  .content li { margin: 4px 0; }
  .content a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .content blockquote { margin: 0 0 12px; padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted); }
  .content hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
  .content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .875em;
    background: var(--surface); padding: 2px 5px; border-radius: 5px;
  }
  .content .math { margin: 0 0 12px; text-align: center; font-style: italic; font-size: 1.05em; overflow-x: auto; }
  .content table { border-collapse: collapse; margin: 0 0 12px; font-size: 14px; display: block; overflow-x: auto; }
  .content th, .content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  .content th { background: var(--surface); font-weight: 600; }
  .code-btns { display: inline-flex; gap: 12px; }
  .svg-preview { margin: 0 0 8px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; text-align: center; }
  .svg-preview img { max-width: 100%; max-height: 480px; }
  .preview { margin: -4px 0 12px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .preview-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--surface); }
  .preview-bar button { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .preview-bar button:hover { color: var(--text); }
  .preview-bar svg { width: 14px; height: 14px; }
  .preview iframe { display: block; width: 100%; height: 460px; border: 0; background: #fff; resize: vertical; }
  .codeblock { margin: 0 0 12px; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--border); }
  .codeblock .code-head {
    display: flex; justify-content: space-between; align-items: center; padding: 6px 12px;
    font-size: 12px; color: var(--muted); background: var(--surface);
  }
  .codeblock .code-head button { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .codeblock .code-head button:hover { color: var(--text); }
  .codeblock .code-head svg { width: 14px; height: 14px; }
  .codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
  .codeblock code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }
  /* Màu code (highlight.js), theo giao diện sáng/tối. */
  .hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-meta .hljs-keyword { color: var(--hl-kw); }
  .hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute .hljs-string { color: var(--hl-str); }
  .hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--hl-num); }
  .hljs-comment, .hljs-quote, .hljs-deletion { color: var(--muted); font-style: italic; }
  .hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--hl-fn); }
  .hljs-type, .hljs-title.class_, .hljs-attr, .hljs-attribute, .hljs-variable.language_, .hljs-params { color: var(--hl-type); }
  .hljs-meta, .hljs-tag, .hljs-selector-class, .hljs-selector-id { color: var(--hl-meta); }

  /* Composer */
  .composer-wrap { padding: 0 24px 12px; }
  .composer {
    max-width: 768px; margin: 0 auto; background: var(--surface); border-radius: 26px;
    padding: 12px 10px 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .composer textarea {
    border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
    font: inherit; max-height: 200px; padding: 4px 10px; line-height: 1.5;
  }
  .composer-tools { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .composer.drag { border-color: #0b7fd6; }
  .attach { width: 36px; height: 36px; justify-content: center; border: 1px solid var(--border); border-radius: 50%; flex-shrink: 0; }
  .attach svg { width: 18px; height: 18px; }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6px; }
  .att { position: relative; display: inline-flex; align-items: center; gap: 8px; max-width: 220px; height: 56px; padding: 0 12px 0 8px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg); font-size: 13px; }
  .att.image { width: 56px; padding: 0; overflow: hidden; }
  .att.image img { width: 100%; height: 100%; object-fit: cover; }
  .att .file-ico { width: 34px; height: 34px; border-radius: 8px; background: #0b7fd6; color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .att .file-ico svg { width: 18px; height: 18px; }
  .att .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att small { display: block; color: var(--muted); font-size: 11px; }
  .att .rm { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-size: 13px; line-height: 1; }
  .att.loading { opacity: .6; }
  .msg.user { flex-direction: column; align-items: flex-end; gap: 6px; }
  .msg.user .attachments { justify-content: flex-end; padding: 0; }
  .msg.user .att.image { width: auto; height: auto; max-width: min(260px, 70%); }
  .msg.user .att.image img { max-height: 260px; width: auto; }
  .composer-tools .spacer { flex: 1; }
  .deep.chip { min-width: 0; }
  .deep.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deep.chip .chev { width: 14px; height: 14px; }
  .composer textarea::placeholder { color: var(--muted); }
  .send {
    width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    display: inline-flex; align-items: center; justify-content: center; transition: opacity .15s;
  }
  .send:disabled { opacity: .3; cursor: default; }
  .send svg { width: 18px; height: 18px; }
  .footnote { text-align: center; font-size: 12px; color: var(--muted); padding-top: 8px; }

  /* Settings dialog */
  dialog {
    border: 1px solid var(--border); border-radius: 16px; padding: 0; background: var(--bg); color: var(--text);
    width: min(480px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { margin: 0; font-size: 18px; }
  .dlg-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .dlg-body label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
  .dlg-body small { color: var(--muted); font-weight: 400; }
  .dlg-body input, .dlg-body textarea, .dlg-body select {
    font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); font-weight: 400;
  }
  .dlg-body textarea { resize: vertical; min-height: 70px; }
  .dlg-body small a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; }
  .btn { padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; border: 1px solid var(--border); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  @media (max-width: 768px) {
    .sidebar { position: absolute; z-index: 10; height: 100%; box-shadow: var(--shadow); }
    .thread { padding: 16px 16px 24px; }
    .composer-wrap { padding: 0 12px 10px; }
    .msg.user .bubble { max-width: 85%; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="side-top">
    <button class="icon-btn" id="closeSide" title="Đóng thanh bên">

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const els = {
    sidebar: $("sidebar"), history: $("history"), scroll: $("scroll"), empty: $("empty"), thread: $("thread"),
    form: $("form"), input: $("input"), send: $("send"), sendIcon: $("sendIcon"),
    statusDot: $("statusDot"), statusText: $("statusText"), settings: $("settings"),
  };

  const ICON_SEND = '<path d="M12 19V5M5 12l7-7 7 7"/>';
  const ICON_STOP = '<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/>';
  const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const ICON_REDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>';
  const ICON_THUMB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>';
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg>';
  const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>';
  const ICON_FULL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const ICON_MORE = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
  const ICON_PIN = '<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 7 4 3v2H6v-2l4-3z"/></svg>';
  const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

  // ---------- Lưu trữ ----------
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
    },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  };

  // Địa chỉ Cloudflare Worker giữ API key Z.ai chung (xem worker/README.md). Để trống thì ẩn lựa chọn này.
  const SHARED_URL = "https://glm.phuchello2811.workers.dev/";

  const settings = Object.assign(
    { system: "", temperature: 0.6, maxTokens: 8192, think: "collapsed", deep: false, tools: true,
      provider: "shared", models: {} },
    store.get("glm.settings", {})
  );
  // Các nguồn mô hình, đều miễn phí và không cần API key. Tất cả dùng API kiểu OpenAI nên chung một cách gọi.
  const PROVIDERS = {
    shared: {
      name: "GLM miễn phí",
      url: SHARED_URL,
      // Phải khớp FREE_MODELS trong worker/worker.js.
      models: ["glm-4.7-flash", "glm-4.5-flash", "glm-4.6v-flash"],
      // Mô hình đọc được ảnh: câu hỏi có ảnh luôn gửi tới đây.
      vision: "glm-4.6v-flash",
      titles: {
        "glm-4.7-flash": ["GLM-4.7 Flash", "Mạnh nhất, giỏi suy luận và viết code"],
        "glm-4.5-flash": ["GLM-4.5 Flash", "Ít bị quá tải hơn, trả lời nhanh"],
        "glm-4.6v-flash": ["GLM-4.6V Flash", "Đọc được ảnh, hay bị quá tải"],
      },
      modelHelp: "Dùng chung máy chủ của trang, không cần key hay tài khoản. Tối đa 20 câu hỏi mỗi phút. Mô hình đang quá tải thì tự chuyển sang mô hình khác.",
      extra: { thinking: { type: "enabled" } },
    },
  };
  // Cài đặt cũ có thể còn trỏ tới nguồn đã bỏ (máy này, Pollinations, Z.ai, OpenRouter, Puter) hoặc còn lưu API key.
  delete settings.keys; delete settings.server;
  // Mặc định cũ 4096 hay làm câu trả lời bị cắt khi mô hình nghĩ lâu; máy chủ chung cho tối đa 8192.
  if (settings.maxTokens === 4096) settings.maxTokens = 8192;
  if (!PROVIDERS[settings.provider]) settings.provider = "shared";
  for (const id in settings.models) if (!PROVIDERS[id]?.models.includes(settings.models[id])) delete settings.models[id];
  store.set("glm.settings", settings);
  const cloudModel = () => settings.models[settings.provider] || PROVIDERS[settings.provider].models[0];

  const modelTitle = (id, m) => PROVIDERS[id].titles[m][0];
  // Mỗi lựa chọn mô hình là một cặp nguồn:mô hình.
  const currentChoice = () => `${settings.provider}:${cloudModel()}`;

  function paintProvider() {
    const persona = currentPersona();
    $("chipTitle").textContent = modelTitle(settings.provider, cloudModel()) + (persona.id === "default" ? "" : ` · ${persona.name}`);
    $("footnote").textContent = `Tin nhắn được gửi tới máy chủ của ${PROVIDERS[settings.provider].name}. Mô hình có thể trả lời sai, hãy kiểm tra thông tin quan trọng.`;
  }
  function chooseModel(key) {
    const [id, m] = key.split(/:(.*)/);
    settings.provider = id;
    settings.models[id] = m;
    store.set("glm.settings", settings);
    paintProvider(); checkServer();
  }

  // Menu chọn mô hình, mở từ nút trong khung chat.
  const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  let menuAnchor = null;
  function toggleModelMenu(anchor) {
    const menu = $("modelMenu");
    if (menuAnchor) menuAnchor.setAttribute("aria-expanded", "false");
    if (!anchor || anchor === menuAnchor) { menu.hidden = true; menuAnchor = null; return; }
    let html = "";
    for (const id of Object.keys(PROVIDERS)) {
      html += `<div class="group">${PROVIDERS[id].name}</div>`;
      for (const m of PROVIDERS[id].models) {
        const [title, desc] = PROVIDERS[id].titles[m];
        html += `<button role="menuitemradio" data-key="${id}:${m}" aria-checked="${`${id}:${m}` === currentChoice()}"><span><b>${title}</b><small>${desc}</small></span>${TICK}</button>`;
      }
    }
    html += `<div class="group">Nhân vật</div>`;
    for (const p of allPersonas()) {
      html += `<button role="menuitemradio" data-persona="${p.id}" aria-checked="${p.id === currentPersona().id}"><span><b>${esc(p.name)}</b><small>${esc(p.desc)}</small></span>${TICK}</button>`;
    }
    html += `<button data-persona-new><span><b>+ Tạo nhân vật mới</b><small>Trong Cài đặt</small></span></button>`;
    menu.innerHTML = html;
    menu.hidden = false;
    menuAnchor = anchor;
    anchor.setAttribute("aria-expanded", "true");
    // Nút ở đầu trang thì mở xuống dưới, nút trong khung chat thì mở lên trên.
    const r = anchor.getBoundingClientRect(), w = menu.offsetWidth, h = menu.offsetHeight;
    menu.style.left = Math.max(16, Math.min(r.left, innerWidth - w - 16)) + "px";
    menu.style.top = (r.top > innerHeight / 2 ? Math.max(16, r.top - h - 6) : r.bottom + 6) + "px";
  }
  $("modelChip").onclick = (e) => { e.stopPropagation(); toggleModelMenu(e.currentTarget); };
  $("modelMenu").onclick = (e) => {
    const b = e.target.closest("[data-key]");
    if (b) { chooseModel(b.dataset.key); toggleModelMenu(null); }
    const pb = e.target.closest("[data-persona]");
    if (pb) { settings.persona = pb.dataset.persona; store.set("glm.settings", settings); paintProvider(); toggleModelMenu(null); }
    if (e.target.closest("[data-persona-new]")) { toggleModelMenu(null); $("openSettings").click(); setTimeout(() => $("personaName").focus(), 50); }
  };
  document.addEventListener("click", (e) => { if (!e.target.closest("#modelMenu")) toggleModelMenu(null); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggleModelMenu(null); });
  addEventListener("resize", () => toggleModelMenu(null));

  let chats = store.get("glm.chats", []);
  let memories = store.get("glm.memory", []);
  const saveMemories = () => { store.set("glm.memory", memories); markSynced("memory"); };
  function addMemory(text) {
    text = text.trim();
    if (!text || memories.some((m) => m.text.toLowerCase() === text.toLowerCase())) return;
    memories.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text });
    saveMemories();
  }
  let currentId = null;
  let controller = null;

  // Ảnh và file làm bộ nhớ trình duyệt (khoảng 5MB) đầy nhanh: hết chỗ thì bỏ dần ảnh/file của các đoạn chat cũ nhất.
  function saveChats(sync = true) {
    if (sync) scheduleSync();
    for (;;) {
      try { localStorage.setItem("glm.chats", JSON.stringify(chats)); return; } catch (e) {
        if (e.name !== "QuotaExceededError" && e.code !== 22) return;
        const order = [...chats.filter((c) => c.id !== currentId), ...chats.filter((c) => c.id === currentId)];
        const victim = order.flatMap((c) => c.messages).find((m) => m.images?.length || m.genImages?.some((u) => u?.startsWith("data:")) || m.files?.some((f) => f.text));
        if (!victim) return;
        if (victim.genImages?.some((u) => u?.startsWith("data:"))) victim.genImages = victim.genImages.map((u) => (u?.startsWith("data:") ? null : u));
        else if (victim.images?.length) { victim.imagesDropped = (victim.imagesDropped || 0) + victim.images.length; victim.images = []; }
        else for (const f of victim.files) if (f.text) { f.text = ""; f.dropped = true; }
      }
    }
  }
  const currentChat = () => chats.find((c) => c.id === currentId);

  // ---------- Theme ----------
  const applyTheme = (t) => {
    if (t) document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  };
  applyTheme(store.get("glm.theme", null));
  $("themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    applyTheme(next);
    store.set("glm.theme", next);
  };

  // ---------- Markdown ----------
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // Đổi LaTeX đơn giản mà mô hình hay viết (\frac, \times, \implies…) thành ký hiệu dễ đọc.
  const TEX = {
    implies: "⇒", Rightarrow: "⇒", rightarrow: "→", to: "→", Leftrightarrow: "⇔", iff: "⇔",
    times: "×", cdot: "·", div: "÷", pm: "±", le: "≤", leq: "≤", ge: "≥", geq: "≥", neq: "≠", ne: "≠",
    approx: "≈", infty: "∞", sum: "∑", prod: "∏", int: "∫", sqrt: "√", pi: "π", alpha: "α", beta: "β",
    gamma: "γ", delta: "δ", Delta: "Δ", theta: "θ", lambda: "λ", mu: "μ", sigma: "σ", omega: "ω",
    in: "∈", forall: "∀", exists: "∃", cup: "∪", cap: "∩", subset: "⊂", circ: "°", ldots: "…", dots: "…",
    quad: " ", qquad: "  ",
  };
  function tex(s) {
    for (let k = 0; k < 3; k++) {
      s = s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1)/($2)")
        .replace(/\\sqrt\{([^{}]*)\}/g, "√($1)")
        .replace(/\\(?:text|mathrm|mathbf|boxed|operatorname)\{([^{}]*)\}/g, "$1");
    }
    return s.replace(/\(([^()+\-*/\s]+)\)\/\(([^()+\-*/\s]+)\)/g, "$1/$2")
      .replace(/\\([A-Za-z]+)/g, (m, w) => TEX[w] ?? m)
      .replace(/\^\{([^{}]*)\}|\^(\w)/g, (_, a, b) => "^" + (a ?? b))
      .replace(/_\{([^{}]*)\}/g, "_$1")
      .replace(/\\[,;! ]/g, " ").replace(/\\left|\\right/g, "").replace(/[{}]/g, "");
  }

  // Công thức: hiện tạm dạng chữ đơn giản, rồi renderMath() thay bằng KaTeX khi câu trả lời đã xong.
  const mathSpan = (raw, display) =>
    `<${display ? "div" : "span"} class="${display ? "math" : "tex"}" data-tex="${esc(raw)}">${esc(tex(raw))}</${display ? "div" : "span"}>`;
  function inline(s) {
    const codes = [], maths = [];
    s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    s = s.replace(/\\\((.+?)\\\)/g, (_, m) => { maths.push(m.trim()); return `\u0001${maths.length - 1}\u0001`; });
    // $...$ chỉ tính là công thức khi bên trong có ký hiệu toán, để "giá $5 và $10" không bị nhầm.
    s = s.replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g, (all, m) => {
      if (!/[\\^_=]/.test(m)) return all;
      maths.push(m); return `\u0001${maths.length - 1}\u0001`;
    });
    s = esc(s)
      .replace(/!\[([^\]]*)\]\(genimg:(\d+)\)/g, '<img class="gen-img" data-gen="$2" alt="$1">')
      .replace(/!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g, '<img class="gen-img" src="$2" alt="$1" loading="lazy" referrerpolicy="no-referrer">')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/__([^_]+)__/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>");
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`)
      .replace(/\u0001(\d+)\u0001/g, (_, i) => mathSpan(maths[i], false));
  }

  const CODE_LABELS = { "js-run": "JavaScript · đã chạy", "py-run": "Python · đã chạy", "python-run": "Python · đã chạy", search: "Tra cứu Wikipedia và web", wiki: "Tra cứu Wikipedia", web: "Tìm trên web", read: "Đọc trang web", image: "Tạo ảnh",
    weather: "Thời tiết", rate: "Tỷ giá", papers: "Tìm bài báo khoa học", dev: "Tìm trên Stack Overflow và GitHub", dict: "Tra từ điển", output: "Kết quả" };
  // Ngôn ngữ để tô màu code; khối không có tên ngôn ngữ thì để highlight.js tự đoán.
  const HL_LANG = new Proxy({ "js-run": "javascript", "py-run": "python", "python-run": "python", search: null, wiki: null, web: null, read: null, image: null, weather: null, rate: null, papers: null, dev: null, dict: null, output: null, "": "auto" }, {
    get: (t, k) => (k in t ? t[k] : String(k).toLowerCase()),
  });

  // Mở ảnh cỡ lớn trong tab mới (ảnh data: phải chuyển sang blob vì trình duyệt chặn mở thẳng).
  async function openImage(url) {
    if (!url.startsWith("data:")) { open(url, "_blank", "noopener"); return; }
    const blob = await (await fetch(url)).blob();
    open(URL.createObjectURL(blob), "_blank", "noopener");
  }

  // Vẽ công thức toán bằng KaTeX (tải từ cdnjs lần đầu cần), chỉ khi câu trả lời đã xong.
  const KATEX = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/";
  function renderMath(node) {
    const items = node.querySelectorAll("[data-tex]:not([data-done])");
    if (!items.length) return;
    if (!document.querySelector(`link[href^="${KATEX}"]`)) {
      const l = document.createElement("link");
      l.rel = "stylesheet"; l.href = KATEX + "katex.min.css";
      document.head.append(l);
    }
    loadScript(KATEX + "katex.min.js").then(() => {
      for (const el of items) {
        if (!el.isConnected) continue;
        try { katex.render(el.dataset.tex, el, { displayMode: el.tagName === "DIV", throwOnError: false, strict: false }); } catch {}
        el.dataset.done = "1";
      }
    }, () => {});
  }

  // Tô màu code bằng highlight.js, chỉ khi câu trả lời đã xong (tô lúc đang stream sẽ làm trang giật).
  function highlightCode(node) {
    const blocks = node.querySelectorAll("pre code[class^='language-']:not([data-hl])");
    if (!blocks.length) return;
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js").then(() => {
      for (const el of blocks) {
        if (!el.isConnected) continue;
        const lang = el.className.slice(9);
        const r = lang !== "auto" && hljs.getLanguage(lang) ? hljs.highlight(el.textContent, { language: lang }) : hljs.highlightAuto(el.textContent);
        el.innerHTML = r.value; el.dataset.hl = "1";
      }
    }, () => {});
  }

  function markdown(src) {
    const lines = src.replace(/\r\n?/g, "\n").split("\n");
    let html = "", i = 0;
    const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
    const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

    while (i < lines.length) {
      const line = lines[i];
      let m;
      if ((m = line.match(/^\s*```\s*([\w+#.-]*)/))) {
        const lang = m[1]; const buf = []; i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
        i++;
        const code = buf.join("\n"), kind = lang.toLowerCase();
        // Hình SVG đã viết xong thì hiện ảnh luôn (thẻ <img> không chạy được script trong SVG).
        if (kind === "svg" && /<\/svg>\s*$/.test(code)) html += `<div class="svg-preview"><img alt="Hình do mô hình vẽ" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(code)}"></div>`;
        const preview = kind === "html" || kind === "svg"
          ? `<button type="button" data-preview>${ICON_PLAY}Xem trước</button><button type="button" data-download>${ICON_DOWN}Tải về</button>` : "";
        html += `<div class="codeblock"${preview ? ` data-kind="${kind}"` : ""}><div class="code-head"><span>${esc(CODE_LABELS[lang] || lang || "code")}</span>` +
          `<span class="code-btns">${preview}<button type="button" data-copy>${ICON_COPY}Sao chép</button></span></div>` +
          `<pre><code${HL_LANG[lang] ? ` class="language-${HL_LANG[lang]}"` : ""}>${esc(code)}</code></pre></div>`;
        continue;
      }
      if ((m = line.match(/^\s*(\\\[|\$\$)(.*)$/))) {
        const end = m[1] === "$$" ? "$$" : "\\]";
        let body = m[2]; i++;
        if (!body.includes(end)) {
          while (i < lines.length && !lines[i].includes(end)) body += " " + lines[i++].trim();
          if (i < lines.length) body += " " + lines[i++];
        }
        html += mathSpan(body.slice(0, body.lastIndexOf(end) >= 0 ? body.lastIndexOf(end) : undefined).trim(), true);
        continue;
      }
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^(#{1,6})\s+(.*)/))) { const n = Math.min(m[1].length, 4); html += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { html += "<hr>"; i++; continue; }
      if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        const head = cells(line); i += 2;
        let t = "<table><thead><tr>" + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
          t += "<tr>" + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>"; i++;
        }
        html += t + "</tbody></table>"; continue;
      }
      if (/^\s*>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
        html += `<blockquote>${markdown(buf.join("\n"))}</blockquote>`; continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        const ordered = /^\s*\d/.test(line);
        const sameKind = (l) => (m = l.match(/^\s*([-*+]|\d+[.)])\s+(.*)/)) && /\d/.test(m[1]) === ordered;
        const items = [];
        while (i < lines.length) {
          const l = lines[i];
          if (sameKind(l)) { items.push(m[2]); i++; }
          else if (l.trim() && /^\s{2,}/.test(l) && !/^\s*(\\\[|\$\$|```)/.test(l) && items.length) { items[items.length - 1] += "\n" + l.trim(); i++; }
          else if (!l.trim() && i + 1 < lines.length && sameKind(lines[i + 1])) i++;
          else break;
        }
        const tag = ordered ? "ol" : "ul";
        const start = ordered ? parseInt(line, 10) : 1;
        html += `<${tag}${start > 1 ? ` start="${start}"` : ""}>` + items.map((it) => `<li>${inline(it).replace(/\n/g, "<br>")}</li>`).join("") + `</${tag}>`;
        continue;
      }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|([-*+]|\d+[.)])\s+)/.test(lines[i])) buf.push(lines[i++]);
      if (!buf.length) buf.push(lines[i++]);
      html += `<p>${inline(buf.join("\n")).replace(/\n/g, "<br>")}</p>`;
    }
    return html;
  }

  // Tách phần suy nghĩ <think>…</think> khỏi câu trả lời.
  function splitThink(text) {
    const open = text.indexOf("<think>");
    const close = text.indexOf("</think>");
    if (open === -1 && close === -1) return { think: "", answer: text, thinking: false };
    if (close === -1) return { think: text.slice(open + 7), answer: text.slice(0, open), thinking: true };
    const start = open === -1 || open > close ? 0 : open + 7;
    return { think: text.slice(start, close), answer: text.slice(0, open === -1 || open > close ? 0 : open) + text.slice(close + 8), thinking: false };
  }

  // ---------- Render ----------
  function renderHistory() {
    els.history.innerHTML = "";
    $("exportBtn").hidden = !currentChat()?.messages.length;
    // Tìm theo tên đoạn chat và nội dung tin nhắn, không phân biệt hoa thường và dấu.
    const fold = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d").toLowerCase();
    const q = fold($("historySearch").value.trim());
    const list = [...chats].sort((a, b) => b.updated - a.updated)
      .filter((c) => !q || fold(c.title || "").includes(q) || c.messages.some((m) => fold(m.content || "").includes(q)));
    if (q && !list.length) els.history.innerHTML = '<div class="no-result">Không tìm thấy đoạn chat nào.</div>';
    // Nhóm: đã ghim, rồi từng thư mục (theo tên), rồi các đoạn chat còn lại.
    const groups = [["Đã ghim", list.filter((c) => c.pinned)]];
    const folders = [...new Set(list.filter((c) => !c.pinned && c.folder).map((c) => c.folder))].sort((a, b) => a.localeCompare(b, "vi"));
    for (const f of folders) groups.push([`📁 ${f}`, list.filter((c) => !c.pinned && c.folder === f)]);
    groups.push(["Gần đây", list.filter((c) => !c.pinned && !c.folder)]);
    for (const [label, items] of groups) {
      if (!items.length) continue;
      const h = document.createElement("div");
      h.className = "history-label"; h.textContent = label;
      els.history.append(h);
      for (const c of items) {
        const item = document.createElement("div");
        item.className = "history-item" + (c.id === currentId ? " active" : "");
        const title = document.createElement("button");
        title.className = "title"; title.textContent = c.title || "Đoạn chat mới";
        title.onclick = () => openChat(c.id);
        const more = document.createElement("button");
        more.className = "more"; more.title = "Tuỳ chọn"; more.innerHTML = ICON_MORE;
        more.onclick = (e) => { e.stopPropagation(); chatMenu(more, c); };
        if (c.pinned) item.insertAdjacentHTML("afterbegin", ICON_PIN);
        item.append(title, more);
        els.history.append(item);
      }
    }
  }

  function renderThread() {
    const chat = currentChat();
    const has = chat && chat.messages.length;
    els.empty.hidden = !!has;
    els.empty.style.display = has ? "none" : "";
    els.thread.hidden = !has;
    els.thread.innerHTML = "";
    if (!has) return;
    chat.messages.forEach((m, idx) => els.thread.append(m.role === "user" ? userNode(m, idx) : assistantNode(m, idx)));
    scrollDown(true);
  }

  function userNode(m, idx) {
    const d = document.createElement("div");
    d.className = "msg user";
    d.dataset.idx = idx;
    if (m.images?.length || m.files?.length || m.imagesDropped) {
      const a = document.createElement("div");
      a.className = "attachments";
      a.innerHTML = (m.images || []).map((u) => `<div class="att image"><img alt="Ảnh đính kèm" src="${u}"></div>`).join("") +
        (m.files || []).map((f) => attChip(f.name, f.dropped ? "Đã xoá nội dung để tiết kiệm bộ nhớ" : fileInfo(f))).join("") +
        (m.imagesDropped ? attChip(`${m.imagesDropped} ảnh`, "Đã xoá để tiết kiệm bộ nhớ") : "");
      d.append(a);
    }
    const row = document.createElement("div");
    row.className = "user-row";
    row.innerHTML = `<button class="icon-btn edit-btn" type="button" title="Sửa rồi hỏi lại">${ICON_EDIT}</button>`;
    const b = document.createElement("div");
    b.className = "bubble"; b.textContent = m.content;
    row.append(b);
    d.append(row);
    row.querySelector(".edit-btn").onclick = () => editMessage(d, idx);
    return d;
  }

  // Sửa câu hỏi đã gửi: các tin nhắn phía sau bị bỏ, rồi mô hình trả lời lại câu đã sửa (ảnh/file đính kèm được giữ).
  function editMessage(node, idx) {
    if (controller) return;
    const chat = currentChat(), m = chat.messages[idx];
    const row = node.querySelector(".user-row");
    const box = document.createElement("div");
    box.className = "edit-box";
    box.innerHTML = `<textarea></textarea><div class="row"><button type="button" data-cancel>Huỷ</button><button type="button" class="primary" data-save>Gửi</button></div>`;
    const ta = box.querySelector("textarea");
    ta.value = m.content;
    row.replaceWith(box);
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    box.querySelector("[data-cancel]").onclick = () => renderThread();
    const save = () => {
      const text = ta.value.trim();
      if (!text) return;
      m.content = text;
      chat.messages.splice(idx + 1);
      chat.updated = Date.now();
      saveChats(); renderHistory(); renderThread();
      generate(chat);
    };
    box.querySelector("[data-save]").onclick = save;
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); save(); }
      if (e.key === "Escape") renderThread();
    });
  }

  function assistantNode(m, idx) {
    const d = document.createElement("div");
    d.className = "msg assistant";
    d.dataset.idx = idx;
    paintAssistant(d, m, false);
    return d;
  }

  function paintAssistant(node, m, streaming) {
    // Khi đang stream mà chưa có chữ trả lời, phần reasoning vẫn chưa kết thúc.
    const closed = !streaming || m.content ? "</think>" : "";
    const raw = (m.reasoning ? `<think>${m.reasoning}${closed}` : "") + (m.content || "");
    const { think, answer, thinking } = splitThink(raw);
    // Đường nhanh khi đang suy nghĩ: chỉ cập nhật chữ, không dựng lại cả khối HTML.
    const live = node.querySelector(".think[data-live] > .think-body");
    if (streaming && thinking && live && !m.notice) { live.textContent = think.trim(); return; }
    let html = "";
    const drafts = m.drafts || (m.draft ? [m.draft] : []);
    drafts.forEach((dr, i) => {
      const d = splitThink((dr.reasoning ? `<think>${dr.reasoning}</think>` : "") + dr.content);
      const secs = dr.thinkSecs ? `, suy nghĩ ${dr.thinkSecs} giây` : "";
      const name = drafts.length > 1 ? `Lời giải nháp ${i + 1}` : "Bản nháp đầu tiên";
      html += `<details class="think"><summary>${name}${secs}</summary><div class="think-body draft">` +
        `<div class="content">${markdown(d.answer.trim())}</div></div></details>`;
    });
    if (think.trim() || thinking) {
      const secs = m.thinkSecs ? ` trong ${m.thinkSecs} giây` : "";
      const label = thinking
        ? `<span class="shimmer">${m.review ? "Đang so sánh và kiểm tra lại…" : m.second ? "Đang giải lại theo cách khác…" : "Đang suy nghĩ…"}</span>`
        : `${m.review ? "Đã kiểm tra lại" : m.second ? "Đã giải lại" : "Đã suy nghĩ"}${secs}`;
      const open = thinking || settings.think === "open" ? " open" : "";
      html += `<details class="think"${open}><summary>${label}</summary><div class="think-body">${esc(think.trim())}</div></details>`;
    }
    html += `<div class="content${streaming && !thinking ? " cursor" : ""}">${markdown(answer.replace(MEMO_TAG, "").replace(/\[\[[^\]]*$/, "").trim())}</div>`;
    if (m.notice) html += `<div class="shimmer" style="font-size:14px">${esc(m.notice)}</div>`;
    if (m.kb?.length) html += `<div class="memo">${ICON_BOOK}Dùng kho kiến thức: ${esc(m.kb.join(", "))}</div>`;
    if (m.remembered) html += m.remembered.map((t) => `<div class="memo">${ICON_CHECK}Đã ghi nhớ: ${esc(t)}</div>`).join("");
    if (m.error) html += `<div class="error">${esc(m.error)}</div>`;
    else if (m.truncated && !streaming) html += `<div class="error">Câu trả lời bị cắt vì đạt giới hạn độ dài. Bấm Tạo lại, hoặc tăng Số token tối đa trong Cài đặt.</div>`;
    if (!streaming) {
      html += `<div class="actions">` +
        `<button class="icon-btn" data-act="copy" title="Sao chép">${ICON_COPY}</button>` +
        `<button class="icon-btn${m.good ? " good" : ""}" data-act="good" title="${m.good ? "Bỏ thích" : "Thích: lưu làm dữ liệu train"}">${ICON_THUMB}</button>` +
        `<button class="icon-btn" data-act="regen" title="Tạo lại">${ICON_REDO}</button>` +
        ("speechSynthesis" in window ? `<button class="icon-btn" data-act="speak" title="Đọc to">${ICON_SPEAK}</button>` : "") +
        (m.tps ? `<span class="meta">${m.tps} token/giây${m.via ? ` · trả lời bằng ${esc(m.via)}` : ""}</span>` : "") + `</div>`;
    }
    // Giữ trạng thái mở/đóng của phần suy nghĩ khi người dùng tự bấm.
    const prev = node.querySelector(".think:not(.is-draft)");
    const keepOpen = prev && prev.dataset.user ? prev.open : null;
    node.innerHTML = html;
    node.querySelectorAll(".draft").forEach((el) => el.parentElement.classList.add("is-draft"));
    const det = node.querySelector(".think:not(.is-draft)");
    if (det && keepOpen !== null) { det.open = keepOpen; det.dataset.user = "1"; }
    if (det) det.querySelector("summary").addEventListener("click", () => { det.dataset.user = "1"; });
    if (det && streaming && thinking) det.dataset.live = "1";
    // Ảnh do công cụ tạo: gắn ảnh thật vào chỗ đánh dấu; ảnh đã bị xoá cho đỡ bộ nhớ thì ghi chú.
    node.querySelectorAll("img[data-gen]").forEach((img) => {
      const url = m.genImages?.[Number(img.dataset.gen)];
      if (url) { img.src = url; img.title = "Bấm để mở ảnh cỡ lớn"; img.onclick = () => openImage(url); }
      else img.outerHTML = '<div class="gen-img-gone">(Ảnh đã được xoá khỏi máy này để tiết kiệm bộ nhớ.)</div>';
    });
    // Ảnh lấy từ đường dẫn mô hình viết ra có thể không tồn tại: tải lỗi thì ẩn đi.
    node.querySelectorAll("img.gen-img:not([data-gen])").forEach((img) => { img.onerror = () => img.remove(); });
    if (!streaming) { highlightCode(node); renderMath(node); }
  }

  async function send(text) {
    text = text.trim();
    if (controller || (!text && !attached.length)) return;
    if (attached.some((a) => a.loading)) return;
    const images = attached.filter((a) => a.kind === "image").map((a) => a.url);
    const files = attached.filter((a) => a.kind === "file").map(({ name, text, pages }) => ({ name, text, pages }));
    if (!text) text = images.length ? "Hãy mô tả và phân tích ảnh này." : "Hãy tóm tắt nội dung file này.";
    attached = []; paintAttachments();
    let chat = currentChat();
    if (!chat) {
      chat = { id: Date.now().toString(36), title: text.slice(0, 50), messages: [], updated: Date.now() };
      chats.push(chat); currentId = chat.id;
    }
    const msg = { role: "user", content: text };
    if (images.length) msg.images = images;
    if (files.length) msg.files = files;
    chat.messages.push(msg);
    chat.updated = Date.now();
    saveChats(); renderHistory();
    els.input.value = ""; autosize();
    await generate(chat);
  }

        "3) Nhận diện dạng bài và chọn thuật toán: tham lam (có chứng minh), quy hoạch động (trạng thái, công thức, thứ tự tính, tối ưu bộ nhớ), " +
        "đồ thị (BFS, DFS, Dijkstra, DSU, cây khung, topo, LCA), chặt nhị phân theo đáp án, hai con trỏ, tổng tiền tố, " +
        "Fenwick/segment tree (lazy), xâu (KMP, Z, hash), số học (modulo, nghịch đảo, sàng, tổ hợp), hình học. " +
        "Giải thích ngắn vì sao thuật toán đúng; nếu chỉ đạt một phần subtask thì nói rõ.\n" +
        "4) Viết lời giải C++17 (trừ khi người dùng muốn ngôn ngữ khác): ios::sync_with_stdio(false); cin.tie(nullptr); " +
        "dùng long long khi có thể tràn số, lấy modulo đúng chỗ, mảng đủ kích thước, khởi tạo lại dữ liệu giữa các test.\n" +
        "5) Kiểm tra: C++ không chạy được ở đây, nên viết cùng thuật toán bằng Python kèm một lời giải vét cạn, " +
        "rồi dùng py-run so sánh hai lời giải trên vài trăm test ngẫu nhiên nhỏ và các test biên (stress test). Sai thì sửa rồi chạy lại.\n" +
        "6) Trình bày: ý tưởng, độ phức tạp thời gian và bộ nhớ, code C++ cuối cùng trong khối ```cpp.",
      remind: "lời giải cuối bằng C++17 trong khối ```cpp; trước đó chạy py-run so sánh thuật toán (viết bằng Python) với lời giải vét cạn trên nhiều test ngẫu nhiên nhỏ",
    },
  ];

  const activeSkills = (chat) => {
    const recent = chat.messages.filter((m) => m.role === "user").slice(-2).map((m) => m.content).join("\n");
    return SKILLS.filter((k) => k.test.test(recent));
  };

  function systemPrompt(chat) {
    const today = new Date().toLocaleDateString("vi-VN", { weekday: "long", day: "numeric", month: "numeric", year: "numeric" });
    const parts = [`Hôm nay là ${today}. Kiến thức có sẵn của bạn chỉ cập nhật đến khoảng năm 2024–2025, nên những gì xảy ra sau đó (ai đang giữ chức vụ, giá cả, phiên bản mới, kết quả thi đấu, sự kiện gần đây) bạn phải tra cứu, không được đoán.`, THINK_PROMPT];
    if (settings.system.trim()) parts.push(settings.system.trim());
    if (settings.tools) parts.push(TOOL_PROMPT);
    for (const k of activeSkills(chat)) if (k.prompt) parts.push(k.prompt);
    let mem = MEMORY_PROMPT;
    if (memories.length) mem += "\n\nNhững điều bạn đã ghi nhớ về người dùng:\n" + memories.map((m) => "- " + m.text).join("\n");
    parts.push(mem);
    return parts.join("\n\n");
  }

  async function generate(chat) {
    const reply = { role: "assistant", content: "", reasoning: "" };
    chat.messages.push(reply);
    renderThread();
    const node = els.thread.lastElementChild;
    paintAssistant(node, reply, true);
    scrollDown(true);

    // Chỉ gửi lại ảnh của 2 tin nhắn có ảnh gần nhất cho đỡ nặng; ảnh cũ hơn được thay bằng một dòng ghi chú.
    const withImages = new Set(chat.messages.filter((m) => m.images?.length).slice(-2));
    const history = chat.messages.slice(0, -1).map((m) => ({
      role: m.role,
      content: m.role === "assistant" ? splitThink(m.content).answer.trim() : apiContent(m, withImages.has(m)),
    }));
    const extra = extraContext(chat);
    if (extra.kb.length) reply.kb = extra.kb;
    history.unshift({ role: "system", content: systemPrompt(chat) + extra.text });
    // Mô hình làm theo lời dặn ngay trong câu hỏi tốt hơn lời dặn chung, nên nhắc ngắn kỹ năng đang dùng (người dùng không thấy).
    const reminds = activeSkills(chat).map((k) => k.remind).filter(Boolean);
    const lastUser = history.findLast((m) => m.role === "user");
    if (reminds.length && lastUser) {
      const add = `\n\n(Yêu cầu thêm: ${reminds.join("; ")}.)`;
      if (typeof lastUser.content === "string") lastUser.content += add; else lastUser.content[0].text += add;
    }

    controller = new AbortController();
    setBusy(true);
    try {
      await answerWithTools(history, reply, node);
      const draft = splitThink(reply.content).answer.trim();
      // Chế độ Nghĩ kỹ: giải thêm một lần độc lập (không thấy lời giải đầu), rồi so sánh hai lời giải,
      // kiểm tra chỗ khác nhau và viết câu trả lời cuối cùng. Lần giải thứ hai lỗi thì chỉ tự kiểm tra lời giải đầu.
      if (settings.deep && draft) {
        const keep = () => ({ content: reply.content, reasoning: reply.reasoning, thinkSecs: reply.thinkSecs });
        reply.drafts = [keep()];
        Object.assign(reply, { content: "", reasoning: "", thinkSecs: null, tps: null, second: true });
        let draft2 = "";
        try {
          const again = history.map((m) => ({ ...m }));
          const last = again.findLast((m) => m.role === "user");
          const add = "\n\n(Hãy giải lại từ đầu một cách độc lập và cẩn thận, thử một hướng tiếp cận khác nếu có.)";
          if (typeof last.content === "string") last.content += add; else last.content = [{ ...last.content[0], text: last.content[0].text + add }, ...last.content.slice(1)];
          await answerWithTools(again, reply, node);
          draft2 = splitThink(reply.content).answer.trim();
          if (draft2) reply.drafts.push(keep());
        } catch (e) { if (e.name === "AbortError") throw e; console.warn("Lần giải thứ hai bị lỗi:", e); }
        Object.assign(reply, { content: "", reasoning: "", thinkSecs: null, tps: null, second: false, review: true });
        const review = draft2
          ? REVIEW_TWO_PROMPT.replace("{B}", draft2)
          : REVIEW_PROMPT;
        await answerWithTools([...history, { role: "assistant", content: draft }, { role: "user", content: review }], reply, node);
        if (!splitThink(reply.content).answer.trim()) throw new Error("Bước kiểm tra lại không trả về kết quả.");
      }
    } catch (e) {
      if (e.name !== "AbortError") {
        reply.error = /Failed to fetch|NetworkError|Load failed/i.test(e.message)
          ? `Không kết nối được tới ${PROVIDERS[settings.provider].name}. Kiểm tra kết nối mạng rồi thử lại.`
          : e.message;
      }
      // Dừng hoặc lỗi giữa chừng: lấy lời giải đầu tiên làm câu trả lời.
      if (reply.drafts && !splitThink(reply.content).answer.trim()) {
        Object.assign(reply, reply.drafts[0], { review: false, second: false });
        delete reply.drafts;
      }
    } finally {
      controller = null;
      delete reply.notice;
      saveRemembered(reply, chat.messages.at(-2)?.content || "");
      setBusy(false);
      chat.updated = Date.now();
      saveChats();
      paintAssistant(node, reply, false);
      scrollDown();
      if (!reply.error) autoTitle(chat);
    }
  }

  // Lấy các thẻ [[NHỚ: …]] ra khỏi câu trả lời và lưu vào bộ nhớ dài hạn.
  // Chỉ lưu khi chính người dùng nhờ ghi nhớ, vì mô hình nhỏ đôi khi tự thêm thẻ không cần thiết.
  function saveRemembered(reply, userText) {
    const found = [...reply.content.matchAll(MEMO_TAG)].map((m) => m[1].trim()).filter(Boolean);
    if (!found.length) return;
    reply.content = reply.content.replace(MEMO_TAG, "").trim();
    if (!/nhớ|ghi lại|lưu lại|remember/i.test(userText)) return;
    found.forEach(addMemory);
    reply.remembered = found;
  }

  // Trả lời, và mỗi khi mô hình viết khối ```js-run hoặc ```search thì chạy công cụ rồi cho nó viết tiếp với kết quả (tối đa 5 lần).
  const TOOL_ROUNDS = 8;
  async function answerWithTools(messages, reply, node) {
    for (let round = 0; ; round++) {
      const start = reply.content.length;
      const allowTool = settings.tools && round < TOOL_ROUNDS;
      // Máy chủ đôi khi ngắt luồng giữa chừng ("network error"): gửi lại tối đa 2 lần, cho mô hình viết tiếp từ chỗ dừng.
      for (let retry = 0; ; retry++) {
        const partial = reply.content.slice(start).trim();
        const pass = retry && partial
          ? [...messages, { role: "assistant", content: partial }, { role: "user", content: "Kết nối bị gián đoạn. Viết tiếp đúng từ chỗ bạn dừng, không lặp lại phần đã viết." }]
          : messages;
        try {
          await runPass(pass, reply, node, allowTool ? (text) => RUN_BLOCK.test(text.slice(start)) : null);
          break;
        } catch (e) {
          if (e.name !== "TypeError" || retry >= 2) throw e;
          if (!partial) reply.content = reply.content.slice(0, start);
          if (reply.reasoning) reply.reasoning += "\n\n· · ·\n\n";
          reply.notice = "Mất kết nối, đang nối lại…";
          paintAssistant(node, reply, true);
        }
      }
      const m = allowTool && reply.content.slice(start).match(RUN_BLOCK);
      if (!m) return;
      // Bỏ phần mô hình viết sau khối code (thường là đoán kết quả).
      const cut = start + m.index + m[0].length;
      reply.content = reply.content.slice(0, cut);
      const tool = TOOLS[m[1]] || TOOLS["py-run"];
      const search = tool.lookup;
      reply.notice = m[1] !== "js-run" && !tool.lookup && !pyReady ? "Đang tải Python (lần đầu mất khoảng 10–20 giây)…" : tool.notice;
      paintAssistant(node, reply, true);
      let out = await tool.run(m[2].trim() ? m[2] : "");
      if (typeof out === "object") {
        // Ảnh tạo ra nằm trong reply.genImages; nội dung chỉ giữ một chỗ đánh dấu nhỏ để gửi lại cho mô hình.
        if (out.image) {
          reply.genImages = [...(reply.genImages || []), out.image];
          reply.content += `\n\n![${m[2].trim().replace(/[\[\]\n]/g, " ").slice(0, 200)}](genimg:${reply.genImages.length - 1})\n\n`;
        }
        out = out.out;
      }
      reply.content += "\n\n```output\n" + out + "\n```\n\n";
      reply.notice = "Đang đọc kết quả…";
      paintAssistant(node, reply, true);
      messages = [...messages,
        { role: "assistant", content: reply.content.slice(start, cut).trim() },
        { role: "user", content: (search ? `Kết quả ${tool.label.toLowerCase()}:\n\`\`\`\n` : "Kết quả chạy code:\n```\n") + out +
          "\n```\nTiếp tục trả lời dựa trên kết quả này, không lặp lại khối lệnh vừa chạy." +
          // Lượt cuối: không chạy công cụ nữa, nên bắt mô hình trả lời luôn.
          (round + 1 >= TOOL_ROUNDS ? " Đã hết lượt dùng công cụ: không viết thêm khối lệnh nào, trả lời ngay bằng thông tin đã có." : "") },
      ];
      if (reply.reasoning) reply.reasoning += "\n\n· · ·\n\n";
    }
  }

  // Tra Wikipedia: tìm bài phù hợp, rồi lấy phần mở đầu và các đoạn chứa từ khoá (bảng biểu không có trong bản chữ).
  // Từ khoá có dấu tiếng Việt thì tra Wikipedia tiếng Việt trước, không thì tiếng Anh trước.
  async function searchWiki(query) {
    if (!query) return "Lỗi: thiếu từ khoá tra cứu.";
    const api = async (lang, params) => {
      const url = `https://${lang}.wikipedia.org/w/api.php?` + new URLSearchParams({ ...params, format: "json", formatversion: "2", origin: "*" });
      const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(10000)]) : controller.signal;
      const res = await fetch(url, { signal });
      if (!res.ok) throw new Error(`Wikipedia trả lỗi ${res.status}`);
      return (await res.json()).query;
    };
    const terms = query.toLowerCase().split(/[\s,.;:!?()"']+/).filter((w) => w.length > 2 || /\d/.test(w));
    const excerpt = (text) => {
      const paras = text.split(/\n+/).map((t) => t.trim()).filter((t) => t.length > 30);
      const intro = paras.slice(0, 2).join("\n").slice(0, 700);
      const hits = paras.slice(2)
        .map((t, i) => ({ t, i, score: terms.filter((w) => t.toLowerCase().includes(w)).length }))
        .filter((x) => x.score).sort((a, b) => b.score - a.score || a.i - b.i).slice(0, 4)
        .sort((a, b) => a.i - b.i).map((x) => (x.t.length > 600 ? x.t.slice(0, 600) + "…" : x.t));
      return [intro, ...hits].join("\n…\n");
    };
    const lookup = async (lang) => {
      const titles = ((await api(lang, { action: "query", list: "search", srsearch: query, srlimit: "2", srprop: "" })).search || []).map((r) => r.title);
      const pages = await Promise.all(titles.map((t) => api(lang, { action: "query", prop: "extracts", explaintext: "1", titles: t, redirects: "1" })));
      return pages.map((q) => q.pages?.[0]).filter((p) => p?.extract?.trim()).map((p) =>
        `### ${p.title}\n${excerpt(p.extract)}\nNguồn: https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title.replace(/ /g, "_"))}`);
    };
    const langs = /[^\x00-\x7F]/.test(query) ? ["vi", "en"] : ["en", "vi"];
    try {
      let found = await lookup(langs[0]);
      if (!found.length) found = await lookup(langs[1]);
      return found.length ? found.join("\n\n") : `Không tìm thấy bài Wikipedia nào cho "${query}". Thử từ khoá khác hoặc từ khoá tiếng Anh.`;
    } catch (e) {
      if (e.name === "AbortError" && controller?.signal.aborted) throw e;
      return "Lỗi khi tra cứu: " + (e.name === "TimeoutError" ? "Wikipedia không phản hồi." : e.message);
    }
  }

  // Tìm trên web (DuckDuckGo) và đọc trang web, đều qua Jina Reader (r.jina.ai, miễn phí, có CORS, chuyển trang thành chữ).
  const READER = "https://r.jina.ai/";
  async function jina(url) {
    const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(25000)]) : controller.signal;
    const res = await fetch(READER + url, { signal });
    if (res.status === 429) throw new Error("dịch vụ đọc web đang bị giới hạn lượt, đợi một phút rồi thử lại");
    if (!res.ok) throw new Error(`dịch vụ đọc web trả lỗi ${res.status}`);
    return res.text();
  }
  const toolError = (e) => {
    if (e.name === "AbortError" && controller?.signal.aborted) throw e;
    return "Lỗi: " + (e.name === "TimeoutError" ? "trang web không phản hồi." : e.message);
  };

  async function searchWeb(query) {
    if (!query.trim()) return "Lỗi: thiếu từ khoá tìm kiếm.";
    try {
      const md = await jina("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(query.trim()));
      // Mỗi kết quả: một dòng "## [tiêu đề](link chuyển hướng ?uddg=...)" rồi một dòng mô tả dạng "[...](...)".
      const results = [];
      const lines = md.split("\n");
      for (let i = 0; i < lines.length && results.length < 6; i++) {
        const h = lines[i].match(/^## \[(.+?)\]\((\S+?)\)\s*$/);
        if (!h) continue;
        let url = h[2];
        try { url = new URL(url).searchParams.get("uddg") || url; } catch {}
        if (/duckduckgo\.com\/y\.js|ad_domain|ad_provider/.test(h[2])) continue; // bỏ quảng cáo
        let snippet = "";
        for (let j = i + 1; j < Math.min(i + 6, lines.length); j++) {
          if (lines[j].startsWith("## ")) break;
          const sm = lines[j].match(/^\[(.+)\]\(\S+\)\s*$/);
          if (sm && !sm[1].startsWith("![") && !/^[\w.-]+\.[a-z]{2,}\//i.test(sm[1])) { snippet = sm[1]; break; }
        }
        const clean = (t) => t.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
        results.push(`${results.length + 1}. ${clean(h[1])}\n${url}\n${clean(snippet)}`);
      }
      return results.length
        ? results.join("\n\n") + "\n\n(Muốn xem chi tiết một kết quả thì dùng công cụ read với đường dẫn của nó.)"
        : `Không tìm thấy kết quả nào cho "${query.trim()}".`;
    } catch (e) { return toolError(e); }
  }

  async function readPage(url) {
    url = url.trim().split(/\s+/)[0];
    if (!/^https?:\/\//i.test(url)) return "Lỗi: cần một đường dẫn bắt đầu bằng http:// hoặc https://.";
    try {
      let text = (await jina(url))
        .replace(/!\[[^\]]*\]\([^)]*\)/g, "") // bỏ ảnh
        .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1") // giữ chữ của link, bỏ đường dẫn
        .replace(/\n{3,}/g, "\n\n").trim();
      if (text.length > 12000) text = text.slice(0, 12000) + "\n…(trang dài, phần sau đã bị cắt)";
      return text || "Trang này không có nội dung chữ.";
    } catch (e) { return toolError(e); }
  }

  // ---------- Nguồn tra cứu chuyên biệt (đều miễn phí, không cần key, gọi thẳng từ trình duyệt) ----------
  async function getJson(url) {
    const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(15000)]) : controller.signal;
    const res = await fetch(url, { signal });
    if (res.status === 429 || res.status === 403) throw new Error("nguồn này đang giới hạn lượt, thử lại sau ít phút");
    if (!res.ok) throw new Error(`nguồn trả lỗi ${res.status}`);
    return res.json();
  }
  const stripHtml = (h) => String(h || "").replace(/<[^>]+>/g, " ").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/\s+/g, " ").trim();

  // Tìm cùng lúc trên Wikipedia và web, để có nhiều nguồn đối chiếu.
  async function searchAll(q) {
    const [wiki, web] = await Promise.allSettled([searchWiki(q.trim()), searchWeb(q)]);
    const part = (r) => (r.status === "fulfilled" ? r.value : toolError(r.reason));
    return `## Wikipedia\n${part(wiki)}\n\n## Web\n${part(web)}`;
  }

  // Thời tiết hiện tại và 3 ngày tới (Open-Meteo).
  const WMO = { 0: "trời quang", 1: "ít mây", 2: "có mây", 3: "nhiều mây", 45: "sương mù", 48: "sương mù đóng băng", 51: "mưa phùn nhẹ", 53: "mưa phùn", 55: "mưa phùn dày", 61: "mưa nhỏ", 63: "mưa vừa", 65: "mưa to", 71: "tuyết nhẹ", 73: "tuyết", 75: "tuyết dày", 80: "mưa rào nhẹ", 81: "mưa rào", 82: "mưa rào rất to", 95: "dông", 96: "dông kèm mưa đá", 99: "dông kèm mưa đá lớn" };
  async function weather(place) {
    try {
      const name = place.trim().replace(/^(thời tiết|thoi tiet|weather)\s+(ở|tại|in)?\s*/i, "");
      const geo = await getJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=vi`);
      const g = geo.results?.[0];
      if (!g) return `Không tìm thấy địa điểm "${name}". Thử tên không dấu hoặc tên tiếng Anh (ví dụ Hanoi, Da Nang).`;
      const w = await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}` +
        "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4");
      const c = w.current, d = w.daily;
      const days = d.time.map((t, i) => `- ${t}: ${WMO[d.weather_code[i]] || "?"}, ${d.temperature_2m_min[i]}–${d.temperature_2m_max[i]}°C, khả năng mưa ${d.precipitation_probability_max[i] ?? "?"}%`);
      return `${g.name}${g.admin1 ? ", " + g.admin1 : ""}${g.country ? ", " + g.country : ""} (giờ địa phương ${c.time})\n` +
        `Hiện tại: ${WMO[c.weather_code] || "?"}, ${c.temperature_2m}°C (cảm giác ${c.apparent_temperature}°C), độ ẩm ${c.relative_humidity_2m}%, gió ${c.wind_speed_10m} km/h\n` +
        `Dự báo:\n${days.join("\n")}\nNguồn: Open-Meteo (open-meteo.com)`;
    } catch (e) { return toolError(e); }
  }

  // Tỷ giá ngoại tệ (cập nhật hằng ngày). Nhận dạng "USD VND", "100 USD sang VND", "EUR".
  async function rates(q) {
    try {
      const codes = (q.toUpperCase().match(/\b[A-Z]{3}\b/g) || []).filter((c) => c !== "TO");
      const amount = Number((q.match(/[\d.,]+/) || ["1"])[0].replace(/,/g, "")) || 1;
      const base = codes[0] || "USD", targets = codes.slice(1).length ? codes.slice(1) : ["VND", "USD", "EUR", "JPY", "CNY", "KRW"].filter((c) => c !== base);
      const r = await getJson(`https://open.er-api.com/v6/latest/${base}`);
      if (r.result !== "success") return `Không có tỷ giá cho ${base}.`;
      const lines = targets.map((t) => (r.rates[t] ? `${amount} ${base} = ${(amount * r.rates[t]).toLocaleString("vi-VN", { maximumFractionDigits: 4 })} ${t}` : `${t}: không có dữ liệu`));
      return `${lines.join("\n")}\nCập nhật: ${r.time_last_update_utc}\nNguồn: ExchangeRate-API (tỷ giá tham khảo, có thể khác giá ngân hàng)`;
    } catch (e) { return toolError(e); }
  }

  // Bài báo khoa học (OpenAlex): tiêu đề, tác giả, năm, số trích dẫn, tóm tắt, DOI.
  async function papers(q) {
    try {
      const r = await getJson(`https://api.openalex.org/works?search=${encodeURIComponent(q.trim())}&per-page=4&sort=relevance_score:desc`);
      if (!r.results?.length) return `Không tìm thấy bài báo nào cho "${q.trim()}".`;
      return r.results.map((w, i) => {
        // OpenAlex lưu tóm tắt dạng chỉ mục từ → vị trí, phải ghép lại.
        let abs = "";
        if (w.abstract_inverted_index) {
          const pos = [];
          for (const [word, idx] of Object.entries(w.abstract_inverted_index)) for (const k of idx) pos[k] = word;
          abs = pos.join(" ").slice(0, 700);
        }
        const authors = (w.authorships || []).slice(0, 4).map((a) => a.author?.display_name).filter(Boolean).join(", ");
        return `${i + 1}. ${w.display_name} (${w.publication_year || "?"})\nTác giả: ${authors || "?"}${w.authorships?.length > 4 ? " và cộng sự" : ""}\n` +
          `Trích dẫn: ${w.cited_by_count ?? 0}${w.doi ? ` · ${w.doi}` : ""}${w.primary_location?.source?.display_name ? ` · ${w.primary_location.source.display_name}` : ""}\n${abs ? "Tóm tắt: " + abs + "…" : ""}`;
      }).join("\n\n") + "\nNguồn: OpenAlex (openalex.org)";
    } catch (e) { return toolError(e); }
  }

  // Lập trình: câu hỏi Stack Overflow kèm câu trả lời được bình chọn cao nhất, và kho mã GitHub liên quan.
  async function devSearch(q) {
    const so = (async () => {
      const s = await getJson(`https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q=${encodeURIComponent(q.trim())}&site=stackoverflow&accepted=True&pagesize=3`);
      if (!s.items?.length) return "Stack Overflow: không có kết quả.";
      const ids = s.items.map((x) => x.question_id).join(";");
      const a = await getJson(`https://api.stackexchange.com/2.3/questions/${ids}/answers?order=desc&sort=votes&site=stackoverflow&filter=withbody&pagesize=20`);
      return "Stack Overflow:\n" + s.items.map((x, i) => {
        const best = (a.items || []).filter((y) => y.question_id === x.question_id).sort((m, n) => n.is_accepted - m.is_accepted || n.score - m.score)[0];
        return `${i + 1}. ${stripHtml(x.title)} (${x.score} điểm)\n${x.link}\n${best ? "Câu trả lời tốt nhất: " + stripHtml(best.body).slice(0, 1200) : ""}`;
      }).join("\n\n");
    })();
    const gh = (async () => {
      const r = await getJson(`https://api.github.com/search/repositories?q=${encodeURIComponent(q.trim())}&per_page=3&sort=stars`);
      if (!r.items?.length) return "GitHub: không có kết quả.";
      return "GitHub:\n" + r.items.map((x, i) => `${i + 1}. ${x.full_name} (★${x.stargazers_count}, ${x.language || "?"})\n${x.html_url}\n${x.description || ""}`).join("\n\n");
    })();
    const [a, b] = await Promise.allSettled([so, gh]);
    return [a, b].map((r) => (r.status === "fulfilled" ? r.value : toolError(r.reason))).join("\n\n");
  }

  // Từ điển tiếng Anh (Wiktionary): từ loại, nghĩa, ví dụ.
  async function dictionary(word) {
    try {
      const w = word.trim().split(/\s+/).slice(0, 3).join(" ");
      const r = await getJson(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(w.replace(/ /g, "_"))}`);
      const en = r.en || Object.values(r)[0];
      if (!en?.length) return `Không có "${w}" trong Wiktionary.`;
      return `${w}\n` + en.slice(0, 4).map((p) => `${p.partOfSpeech}:\n` + p.definitions.slice(0, 3).map((d, i) =>
        `  ${i + 1}. ${stripHtml(d.definition)}${d.examples?.[0] ? `\n     Ví dụ: ${stripHtml(d.examples[0])}` : ""}`).join("\n")).join("\n") +
        `\nNguồn: Wiktionary (https://en.wiktionary.org/wiki/${encodeURIComponent(w.replace(/ /g, "_"))})`;
    } catch (e) { return /404/.test(e.message) ? `Không có "${word.trim()}" trong Wiktionary.` : toolError(e); }
  }
