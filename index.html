        "2) Từ ràng buộc suy ra độ phức tạp cần đạt (khoảng 10^8 phép tính mỗi giây): n ≤ 20 → 2^n·n; n ≤ 500 → n^3; " +
        "n ≤ 5000 → n^2; n ≤ 2·10^5 → n log n; n ≤ 10^18 → log n hoặc công thức.\n" +
        "3) Nhận diện dạng bài và chọn thuật toán: tham lam (có chứng minh), quy hoạch động (trạng thái, công thức, thứ tự tính, tối ưu bộ nhớ), " +
        "đồ thị (BFS, DFS, Dijkstra, DSU, cây khung, topo, LCA), chặt nhị phân theo đáp án, hai con trỏ, tổng tiền tố, " +
        "Fenwick/segment tree (lazy), xâu (KMP, Z, hash), số học (modulo, nghịch đảo, sàng, tổ hợp), hình học. " +
        "Giải thích ngắn vì sao thuật toán đúng; nếu chỉ đạt một phần subtask thì nói rõ.\n" +
        "   Danh mục theo dạng bài: mảng và đoạn (tổng tiền tố, mảng hiệu, hai con trỏ, cửa sổ trượt, ngăn xếp/hàng đợi đơn điệu, sparse table cho RMQ); " +
        "tìm kiếm (chặt nhị phân trên đáp án, tam phân, meet-in-the-middle); tham lam (chứng minh bằng đổi chỗ, sắp xếp theo khoá phù hợp, hàng đợi ưu tiên); " +
        "quy hoạch động (cái túi, LIS O(n log n), DP đoạn, DP bitmask, DP chữ số, DP trên cây và rerooting, DP trên DAG, tối ưu bằng chia để trị, Knuth, convex hull trick, đếm theo modulo); " +
        "đồ thị (BFS, BFS 0-1, Dijkstra, Bellman-Ford, Floyd, sắp xếp topo, thành phần liên thông mạnh Tarjan/Kosaraju, cầu và khớp, cây khung Kruskal/Prim, DSU, " +
        "LCA bằng nâng nhị phân, Euler tour, HLD, centroid decomposition, luồng cực đại Dinic, cặp ghép hai phía); " +
        "cấu trúc dữ liệu (Fenwick, segment tree có lazy, segment tree động/persistent, cây cân bằng hoặc ordered_set của pb_ds, sqrt decomposition, thuật toán Mo); " +
        "xâu (KMP, Z, hash hai modulo, trie, Aho-Corasick, mảng hậu tố, Manacher); toán (lũy thừa nhanh, nghịch đảo modulo, sàng nguyên tố, giai thừa và tổ hợp modulo, " +
        "Euclid mở rộng, định lý số dư Trung Hoa, hàm phi Euler, nhân ma trận, bao hàm loại trừ, kỳ vọng tuyến tính, FFT/NTT); " +
        "hình học (tích có hướng, kiểm tra hướng, bao lồi, tính bằng số nguyên để tránh sai số).\n" +
        "   Bài IOI có subtask: làm subtask dễ trước để chắc điểm (vét cạn, trường hợp đặc biệt như đường thẳng, cây sao, giá trị nhỏ), " +
        "rồi tìm ý tưởng cho subtask lớn dần; nói rõ lời giải đạt những subtask nào.\n" +
        "4) Viết lời giải C++17 (trừ khi người dùng muốn ngôn ngữ khác): ios::sync_with_stdio(false); cin.tie(nullptr); " +
        "dùng long long khi có thể tràn số, lấy modulo đúng chỗ, mảng đủ kích thước, khởi tạo lại dữ liệu giữa các test.\n" +
        "   Lỗi hay gặp cần soát: tràn số khi nhân (ép long long trước khi nhân), modulo số âm ((a % m + m) % m), lệch chỉ số 0 và 1, " +
        "đệ quy quá sâu với n lớn (dùng DFS bằng ngăn xếp), vòng lặp đọc nhiều test quên reset, so sánh số thực bằng ==, dùng endl trong vòng lặp lớn (chậm), " +
        "map hoặc unordered_map khi mảng đủ dùng, sort với hàm so sánh không phải thứ tự chặt.\n" +
        "5) Kiểm tra bằng cpp-run (chạy C++ thật): viết MỘT chương trình gồm hàm solve (đúng lời giải sẽ nộp), hàm brute (vét cạn, chắc chắn đúng) " +
        "và main tự chạy các ví dụ trong đề rồi sinh vài trăm test ngẫu nhiên nhỏ (mt19937 với seed cố định, kể cả test biên như n = 1), " +
        "so sánh solve với brute, in OK hoặc test sai đầu tiên kèm hai kết quả. Sai thì tìm lỗi, sửa rồi chạy lại tới khi OK. " +
        "Nếu cần thì chạy thêm một test lớn nhất theo giới hạn để đo thời gian.\n" +
        "6) Trình bày: ý tưởng, độ phức tạp thời gian và bộ nhớ, code C++ cuối cùng trong khối ```cpp. Code cuối phải dùng ĐÚNG hàm solve đã qua kiểm tra " +
        "(chỉ đổi main để đọc input và in output), không viết lại hay dịch từ ngôn ngữ khác.",
      remind: "lời giải cuối bằng C++17 trong khối ```cpp; trước đó BẮT BUỘC chạy cpp-run một chương trình so sánh hàm solve với lời giải vét cạn trên ví dụ của đề và vài trăm test ngẫu nhiên nhỏ cho tới khi in OK, rồi nộp đúng hàm solve đó",
      hard: true,
    },
  ];

  // Kỹ năng đang dùng: kỹ năng khớp với câu hỏi gần đây, cộng bộ kỹ năng luôn bật của chế độ đang chọn.
  // matchedOnly: chỉ lấy kỹ năng khớp câu hỏi (dùng cho lời nhắc ngắn cuối câu hỏi, để chế độ không nhắc những việc không liên quan).
  const activeSkills = (chat, matchedOnly) => {
    const recent = chat.messages.filter((m) => m.role === "user").slice(-2).map((m) => m.content).join("\n");
    const forced = matchedOnly ? [] : currentMode().skills;
    return SKILLS.filter((k) => k.test.test(recent) || forced.includes(k.id));
  };

  function systemPrompt(chat) {
    const today = new Date().toLocaleDateString("vi-VN", { weekday: "long", day: "numeric", month: "numeric", year: "numeric" });
    const [mName, mDesc] = PROVIDERS.shared.titles[cloudModel()] || ["Titan 4 Mega", ""];
    const identity = `Bạn là Astra, trợ lý AI tiếng Việt, đang chạy mô hình ${mName} (${mDesc.toLowerCase()}). Khi được hỏi bạn là ai hay là mô hình gì, ` +
      `hãy nói bạn là Astra, mô hình ${mName}. Nếu được hỏi về công nghệ bên dưới thì nói Astra được xây dựng trên các mô hình ngôn ngữ mở, ` +
      "cộng với cách suy nghĩ, kỹ năng, công cụ (chạy code, tra cứu, vẽ ảnh, xuất file) và quy trình kiểm tra chéo riêng của Astra.";
    const parts = [identity, `Hôm nay là ${today}. Kiến thức có sẵn của bạn chỉ cập nhật đến khoảng năm 2024–2025, nên những gì xảy ra sau đó (ai đang giữ chức vụ, giá cả, phiên bản mới, kết quả thi đấu, sự kiện gần đây) bạn phải tra cứu, không được đoán.`, THINK_PROMPT];
    if (/^glm/.test(cloudModel())) parts.push(GLM_PROMPT);
    if (settings.system.trim()) parts.push(settings.system.trim());
    parts.push(TOOL_PROMPT); // công cụ (chạy code, tra cứu, tạo ảnh) luôn được bật
    if (currentMode().prompt) parts.push(currentMode().prompt);
    for (const k of activeSkills(chat)) if (k.prompt) parts.push(k.prompt);
    if (activeSkills(chat).some((k) => CODE_SKILLS.has(k.id))) parts.push(CODE_CRAFT);
    let mem = MEMORY_PROMPT;
    if (memories.length) mem += "\n\nNhững điều bạn đã ghi nhớ về người dùng:\n" + memories.map((m) => "- " + m.text).join("\n");
    parts.push(mem);
    return parts.join("\n\n");
  }

  async function generate(chat) {
    const reply = { role: "assistant", content: "", reasoning: "" };
    genChat = chat;
    chat.messages.push(reply);
    renderThread();
    const node = els.thread.lastElementChild;
    paintAssistant(node, reply, true);
    scrollDown(true);

    // Chỉ gửi lại ảnh của 2 tin nhắn có ảnh gần nhất cho đỡ nặng; ảnh cũ hơn được thay bằng một dòng ghi chú.
    const withImages = new Set(chat.messages.filter((m) => m.images?.length).slice(-2));
    const history = chat.messages.slice(0, -1).map((m) => ({
      role: m.role,
      content: m.role === "assistant" ? historyAnswer(m) : apiContent(m, withImages.has(m)),
    }));
    const extra = extraContext(chat);
    if (extra.kb.length) reply.kb = extra.kb;
    history.unshift({ role: "system", content: systemPrompt(chat) + extra.text });
    // Mô hình làm theo lời dặn ngay trong câu hỏi tốt hơn lời dặn chung, nên nhắc ngắn kỹ năng đang dùng (người dùng không thấy).
    const reminds = [currentMode().remind, ...activeSkills(chat, true).map((k) => k.remind)].filter(Boolean);
    // Độ khó của câu hỏi quyết định độ sâu suy nghĩ: câu khó thì nghĩ đủ khung và kiểm chứng; câu xã giao ngắn thì trả lời ngay.
    const lastQ = chat.messages.filter((m) => m.role === "user").at(-1)?.content || "";
    if (activeSkills(chat, true).some((k) => k.hard))
      reminds.push("đây là câu khó: suy nghĩ theo khung đầy đủ (hiểu đề, bẫy, ít nhất hai cách, đối chiếu), kiểm chứng bằng công cụ trước khi chốt, nêu mức chắc chắn");
    else if (lastQ.length < 40 && !/[?？]|\d/.test(lastQ) && /^(chào|hi|hello|xin chào|cảm ơn|cám ơn|ok|oke|thanks|thank you|tạm biệt|bye)\b/i.test(lastQ.trim()))
      reminds.push("câu xã giao ngắn: trả lời ngay, tự nhiên, không suy nghĩ dài");
    if (chat.messages.filter((m) => m.role === "user").at(-1)?.refImages?.length)
      reminds.push("người dùng gửi kèm ảnh đã tạo để sửa: dùng khối ```image với dòng đầu edit: yes, rồi mô tả bằng tiếng Anh thay đổi cần làm và nói rõ phần giữ nguyên");
    const lastUser = history.findLast((m) => m.role === "user");
    if (reminds.length && lastUser) {
      const add = `\n\n(Yêu cầu thêm: ${reminds.join("; ")}.)`;
      if (typeof lastUser.content === "string") lastUser.content += add; else lastUser.content[0].text += add;
    }

    controller = new AbortController();
    setBusy(true);
    const level = settings.level;
    // Ghi chép của các bước (phân tích, lời giải nháp, nhận xét) hiện bên trên câu trả lời cuối.
    const notes = [];
    const step = (text, notice) => { reply.stage = text; reply.notice = notice; paintAssistant(node, reply, true); };
    // Cất phần đang hiện thành một ghi chép rồi để trống cho bước tiếp theo.
    const shelve = (label) => {
      const n = { content: reply.content, reasoning: reply.reasoning, thinkSecs: reply.thinkSecs, model: reply.drafter, label };
      notes.push(n); reply.drafts = [...notes];
      Object.assign(reply, { content: "", reasoning: "", thinkSecs: null, tps: null, review: true, via: undefined });
      return n;
    };
    const keep = (r, label) => { if (r) { notes.push({ ...r.draft, label }); reply.drafts = [...notes]; } };
    // Người chấm không thấy lỗi: lấy lại câu trả lời đã cất làm câu trả lời cuối.
    const restore = (n) => {
      notes.splice(notes.indexOf(n), 1); reply.drafts = [...notes];
      Object.assign(reply, { content: n.content, reasoning: n.reasoning, thinkSecs: n.thinkSecs, review: false, via: undefined });
    };
    const title = (m) => modelTitle("shared", m);
    // Mức Ultra cho việc xây dựng phần mềm: kế hoạch Markdown → phản biện kế hoạch → code theo từng giai đoạn (chạy thử và sửa sau mỗi giai đoạn)
    // → các mô hình khác rà soát code → sửa → chạy thử toàn bộ hoặc kiểm thử → tổng hợp. Kết quả cuối có đủ mọi file (kèm PLAN.md).
    const devRun = async (helpers) => {
      const T = 7;
      reply.noGaps = true; // file của giai đoạn sau chưa viết là đúng kế hoạch, không tự viết bù
      const answerOf = () => splitThink(reply.content).answer.trim();
      const run = async (msgs) => { await answerWithTools(msgs, reply, node); await ensureAnswer(msgs, reply, node); return answerOf(); };
      const files = new Map();
      const absorb = (text) => {
        const named = filesIn(text);
        for (const [p, c] of named) files.set(p, c);
        // Trang HTML viết không kèm tên file: coi là index.html.
        if (!named.some(([p]) => /\.html?$/i.test(p))) {
          const page = [...text.matchAll(/^[ \t]*```html[ \t]*\n([\s\S]*?)\n[ \t]*```/gm)].map((m) => m[1]).filter((c) => /<(html|body)\b/i.test(c)).at(-1);
          if (page) files.set("index.html", page);
        }
      };
      const ctxNow = (plan) => [...history, { role: "assistant", content: `Kế hoạch:\n\n${plan.slice(0, 12000)}\n\nMã nguồn hiện tại:\n\n${projectDump(files).slice(0, 80000)}` }];
      // Bước 1: kế hoạch.
      step(`Bước 1/${T}: phân tích yêu cầu và lên kế hoạch (Markdown)`, "Đang lên kế hoạch…");
      let plan = await run(withNote(history, PLAN_PROMPT));
      shelve("Kế hoạch (PLAN.md)");
      // Bước 2: kỹ sư khác phản biện kế hoạch, rồi cải tiến.
      if (plan && helpers[0]) {
        step(`Bước 2/${T}: ${title(helpers[0])} phản biện kế hoạch`, "Kỹ sư trưởng đang phản biện kế hoạch…");
        const st = [];
        const [c] = await gather([silentRun([...history, { role: "assistant", content: plan }, { role: "user", content: PLAN_REVIEW_PROMPT }], helpers[0], st)], st, 120000);
        keep(c, "Phản biện kế hoạch");
        if (c && !noErrors(c.answer)) {
          step(`Bước 2/${T}: cải tiến kế hoạch theo góp ý`, undefined);
          const better = await run([...history, { role: "assistant", content: plan }, { role: "user", content: PLAN_FIX_PROMPT.replace("{C}", c.answer.slice(0, 6000)) }]);
          if (better.length > plan.length * 0.5) plan = better;
          shelve("Kế hoạch đã cải tiến");
        }
      }
      // Bước 3: code theo từng giai đoạn; sau mỗi giai đoạn chạy thử (web) và sửa lỗi ngay.
      const phases = [...plan.matchAll(/^#{2,4}\s*Giai đoạn\s*(\d+)\s*[:.\-–—]?\s*(.*)$/gim)].map((m) => m[2].replace(/[*_`]/g, "").trim() || `Giai đoạn ${m[1]}`).slice(0, 5);
      if (!phases.length) phases.push("Toàn bộ dự án");
      for (let i = 0; i < phases.length; i++) {
        step(`Bước 3/${T}: giai đoạn ${i + 1}/${phases.length}: ${phases[i]}`, undefined);
        const prompt = PHASE_PROMPT.replace("{P}", plan.slice(0, 20000))
          .replace("{F}", files.size ? `Các file đã có sau các giai đoạn trước:\n\n${projectDump(files).slice(0, 70000)}\n\n` : "")
          .replace("{N}", i + 1).replace("{T}", phases.length).replace("{G}", phases[i]);
        absorb(await run(withNote(history, prompt)));
        shelve(`Giai đoạn ${i + 1}: ${phases[i]}`);
        if ([...files.keys()].some((p) => /\.html?$/i.test(p))) {
          // Chỉ xét lỗi khi chạy; file của các giai đoạn sau chưa có là bình thường.
          const errs = (await checkProject(files)).filter((e) => !/dự án không có file|Không tải được/.test(e));
          if (errs.length) {
            step(`Bước 3/${T}: sửa lỗi chạy thử của giai đoạn ${i + 1}`, undefined);
            absorb(await run([...ctxNow(plan), { role: "user", content: PHASE_FIX_PROMPT.replace("{E}", errs.map((x) => "- " + x).join("\n")) }]));
            shelve(`Sửa lỗi giai đoạn ${i + 1}`);
          }
        }
      }
      if (!files.size) {
        // Mô hình không viết file nào: lấy kết quả của giai đoạn cuối làm câu trả lời.
        const last = notes.findLast((n) => /^Giai đoạn|^Sửa lỗi/.test(n.label));
        if (last) restore(last);
        delete reply.noGaps;
        return;
      }
      // Bước 4–5: các mô hình khác rà soát code; có vấn đề thì sửa.
      const reviewers = helpers.slice(0, 2).length ? helpers.slice(0, 2) : [cloudModel()], rst = [];
      step(`Bước 4/${T}: ${reviewers.map(title).join(", ")} rà soát code`, "Đang rà soát code…");
      const crits = (await gather(reviewers.map((m) => silentRun([...ctxNow(plan), { role: "user", content: CODE_REVIEW_PROMPT }], m, rst)), rst, 180000)).filter(Boolean);
      crits.forEach((c) => keep(c, "Rà soát code"));
      const problems = crits.filter((c) => !noErrors(c.answer));
      if (problems.length) {
        step(`Bước 5/${T}: sửa theo kết quả rà soát`, undefined);
        absorb(await run([...ctxNow(plan), { role: "user", content: CODE_FIX_PROMPT.replace("{C}",
          problems.map((c, i) => `<ra_soat_${i + 1} mo_hinh="${c.draft.model}">\n${c.answer.slice(0, 6000)}\n</ra_soat_${i + 1}>`).join("\n\n")) }]));
        shelve("Sửa theo rà soát");
      }
      // Bước 6: trang web thì chạy thử mọi trang và sửa (tối đa 2 lượt); code khác thì viết và chạy kiểm thử.
      if ([...files.keys()].some((p) => /\.html?$/i.test(p))) {
        for (let r = 0; r < 2; r++) {
          step(`Bước 6/${T}: chạy thử toàn bộ${r ? " (lượt 2)" : ""}`, "Đang chạy thử mọi trang…");
          const errs = await checkProject(files);
          if (!errs.length) break;
          step(`Bước 6/${T}: sửa lỗi khi chạy thử${r ? " (lượt 2)" : ""}`, undefined);
          absorb(await run([...ctxNow(plan), { role: "user", content: PROJECT_FIX_PROMPT.replace("{E}", errs.map((x) => "- " + x).join("\n")) }]));
          shelve(`Sửa lỗi chạy thử${r ? " (lượt 2)" : ""}`);
        }
      } else {
        step(`Bước 6/${T}: kiểm thử`, undefined);
        absorb(await run([...ctxNow(plan), { role: "user", content: TEST_PROMPT }]));
        shelve("Kiểm thử");
      }
      // Bước 7: tổng hợp câu trả lời: phần mở đầu ngắn rồi mọi file của dự án.
      step(`Bước 7/${T}: tổng hợp`, "Đang viết phần tóm tắt…");
      const sst = [];
      const [s] = await gather([silentRun([...ctxNow(plan), { role: "user", content: DEV_SUMMARY_PROMPT }], cloudModel(), sst, true)], sst, 90000);
      if (plan) files.set("PLAN.md", plan);
      Object.assign(reply, { content: (s?.answer.trim() || "Dự án đã hoàn thành theo kế hoạch, đủ các file bên dưới.") + "\n\n" + projectDump(files),
        reasoning: "", review: false, via: undefined });
      delete reply.noGaps;
    };
    try {
      const deep = level === "careful" || level === "max" || level === "ultra";
      const total = { careful: 4, max: 5, ultra: 8 }[level];
      const helpers = deep ? await councilModels({ careful: 1, max: 2, ultra: 3 }[level]) : [];
      // Ultra với yêu cầu xây dựng phần mềm: quy trình của lập trình viên chuyên nghiệp (devRun).
      if (level === "ultra" && isDevTask(chat)) await devRun(helpers);
      else {
        let base = history;
        // Bước 1: phân tích đề (chưa giải), để bước giải đi đúng hướng và biết cách kiểm chứng.
        if (deep) {
          step(`Bước 1/${total}: phân tích đề`, "Đang phân tích đề…");
          const astops = [];
          const [a] = await gather([silentRun(withNote(history, ANALYZE_PROMPT), cloudModel(), astops, true)], astops, 60000);
          if (a) { keep(a, "Phân tích đề"); base = withNote(history, ANALYSIS_NOTE.replace("{A}", a.answer.slice(0, 4000))); }
        }
        // Bước 2: giải. Mức Tối đa: hai mô hình khác giải song song (không hiện ra), mỗi mô hình một góc nhìn.
        const solverStops = [], solverStart = Date.now();
        const solvers = level === "max" || level === "ultra" ? helpers.map((m, i) => silentRun(withNote(base, DEEP_ANGLES[i]), m, solverStops)) : [];
        solvers.forEach((p) => p.catch(() => {}));
        if (deep) step(level === "ultra" ? `Bước 2/8: vòng 1, ${[cloudModel(), ...helpers].map(title).join(", ")} giải độc lập`
          : level === "max" ? `Bước 2/5: ${[cloudModel(), ...helpers].map(title).join(", ")} giải song song` : "Bước 2/4: giải theo kế hoạch", undefined);
        await answerWithTools(base, reply, node);
        await ensureAnswer(base, reply, node);
        const draft = splitThink(reply.content).answer.trim();

        // Mức Cân bằng: mô hình GLM nhóm nhanh (Z.ai, không gồm Titan 4 Mega) tự chấm lại một lượt với câu khó (toán, logic, lập trình thi đấu), câu hỏi lập trình và câu cần lập luận
        // (trừ trang web: đã có bước tự chạy thử và sửa lỗi).
        const skillsNow = activeSkills(chat);
        if (draft && level === "normal" && /^glm/.test(cloudModel()) && !PROVIDERS.shared.nvidia.includes(cloudModel()) && !skillsNow.some((k) => k.id === "web" || k.id === "project") &&
          (skillsNow.some((k) => k.hard || k.id === "code" || k.id === "reason") || draft.length > 1500)) {
          reply.fallback = shelve("Bản nháp đầu tiên");
          await judge([...history, { role: "assistant", content: draft }, { role: "user", content: REVIEW_PROMPT }], reply, node);
        }

        // Mức Kỹ: một mô hình khác soát lỗi (không viết lại), rồi mô hình chính sửa và viết câu trả lời cuối.
        if (draft && level === "careful") {
          const main = (reply.fallback = shelve("Lời giải nháp"));
          const critic = helpers[0] || cloudModel(), stops = [];
          step(`Bước 3/4: ${title(critic)} soát lỗi từng bước`, "Người chấm đang kiểm tra…");
          const [c] = await gather([silentRun([...history, { role: "assistant", content: draft.slice(0, 12000) }, { role: "user", content: CRITIC_PROMPT }], critic, stops)], stops, 120000);
          keep(c, "Nhận xét của người chấm");
          if (c && noErrors(c.answer)) restore(main);
          else {
            step("Bước 4/4: sửa lỗi và viết câu trả lời cuối", undefined);
            await judge([...history, { role: "assistant", content: draft.slice(0, 12000) },
              { role: "user", content: c ? FIX_PROMPT.replace("{C}", c.answer.slice(0, 6000)) : REVIEW_PROMPT }], reply, node);
          }
        }

        // Mức Tối đa: chờ các lời giải khác, kiểm tra chéo, tổng hợp, rồi một mô hình khác kiểm tra lần cuối.
        if (draft && level === "max") {
          const main = (reply.fallback = shelve("Lời giải 1"));
          step("Bước 2/5: chờ các mô hình khác giải xong", "Đang chờ các mô hình khác giải xong…");
          // Chờ thêm tối đa 60 giây sau khi mô hình chính xong (tổng không quá khoảng 3 phút); lời giải dở dang vẫn dùng nếu đủ dài.
          const others = (await gather(solvers, solverStops, Math.max(60000, 180000 - (Date.now() - solverStart)))).filter(Boolean);
          others.forEach((o, i) => keep(o, `Lời giải ${i + 2}`));
          const sols = [{ model: main.model, answer: draft }, ...others.map((o) => ({ model: o.draft.model, answer: o.answer }))];
          const tag = (t, i, model, text) => `<${t}_${"ABCD"[i]} mo_hinh="${model}">\n${text}\n</${t}_${"ABCD"[i]}>`;
          // Bước 3: kiểm tra chéo, mỗi mô hình soát tất cả các lời giải.
          const checkers = [cloudModel(), ...helpers], cstops = [];
          step(`Bước 3/5: ${checkers.map(title).join(", ")} kiểm tra chéo`, "Đang kiểm tra chéo các lời giải…");
          const solText = sols.map((x, i) => tag("loi_giai", i, x.model, x.answer.slice(0, 6000))).join("\n\n");
          const crits = (await gather(checkers.map((m) => silentRun(withNote(history, CROSS_PROMPT.replace("{S}", solText)), m, cstops)), cstops, 90000)).filter(Boolean);
          crits.forEach((c) => keep(c, "Kiểm tra chéo"));
          // Bước 4: mô hình chính tổng hợp, kiểm chứng và viết câu trả lời.
          step("Bước 4/5: tổng hợp, kiểm chứng và viết câu trả lời", undefined);
          const review = REVIEW_MULTI_PROMPT.replace("{N}", others.length)
            .replace("{B}", others.length ? others.map((o, i) => tag("loi_giai", i + 1, o.draft.model, o.answer.slice(0, 6000))).join("\n\n") : "(không có)")
            .replace("{K}", crits.length ? crits.map((c, i) => tag("kiem_tra", i, c.draft.model, c.answer.slice(0, 4000))).join("\n\n") : "(không có)");
          await judge([...history, { role: "assistant", content: draft.slice(0, 8000) }, { role: "user", content: review }], reply, node);
          // Bước 5: một mô hình khác kiểm tra lần cuối; còn lỗi thì sửa thêm một lượt.
          const final1 = splitThink(reply.content).answer.trim();
          if (final1 && !reply.judgeFailed) {
            const first = shelve("Câu trả lời trước bước kiểm tra cuối");
            const checker = helpers[0] || cloudModel(), fstops = [];
            step(`Bước 5/5: ${title(checker)} kiểm tra lần cuối`, "Đang kiểm tra lần cuối…");
            const [f] = await gather([silentRun([...history, { role: "assistant", content: final1.slice(0, 12000) }, { role: "user", content: FINAL_CHECK_PROMPT }], checker, fstops)], fstops, 90000);
            keep(f, "Kiểm tra lần cuối");
            if (!f || noErrors(f.answer)) restore(first);
            else {
              reply.fallback = first;
              step("Bước 5/5: sửa lỗi lần cuối", undefined);
              await judge([...history, { role: "assistant", content: final1.slice(0, 12000) }, { role: "user", content: FIX_PROMPT.replace("{C}", f.answer.slice(0, 6000)) }], reply, node);
            }
          }
        }

        // Mức Ultra: vòng 1 giải độc lập; vòng 2 trao đổi suy luận và sửa cho nhau; kiểm tra đồng thuận, còn bất đồng thì thêm vòng 3;
        // giám khảo tổng hợp; các mô hình khác kiểm tra chéo; giám khảo tinh chỉnh; kiểm tra lần cuối (sửa xong thì kiểm lại thêm một lần).
        if (draft && level === "ultra") {
          const tag = (t, i, model, text) => `<${t}_${"ABCDE"[i]} mo_hinh="${model}">\n${text}\n</${t}_${"ABCDE"[i]}>`;
          const listOf = (arr) => arr.map((x, i) => tag("loi_giai", i, x.name, x.answer.slice(0, 5000))).join("\n\n");
          const main = (reply.fallback = shelve("Vòng 1: lời giải 1"));
          step("Bước 2/8: chờ các mô hình khác giải xong vòng 1", "Đang chờ các mô hình khác giải xong…");
          const r1 = await gather(solvers, solverStops, Math.max(60000, 210000 - (Date.now() - solverStart)));
          let team = [{ model: cloudModel(), name: main.model, answer: draft }];
          r1.forEach((o, i) => { if (o) { keep(o, `Vòng 1: lời giải ${team.length + 1}`); team.push({ model: helpers[i], name: o.draft.model, answer: o.answer }); } });
          // Bước 3: trao đổi. Mỗi mô hình đọc lời giải của cả nhóm, kiểm chứng chỗ mâu thuẫn và viết lại lời giải đã cải tiến.
          const roundOf = async (prompt, label, ms) => {
            const st = [];
            const res = await gather(team.map((x, i) => silentRun(withNote(base, prompt.replace("{L}", "ABCDE"[i])), x.model, st)), st, ms);
            res.forEach((o, i) => { if (o) keep(o, `${label}: lời giải ${i + 1}`); });
            team = team.map((x, i) => (res[i] ? { model: x.model, name: res[i].draft.model, answer: res[i].answer } : x));
          };
          step(`Bước 3/8: ${team.map((x) => title(x.model)).join(", ")} trao đổi suy luận và sửa lời giải`, "Các mô hình đang trao đổi và sửa lời giải cho nhau…");
          await roundOf(DEBATE_PROMPT.replace("{S}", listOf(team)), "Vòng 2 sau trao đổi", 180000);
          // Bước 4: so sánh kết luận; còn bất đồng thì thêm vòng 3 chỉ bàn về chỗ bất đồng.
          if (team.length > 1) {
            step("Bước 4/8: kiểm tra các mô hình đã thống nhất chưa", "Đang so sánh kết luận của các mô hình…");
            const cst = [];
            const [cons] = await gather([silentRun(withNote(history, CONSENSUS_PROMPT.replace("{S}", listOf(team))), cloudModel(), cst, true)], cst, 60000);
            keep(cons, "So sánh kết luận");
            const split = cons?.answer.match(/BẤT ĐỒNG\s*:?([\s\S]*)$/);
            if (split) {
              step("Bước 4/8: vòng 3, trao đổi tiếp về chỗ còn bất đồng", "Các mô hình đang tranh luận về chỗ còn bất đồng…");
              await roundOf(DEBATE2_PROMPT.replace("{S}", listOf(team)).replace("{D}", (split[1].trim() || cons.answer).slice(0, 3000)), "Vòng 3", 150000);
            }
          }
          // Bước 5: giám khảo (mô hình đang chọn) tổng hợp các lời giải đã cải tiến.
          step("Bước 5/8: giám khảo tổng hợp các lời giải", undefined);
          const [lead, ...rest] = team;
          const review = REVIEW_MULTI_PROMPT.replace("{N}", rest.length)
            .replace("{B}", rest.length ? rest.map((x, i) => tag("loi_giai", i + 1, x.name, x.answer.slice(0, 5000))).join("\n\n") : "(không có)")
            .replace("{K}", "(các lời giải trên đã được các mô hình trao đổi và sửa cho nhau qua nhiều vòng)");
          await judge([...history, { role: "assistant", content: lead.answer.slice(0, 8000) }, { role: "user", content: review }], reply, node);
          let current = splitThink(reply.content).answer.trim();
          if (current && !reply.judgeFailed) {
            // Bước 6: các mô hình khác cùng soát câu trả lời của giám khảo.
            const synth = shelve("Câu trả lời của giám khảo trước kiểm tra chéo");
            const checkers = helpers.length ? helpers : [cloudModel()], cstops = [];
            step(`Bước 6/8: ${checkers.map(title).join(", ")} kiểm tra chéo câu trả lời`, "Đang kiểm tra chéo…");
            const crits = (await gather(checkers.map((m) => silentRun([...history, { role: "assistant", content: current.slice(0, 12000) },
              { role: "user", content: CRITIC_PROMPT }], m, cstops)), cstops, 120000)).filter(Boolean);
            crits.forEach((c) => keep(c, "Kiểm tra chéo"));
            const problems = crits.filter((c) => !noErrors(c.answer));
            if (!problems.length) restore(synth);
            else {
              // Bước 7: giám khảo tinh chỉnh theo các nhận xét (tự kiểm chứng từng ý, vì người soát cũng có thể sai).
              reply.fallback = synth;
              step("Bước 7/8: giám khảo tinh chỉnh theo các nhận xét", undefined);
              await judge([...history, { role: "assistant", content: current.slice(0, 12000) },
                { role: "user", content: FIX_PROMPT.replace("{C}", problems.map((c, i) => tag("nhan_xet", i, c.draft.model, c.answer.slice(0, 4000))).join("\n\n")) }], reply, node);
            }
            // Bước 8: một mô hình khác kiểm tra lần cuối; còn lỗi thì sửa rồi kiểm lại (tối đa 2 lượt).
            for (let pass = 0; pass < 2; pass++) {
              current = splitThink(reply.content).answer.trim();
              if (!current || reply.judgeFailed) break;
              const before = shelve(pass ? "Câu trả lời sau lần sửa cuối" : "Câu trả lời trước bước kiểm tra cuối");
              const checker = helpers[(helpers.length - 1 - pass + helpers.length) % Math.max(1, helpers.length)] || cloudModel(), fstops = [];
              step(`Bước 8/8: ${title(checker)} kiểm tra lần cuối${pass ? " (lượt 2)" : ""}`, "Đang kiểm tra lần cuối…");
              const [f] = await gather([silentRun([...history, { role: "assistant", content: current.slice(0, 12000) }, { role: "user", content: FINAL_CHECK_PROMPT }], checker, fstops)], fstops, 120000);
              keep(f, pass ? "Kiểm tra lần cuối (lượt 2)" : "Kiểm tra lần cuối");
              if (!f || noErrors(f.answer)) { restore(before); break; }
              reply.fallback = before;
              step(`Bước 8/8: sửa lỗi lần cuối${pass ? " (lượt 2)" : ""}`, undefined);
              await judge([...history, { role: "assistant", content: current.slice(0, 12000) }, { role: "user", content: FIX_PROMPT.replace("{C}", f.answer.slice(0, 6000)) }], reply, node);
            }
          }
        }
      }
      // Trang web hoàn chỉnh: tự chạy thử, có lỗi thì tự sửa (tối đa 2 lượt).
      await autoFixWeb(history, reply, node);
    } catch (e) {
      if (e.name !== "AbortError") {
        reply.error = /Failed to fetch|NetworkError|Load failed/i.test(e.message)
          ? `Không kết nối được tới ${PROVIDERS[settings.provider].name}. Kiểm tra kết nối mạng rồi thử lại.`
          : e.message;
      }
      // Dừng hoặc lỗi giữa chừng: lấy câu trả lời tốt nhất đã có (lời giải chính hoặc câu trả lời trước bước cuối).
      if (reply.fallback && !splitThink(reply.content).answer.trim()) {
        const fb = reply.fallback;
        Object.assign(reply, { content: fb.content, reasoning: fb.reasoning, thinkSecs: fb.thinkSecs, review: false });
        if (reply.drafts) reply.drafts = reply.drafts.filter((d) => d !== fb);
      }
    } finally {
      controller?.abort(); // dừng các lời giải của hội đồng còn đang chạy
      controller = null;
      delete reply.notice; delete reply.stage; delete reply.fallback; delete reply.judgeFailed; delete reply.noGaps;
      reply.cutWarning = unfinished(reply, chat);
      saveRemembered(reply, chat.messages.at(-2)?.content || "");
      setBusy(false);
      chat.updated = Date.now();
      saveChats();
      paintAssistant(node, reply, false);
      scrollDown();
      if (!reply.error) autoTitle(chat);
    }
  }

  // Mô hình suy nghĩ xong rồi kết thúc mà không viết phần trả lời (đôi khi nó viết luôn câu trả lời trong phần suy nghĩ):
  // gửi lại phần suy nghĩ và yêu cầu viết ngay câu trả lời cuối, tắt suy nghĩ dài.
  async function ensureAnswer(messages, reply, node) {
    const { think, answer } = splitThink((reply.reasoning ? `<think>${reply.reasoning}</think>` : "") + reply.content);
    if (answer.trim() || !think.trim()) return;
    const secs = reply.thinkSecs;
    Object.assign(reply, { fast: true, notice: "Đang viết câu trả lời…" });
    paintAssistant(node, reply, true);
    try {
      await answerWithTools([...messages,
        { role: "assistant", content: "(Phần suy nghĩ của tôi)\n" + think.trim().slice(-8000) },
        { role: "user", content: "Bạn mới suy nghĩ mà chưa viết câu trả lời. Dựa trên phần suy nghĩ trên, hãy viết ngay câu trả lời cuối cùng hoàn chỉnh cho câu hỏi ban đầu, cùng ngôn ngữ với câu hỏi." },
      ], reply, node);
    } finally { delete reply.fast; delete reply.notice; }
    if (secs) reply.thinkSecs = secs;
  }

  // Bước chấm lại (tự kiểm tra hoặc giám khảo của Nghĩ kỹ). Với bài dài (nhiều code), mô hình có thể dùng hết giới hạn độ dài
  // cho phần suy nghĩ mà chưa viết được câu trả lời: khi đó cho viết lại ngay, tắt suy nghĩ dài. Vẫn không được thì dùng
  // lời giải nháp đầu tiên và ghi chú, không báo lỗi.
  async function judge(messages, reply, node) {
    await answerWithTools(messages, reply, node);
    if (splitThink(reply.content).answer.trim()) return;
    Object.assign(reply, { content: "", reasoning: "", thinkSecs: null, tps: null, fast: true, notice: "Đang viết câu trả lời cuối…" });
    const last = messages.at(-1);
    try {
      await answerWithTools([...messages.slice(0, -1), { ...last, content: last.content + "\n\n(Viết ngay câu trả lời cuối cùng hoàn chỉnh, không suy nghĩ dài.)" }], reply, node);
    } finally { delete reply.fast; delete reply.notice; }
    if (splitThink(reply.content).answer.trim()) return;
    const first = reply.fallback || reply.drafts[0];
    Object.assign(reply, { content: first.content, reasoning: first.reasoning, thinkSecs: first.thinkSecs, review: false, truncated: false, judgeFailed: true,
      via: `${first.model || modelTitle("shared", cloudModel())} (bước chấm lại không viết xong nên đây là ${(first.label || "lời giải nháp 1").toLowerCase()})` });
    reply.drafts = reply.drafts.filter((d) => d !== first);
    if (!reply.drafts.length) delete reply.drafts;
  }

  // Toàn bộ file của dự án thành các khối code có tên file (để mô hình thấy đủ dự án khi sửa).
  // Khối ``` lồng trong file Markdown (README, PLAN) đổi thành ~~~ để không làm vỡ khối của file.
  const projectDump = (files) => [...files].map(([p, c]) => "```" + (extOf(p) === "md" ? "markdown" : extOf(p)) + " " + p + "\n" +
    (extOf(p) === "md" ? c.replace(/^([ \t]*)```/gm, "$1~~~") : c) + "\n```").join("\n\n");
  // Câu trả lời gửi lại cho mô hình: bản tự sửa của dự án nhiều file chỉ có các file đã đổi, nên kèm bản đầu để mô hình thấy đủ dự án.
  function historyAnswer(m) {
    const answer = splitThink(m.content).answer.trim();
    const first = (m.drafts || []).find((d) => /^Bản đầu/.test(d.label || ""));
    if (!first || !filesIn(answer).length || filesIn(splitThink(first.content).answer).length < 2) return answer;
    return splitThink(first.content).answer.trim() + "\n\n(Sau khi tự chạy thử, đã sửa các file sau:)\n\n" + answer;
  }
  // Tự chạy thử trang web trong một khung ẩn khổ điện thoại (390px): bắt lỗi JavaScript và lỗi tải tài nguyên, bấm thử mọi nút,
  // kiểm tra trang có bị tràn ngang không. Khung có sandbox (không đọc được dữ liệu của trang chat).
  function checkWebPage(code) {
    return new Promise((resolve) => {
      const id = Math.random().toString(36).slice(2), errors = [];
      const probe = `<script>(()=>{const id=${JSON.stringify(id)},seen=new Set(),send=(m)=>{m=String(m).slice(0,300);if(seen.has(m)||seen.size>12)return;seen.add(m);parent.postMessage({chk:id,msg:m},"*")};` +
        // Ảnh, video, âm thanh lấy từ mạng ngoài (ảnh AI, ảnh minh hoạ) tải chậm hoặc bị chặn trong khung thử không phải lỗi code: bỏ qua.
        `addEventListener("error",e=>{const t=e.target;if(t&&t!==window&&(t.src||t.href)){const raw=t.getAttribute("src")||t.getAttribute("href")||"";` +
        `if(/^(IMG|SOURCE|VIDEO|AUDIO|TRACK)$/.test(t.tagName)&&/^(https?:)?[/][/]/i.test(raw))return;send("Không tải được "+(t.src||t.href))}` +
        `else send((e.message||"Lỗi")+(e.lineno?" (dòng "+e.lineno+")":""))},true);` +
        `addEventListener("unhandledrejection",e=>send("Promise bị lỗi: "+((e.reason&&e.reason.message)||e.reason)));` +
        `const ce=console.error;console.error=(...a)=>{send("console.error: "+a.map(String).join(" "));ce.apply(console,a)};` +
        `addEventListener("submit",e=>e.preventDefault(),true);` +

    const fix = { streak: 0, last: "", total: 0 };
    let toolLimit = TOOL_ROUNDS;
    for (let round = 0; ; round++) {
      const start = reply.content.length;
      const allowTool = round < toolLimit;
      // Máy chủ đôi khi ngắt luồng giữa chừng ("network error"): gửi lại tối đa 2 lần, cho mô hình viết tiếp từ chỗ dừng.
      for (let retry = 0; ; retry++) {
        const partial = reply.content.slice(start).trim();
        const pass = retry && partial
          ? [...messages, { role: "assistant", content: partial }, { role: "user", content: "Kết nối bị gián đoạn. Viết tiếp đúng từ chỗ bạn dừng, không lặp lại phần đã viết." }]
          : messages;
        try {
          await runPass(pass, reply, node, allowTool ? (text) => RUN_BLOCK.test(text.slice(start)) : null);
          // Viết cho xong: code bị ngắt, chạm giới hạn độ dài, dự án còn thiếu file (xem completeAnswer).
          await completeAnswer(messages, reply, node, start, allowTool);
          break;
        } catch (e) {
          if (e.name !== "TypeError" || retry >= 2) throw e;
          if (!partial) reply.content = reply.content.slice(0, start);
          if (reply.reasoning) reply.reasoning += "\n\n· · ·\n\n";
          reply.notice = "Mất kết nối, đang nối lại…";
          paintAssistant(node, reply, true);
        }
      }
      const m = allowTool && reply.content.slice(start).match(RUN_BLOCK);
      if (!m) return;
      // Bỏ phần mô hình viết sau khối code (thường là đoán kết quả).
      const cut = start + m.index + m[0].length;
      reply.content = reply.content.slice(0, cut);
      const tool = TOOLS[m[1]] || TOOLS["py-run"];
      const search = tool.lookup;
      reply.notice = /^py/.test(m[1]) && !pyReady ? "Đang tải Python (lần đầu mất khoảng 10–20 giây)…" : tool.notice;
      paintAssistant(node, reply, true);
      let out = await tool.run(m[2].trim() ? m[2] : "");
      if (typeof out === "object") {
        // Ảnh tạo ra nằm trong reply.genImages; nội dung chỉ giữ một chỗ đánh dấu nhỏ để gửi lại cho mô hình.
        // Nhiều phiên bản thì đặt các chỗ đánh dấu trên cùng một dòng để hiện thành lưới.
        const imgs = out.images || (out.image ? [out.image] : []), metas = out.metas || (out.meta ? [out.meta] : []);
        if (imgs.length) {
          const alt = (metas[0]?.prompt || m[2]).trim().replace(/[\[\]\n]/g, " ").slice(0, 200);
          const marks = imgs.map((url, j) => {
            reply.genImages = [...(reply.genImages || []), url];
            reply.genMeta = [...(reply.genMeta || [])];
            reply.genMeta[reply.genImages.length - 1] = metas[j] || null;
            return `![${alt}](genimg:${reply.genImages.length - 1})`;
          });
          reply.content += `\n\n${marks.join(" ")}\n\n`;
        }
        out = out.out;
      }
      if (search && m[1] !== "image") {
        const known = reply.sources || [];
        reply.sources = [...known, ...sourcesFrom(out).filter((x) => !known.some((k) => k.url === x.url))].slice(0, 16);
      }
      reply.content += "\n\n```output\n" + out + "\n```\n\n";
      const debug = search ? "" : debugFeedback(m[1], m[2], String(out), fix);
      // Đang sửa lỗi thì cho thêm lượt chạy lại (tối đa FIX_BONUS lượt), để không phải dừng khi code vẫn còn lỗi.
      if (debug && round + 1 >= toolLimit && toolLimit < TOOL_ROUNDS + FIX_BONUS) toolLimit++;
      reply.notice = debug ? (fix.streak >= 2 ? "Lỗi lặp lại, đang đổi cách sửa…" : "Code bị lỗi, đang tìm nguyên nhân và sửa…") : "Đang đọc kết quả…";
      paintAssistant(node, reply, true);
      messages = [...messages,
        { role: "assistant", content: reply.content.slice(start, cut).trim() },
        { role: "user", content: (search ? `Kết quả ${tool.label.toLowerCase()}:\n\`\`\`\n` : "Kết quả chạy code:\n```\n") + out +
          "\n```\nTiếp tục trả lời dựa trên kết quả này, không lặp lại khối lệnh vừa chạy." + debug +
          // Lượt cuối: không chạy công cụ nữa, nên bắt mô hình trả lời luôn.
          (round + 1 >= toolLimit ? (debug ? " Đã hết lượt chạy code: trình bày code đã sửa tốt nhất kèm nói rõ lỗi còn lại (nếu có) và cách người dùng tự kiểm tra." : "") + " Đã hết lượt dùng công cụ: không viết thêm khối lệnh nào, trả lời ngay bằng thông tin đã có." : "") },
      ];
      if (reply.reasoning) reply.reasoning += "\n\n· · ·\n\n";
    }
  }

  // Tra Wikipedia: tìm bài phù hợp, rồi lấy phần mở đầu và các đoạn chứa từ khoá (bảng biểu không có trong bản chữ).
  // Từ khoá có dấu tiếng Việt thì tra Wikipedia tiếng Việt trước, không thì tiếng Anh trước.
  async function searchWiki(query) {
    if (!query) return "Lỗi: thiếu từ khoá tra cứu.";
    const api = async (lang, params) => {
      const url = `https://${lang}.wikipedia.org/w/api.php?` + new URLSearchParams({ ...params, format: "json", formatversion: "2", origin: "*" });
      const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(10000)]) : controller.signal;
      const res = await fetch(url, { signal });
      if (!res.ok) throw new Error(`Wikipedia trả lỗi ${res.status}`);
      return (await res.json()).query;
    };
    const terms = query.toLowerCase().split(/[\s,.;:!?()"']+/).filter((w) => w.length > 2 || /\d/.test(w));
    const excerpt = (text) => {
      const paras = text.split(/\n+/).map((t) => t.trim()).filter((t) => t.length > 30);
      const intro = paras.slice(0, 2).join("\n").slice(0, 700);
      const hits = paras.slice(2)
        .map((t, i) => ({ t, i, score: terms.filter((w) => t.toLowerCase().includes(w)).length }))
        .filter((x) => x.score).sort((a, b) => b.score - a.score || a.i - b.i).slice(0, 4)
        .sort((a, b) => a.i - b.i).map((x) => (x.t.length > 600 ? x.t.slice(0, 600) + "…" : x.t));
      return [intro, ...hits].join("\n…\n");
    };
    const lookup = async (lang) => {
      const titles = ((await api(lang, { action: "query", list: "search", srsearch: query, srlimit: "2", srprop: "" })).search || []).map((r) => r.title);
      const pages = await Promise.all(titles.map((t) => api(lang, { action: "query", prop: "extracts", explaintext: "1", titles: t, redirects: "1" })));
      return pages.map((q) => q.pages?.[0]).filter((p) => p?.extract?.trim()).map((p) =>
        `### ${p.title}\n${excerpt(p.extract)}\nNguồn: https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title.replace(/ /g, "_"))}`);
    };
    const langs = /[^\x00-\x7F]/.test(query) ? ["vi", "en"] : ["en", "vi"];
    try {
      let found = await lookup(langs[0]);
      if (!found.length) found = await lookup(langs[1]);
      return found.length ? found.join("\n\n") : `Không tìm thấy bài Wikipedia nào cho "${query}". Thử từ khoá khác hoặc từ khoá tiếng Anh.`;
    } catch (e) {
      if (e.name === "AbortError" && controller?.signal.aborted) throw e;
      return "Lỗi khi tra cứu: " + (e.name === "TimeoutError" ? "Wikipedia không phản hồi." : e.message);
    }
  }

  // Tìm trên web (DuckDuckGo) và đọc trang web, đều qua Jina Reader (r.jina.ai, miễn phí, có CORS, chuyển trang thành chữ).
  const READER = "https://r.jina.ai/";
  async function jina(url) {
    const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(25000)]) : controller.signal;
    const res = await fetch(READER + url, { signal });
    if (res.status === 429) throw new Error("dịch vụ đọc web đang bị giới hạn lượt, đợi một phút rồi thử lại");
    if (!res.ok) throw new Error(`dịch vụ đọc web trả lỗi ${res.status}`);
    return res.text();
  }
  const toolError = (e) => {
    if (e.name === "AbortError" && controller?.signal.aborted) throw e;
    return "Lỗi: " + (e.name === "TimeoutError" ? "trang web không phản hồi." : e.message);
  };

  // Kết quả tìm kiếm DuckDuckGo dạng danh sách { title, url, snippet }.
  async function webResults(query, max = 6) {
    const md = await jina("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(query.trim()));
    // Mỗi kết quả: một dòng "## [tiêu đề](link chuyển hướng ?uddg=...)" rồi một dòng mô tả dạng "[...](...)".
    const results = [];
    const lines = md.split("\n");
    const clean = (t) => t.replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
    for (let i = 0; i < lines.length && results.length < max; i++) {
      const h = lines[i].match(/^## \[(.+?)\]\((\S+?)\)\s*$/);
      if (!h) continue;
      let url = h[2];
      try { url = new URL(url).searchParams.get("uddg") || url; } catch {}
      if (/duckduckgo\.com\/y\.js|ad_domain|ad_provider/.test(h[2])) continue; // bỏ quảng cáo
      let snippet = "";
      for (let j = i + 1; j < Math.min(i + 6, lines.length); j++) {
        if (lines[j].startsWith("## ")) break;
        const sm = lines[j].match(/^\[(.+)\]\(\S+\)\s*$/);
        if (sm && !sm[1].startsWith("![") && !/^[\w.-]+\.[a-z]{2,}\//i.test(sm[1])) { snippet = sm[1]; break; }
      }
      results.push({ title: clean(h[1]), url, snippet: clean(snippet) });
    }
    return results;
  }
  async function searchWeb(query) {
    if (!query.trim()) return "Lỗi: thiếu từ khoá tìm kiếm.";
    try {
      const results = await webResults(query);
      return results.length
        ? results.map((r, i) => `${i + 1}. ${r.title}\n${r.url}\n${r.snippet}`).join("\n\n") + "\n\n(Muốn xem chi tiết một kết quả thì dùng công cụ read với đường dẫn của nó.)"
        : `Không tìm thấy kết quả nào cho "${query.trim()}".`;
    } catch (e) { return toolError(e); }
  }

  // Tin tức mới nhất (Bing News qua Jina Reader): tiêu đề, tóm tắt, ngày đăng, đường dẫn bài gốc.
  async function searchNews(query) {
    query = query.trim();
    if (!query) return "Lỗi: thiếu từ khoá tin tức.";
    try {
      const lang = /[^\x00-\x7F]/.test(query) ? "vi" : "en";
      const md = await jina(`https://www.bing.com/news/search?q=${encodeURIComponent(query)}&format=rss&setlang=${lang}`);
      const items = [];
      for (const block of md.split(/^### /m).slice(1)) {
        const h = block.match(/^\[(.+?)\]\((\S+?)\)/);
        if (!h) continue;
        let url = h[2];
        try { url = new URL(url).searchParams.get("url") || url; } catch {}
        const rest = block.split("\n").slice(1).map((l) => l.trim()).filter(Boolean);
        const date = rest.find((l) => /^\w{3}, \d{1,2} \w{3} \d{4}/.test(l)) || "";
        const desc = rest.find((l) => !l.startsWith("[") && l !== date) || "";
        const when = date ? new Date(date).toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" }) : "";
        items.push(`${items.length + 1}. ${h[1]}${when ? ` (${when})` : ""}\n${url}\n${desc.slice(0, 400)}`);
        if (items.length >= 8) break;
      }
      return items.length
        ? items.join("\n\n") + "\n\n(Khi trả lời, dẫn link tới các bài gốc ở trên, không dẫn Bing News. Muốn đọc kỹ một bài thì dùng công cụ read với đường dẫn của nó.)"
        : `Không có tin tức nào cho "${query}". Thử từ khoá ngắn hơn hoặc dùng search.`;
    } catch (e) { return toolError(e); }
  }

  // Nghiên cứu sâu: tìm nhiều truy vấn cùng lúc, đọc luôn các trang tốt nhất và trích đoạn liên quan,
  // để mô hình có dữ kiện từ nhiều nguồn chỉ trong một lần dùng công cụ.
  async function research(block) {
    const queries = block.split("\n").map((q) => q.replace(/^[-*\d.)\s]+/, "").trim()).filter(Boolean).slice(0, 4);
    if (!queries.length) return "Lỗi: thiếu câu hỏi cần nghiên cứu.";
    const lists = await Promise.allSettled(queries.map((q) => webResults(q, 5)));
    const wiki = searchWiki(queries[0]).catch((e) => toolError(e));
    // Lấy xen kẽ kết quả đầu của từng truy vấn để các trang đọc được đa dạng; bỏ trùng và trang khó đọc.
    const seen = new Set(), picked = [], all = [];
    for (let rank = 0; rank < 5; rank++) {
      for (const l of lists) {
        const r = l.status === "fulfilled" && l.value[rank];
        if (!r) continue;
        const key = r.url.replace(/[#?].*$/, "").replace(/\/$/, "");
        if (seen.has(key)) continue;
        seen.add(key); all.push(r);
        if (picked.length < 4 && !/youtube\.com|youtu\.be|facebook\.com|tiktok\.com|instagram\.com|\.pdf$/i.test(r.url)) picked.push(r);
      }
    }
    if (!all.length) {
      const why = lists.find((l) => l.status === "rejected");
      return why ? toolError(why.reason) : `Không tìm thấy kết quả nào cho: ${queries.join("; ")}.`;
    }
    const terms = [...new Set(queries.join(" ").toLowerCase().split(/[\s,.;:!?()"']+/).filter((w) => w.length > 2 || /\d/.test(w)))];
    const excerpt = (text) => {
      const paras = text.replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
        .split(/\n+/).map((t) => t.trim()).filter((t) => t.length > 60);
      const scored = paras.map((t, i) => ({ t, i, s: terms.filter((w) => t.toLowerCase().includes(w)).length }))
        .filter((x) => x.s).sort((a, b) => b.s - a.s || a.i - b.i);
      let out = "", used = [];
      for (const x of scored) { if (out.length > 2600) break; used.push(x); out += x.t; }
      return used.sort((a, b) => a.i - b.i).map((x) => (x.t.length > 900 ? x.t.slice(0, 900) + "…" : x.t)).join("\n…\n") ||
        paras.slice(0, 3).join("\n").slice(0, 1500);
    };
    const pages = await Promise.allSettled(picked.map(async (r) => `### ${r.title}\n${r.url}\n${excerpt(await jina(r.url)) || r.snippet}`));
    const read = pages.map((p, i) => (p.status === "fulfilled" ? p.value : `### ${picked[i].title}\n${picked[i].url}\n(Không đọc được trang, tóm tắt: ${picked[i].snippet})`));
    return `Đã tìm: ${queries.join(" | ")}\n\n## Nội dung các trang đã đọc\n${read.join("\n\n")}\n\n` +
      `## Các kết quả khác\n${all.filter((r) => !picked.includes(r)).slice(0, 8).map((r) => `- ${r.title}\n  ${r.url}\n  ${r.snippet}`).join("\n")}\n\n` +
      `## Wikipedia\n${await wiki}`;
  }

  // Lấy danh sách nguồn (tiêu đề, đường dẫn) từ kết quả tra cứu để hiện dưới câu trả lời.
  function sourcesFrom(out) {
    const found = [];
    let title = "";
    for (const line of String(out).split("\n")) {
      const t = line.match(/^\s*(?:###\s+|\d+\.\s+|-\s+)(.+)$/);
      const u = line.match(/https?:\/\/[^\s\]>"']+/);
      if (u && !/r\.jina\.ai|duckduckgo\.com|bing\.com\/news\/apiclick|\.(png|jpe?g|gif|svg|ico)$/i.test(u[0])) {
        // Giữ dấu ")" thuộc đường dẫn (ví dụ Rust_(programming_language)), bỏ dấu ")" và dấu câu thừa ở cuối.
        let url = u[0].replace(/[.,;]+$/, "");
        while (url.endsWith(")") && (url.match(/\(/g) || []).length < (url.match(/\)/g) || []).length) url = url.slice(0, -1);
        if (!found.some((s) => s.url === url)) found.push({ url, title: (title || "").replace(/\s*\(\d{1,2}\/\d{1,2}\/\d{4}.*$/, "").slice(0, 90) });
        title = "";
      } else if (t && !/^https?:/.test(t[1])) title = t[1].trim();
    }
    return found;
  }

  async function readPage(url) {
    url = url.trim().split(/\s+/)[0];
    if (!/^https?:\/\//i.test(url)) return "Lỗi: cần một đường dẫn bắt đầu bằng http:// hoặc https://.";
    try {
      let text = (await jina(url))
        .replace(/!\[[^\]]*\]\([^)]*\)/g, "") // bỏ ảnh
        .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1") // giữ chữ của link, bỏ đường dẫn
        .replace(/\n{3,}/g, "\n\n").trim();
      if (text.length > 12000) text = text.slice(0, 12000) + "\n…(trang dài, phần sau đã bị cắt)";
      return text || "Trang này không có nội dung chữ.";
    } catch (e) { return toolError(e); }
  }

  // ---------- Nguồn tra cứu chuyên biệt (đều miễn phí, không cần key, gọi thẳng từ trình duyệt) ----------
  async function getJson(url) {
    const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(15000)]) : controller.signal;
    const res = await fetch(url, { signal });
    if (res.status === 429 || res.status === 403) throw new Error("nguồn này đang giới hạn lượt, thử lại sau ít phút");
    if (!res.ok) throw new Error(`nguồn trả lỗi ${res.status}`);
    return res.json();
  }
  const stripHtml = (h) => String(h || "").replace(/<[^>]+>/g, " ").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/\s+/g, " ").trim();

  // Tìm cùng lúc trên Wikipedia và web, để có nhiều nguồn đối chiếu.
  async function searchAll(q) {
    const [wiki, web] = await Promise.allSettled([searchWiki(q.trim()), searchWeb(q)]);
    const part = (r) => (r.status === "fulfilled" ? r.value : toolError(r.reason));
    return `## Wikipedia\n${part(wiki)}\n\n## Web\n${part(web)}`;
  }

  // Thời tiết hiện tại và 3 ngày tới (Open-Meteo).
  const WMO = { 0: "trời quang", 1: "ít mây", 2: "có mây", 3: "nhiều mây", 45: "sương mù", 48: "sương mù đóng băng", 51: "mưa phùn nhẹ", 53: "mưa phùn", 55: "mưa phùn dày", 61: "mưa nhỏ", 63: "mưa vừa", 65: "mưa to", 71: "tuyết nhẹ", 73: "tuyết", 75: "tuyết dày", 80: "mưa rào nhẹ", 81: "mưa rào", 82: "mưa rào rất to", 95: "dông", 96: "dông kèm mưa đá", 99: "dông kèm mưa đá lớn" };
  async function weather(place) {
    try {
      const name = place.trim().replace(/^(thời tiết|thoi tiet|weather)\s+(ở|tại|in)?\s*/i, "");
      const geo = await getJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=vi`);
      const g = geo.results?.[0];
      if (!g) return `Không tìm thấy địa điểm "${name}". Thử tên không dấu hoặc tên tiếng Anh (ví dụ Hanoi, Da Nang).`;
      const w = await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}` +
        "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=4");
      const c = w.current, d = w.daily;
      const days = d.time.map((t, i) => `- ${t}: ${WMO[d.weather_code[i]] || "?"}, ${d.temperature_2m_min[i]}–${d.temperature_2m_max[i]}°C, khả năng mưa ${d.precipitation_probability_max[i] ?? "?"}%`);
      return `${g.name}${g.admin1 ? ", " + g.admin1 : ""}${g.country ? ", " + g.country : ""} (giờ địa phương ${c.time})\n` +
        `Hiện tại: ${WMO[c.weather_code] || "?"}, ${c.temperature_2m}°C (cảm giác ${c.apparent_temperature}°C), độ ẩm ${c.relative_humidity_2m}%, gió ${c.wind_speed_10m} km/h\n` +
        `Dự báo:\n${days.join("\n")}\nNguồn: Open-Meteo (open-meteo.com)`;
    } catch (e) { return toolError(e); }
  }

  // Tỷ giá ngoại tệ (cập nhật hằng ngày). Nhận dạng "USD VND", "100 USD sang VND", "EUR".
  async function rates(q) {
    try {
      const codes = (q.toUpperCase().match(/\b[A-Z]{3}\b/g) || []).filter((c) => c !== "TO");
      const amount = Number((q.match(/[\d.,]+/) || ["1"])[0].replace(/,/g, "")) || 1;
      const base = codes[0] || "USD", targets = codes.slice(1).length ? codes.slice(1) : ["VND", "USD", "EUR", "JPY", "CNY", "KRW"].filter((c) => c !== base);
      const r = await getJson(`https://open.er-api.com/v6/latest/${base}`);
      if (r.result !== "success") return `Không có tỷ giá cho ${base}.`;
      const lines = targets.map((t) => (r.rates[t] ? `${amount} ${base} = ${(amount * r.rates[t]).toLocaleString("vi-VN", { maximumFractionDigits: 4 })} ${t}` : `${t}: không có dữ liệu`));
      return `${lines.join("\n")}\nCập nhật: ${r.time_last_update_utc}\nNguồn: ExchangeRate-API (tỷ giá tham khảo, có thể khác giá ngân hàng)`;
    } catch (e) { return toolError(e); }
  }

  // Bài báo khoa học (OpenAlex): tiêu đề, tác giả, năm, số trích dẫn, tóm tắt, DOI.
  async function papers(q) {
    try {
      const r = await getJson(`https://api.openalex.org/works?search=${encodeURIComponent(q.trim())}&per-page=4&sort=relevance_score:desc`);
      if (!r.results?.length) return `Không tìm thấy bài báo nào cho "${q.trim()}".`;
      return r.results.map((w, i) => {
        // OpenAlex lưu tóm tắt dạng chỉ mục từ → vị trí, phải ghép lại.
        let abs = "";
        if (w.abstract_inverted_index) {
          const pos = [];
          for (const [word, idx] of Object.entries(w.abstract_inverted_index)) for (const k of idx) pos[k] = word;
          abs = pos.join(" ").slice(0, 700);
        }
        const authors = (w.authorships || []).slice(0, 4).map((a) => a.author?.display_name).filter(Boolean).join(", ");
        return `${i + 1}. ${w.display_name} (${w.publication_year || "?"})\nTác giả: ${authors || "?"}${w.authorships?.length > 4 ? " và cộng sự" : ""}\n` +
          `Trích dẫn: ${w.cited_by_count ?? 0}${w.doi ? ` · ${w.doi}` : ""}${w.primary_location?.source?.display_name ? ` · ${w.primary_location.source.display_name}` : ""}\n${abs ? "Tóm tắt: " + abs + "…" : ""}`;
      }).join("\n\n") + "\nNguồn: OpenAlex (openalex.org)";
    } catch (e) { return toolError(e); }
  }

  // Lập trình: câu hỏi Stack Overflow kèm câu trả lời được bình chọn cao nhất, và kho mã GitHub liên quan.
  async function devSearch(q) {
    const so = (async () => {
      const s = await getJson(`https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q=${encodeURIComponent(q.trim())}&site=stackoverflow&accepted=True&pagesize=3`);
      if (!s.items?.length) return "Stack Overflow: không có kết quả.";
      const ids = s.items.map((x) => x.question_id).join(";");
      const a = await getJson(`https://api.stackexchange.com/2.3/questions/${ids}/answers?order=desc&sort=votes&site=stackoverflow&filter=withbody&pagesize=20`);
      return "Stack Overflow:\n" + s.items.map((x, i) => {
        const best = (a.items || []).filter((y) => y.question_id === x.question_id).sort((m, n) => n.is_accepted - m.is_accepted || n.score - m.score)[0];
        return `${i + 1}. ${stripHtml(x.title)} (${x.score} điểm)\n${x.link}\n${best ? "Câu trả lời tốt nhất: " + stripHtml(best.body).slice(0, 1200) : ""}`;
      }).join("\n\n");
    })();
    const gh = (async () => {
      const r = await getJson(`https://api.github.com/search/repositories?q=${encodeURIComponent(q.trim())}&per_page=3&sort=stars`);
      if (!r.items?.length) return "GitHub: không có kết quả.";
      return "GitHub:\n" + r.items.map((x, i) => `${i + 1}. ${x.full_name} (★${x.stargazers_count}, ${x.language || "?"})\n${x.html_url}\n${x.description || ""}`).join("\n\n");
    })();
    const [a, b] = await Promise.allSettled([so, gh]);
    return [a, b].map((r) => (r.status === "fulfilled" ? r.value : toolError(r.reason))).join("\n\n");
  }

  // Từ điển tiếng Anh (Wiktionary): từ loại, nghĩa, ví dụ.

      const en = r.en || Object.values(r)[0];

  // Chạy code của mô hình trong Web Worker riêng: không có DOM, không có mạng, dừng sau 5 giây.
  function workerMain() {
    const out = [];
    const fmt = (v) => {
      if (typeof v === "string") return v;
      try { return JSON.stringify(v, null, 2) ?? String(v); } catch { return String(v); }
    };
    console.log = console.info = console.warn = console.error = (...a) => out.push(a.map(fmt).join(" "));
    self.fetch = self.XMLHttpRequest = self.WebSocket = self.importScripts = undefined;
    onmessage = async (e) => {
      try {
        let r = (0, eval)(e.data);
        if (r instanceof Promise) r = await r;
        if (r !== undefined && !out.length) out.push(fmt(r));
      } catch (err) {
        const at = String(err?.stack || "").match(/<anonymous>:(\d+):(\d+)/);
        out.push("Lỗi: " + (err?.name && err.name !== "Error" ? err.name + ": " : "") + (err?.message ?? err) + (at ? ` (dòng ${at[1]}, cột ${at[2]})` : ""));
      }
      postMessage(out.join("\n"));
    };
  }
  const workerUrl = URL.createObjectURL(new Blob([`(${workerMain})()`], { type: "text/javascript" }));

  function runJs(code) {
    return new Promise((resolve) => {
      const w = new Worker(workerUrl);
      const done = (text) => { clearTimeout(timer); w.terminate(); resolve(text); };
      const timer = setTimeout(() => done("Lỗi: code chạy quá 5 giây nên đã bị dừng."), 5000);
      w.onmessage = (e) => {
        const text = String(e.data).trim() || "(không có gì được in ra, hãy dùng console.log)";
        done(text.length > 4000 ? text.slice(0, 4000) + "\n…(đã cắt bớt)" : text);
      };
      w.onerror = (e) => { e.preventDefault(); done("Lỗi: " + e.message); };
      w.postMessage(code);
    });
  }

  // Python chạy bằng Pyodide trong một Web Worker riêng, giữ lại giữa các lần chạy để khỏi tải lại.
  // Sau khi tải xong, Worker bị tắt mạng (trừ lúc tự cài thư viện khi code có import), dừng sau 15 giây.
  const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.29.5/full/";
  function pyMain() {
    importScripts(PYODIDE + "pyodide.js");
    const realFetch = self.fetch.bind(self);
    const ready = loadPyodide({ indexURL: PYODIDE }).then((py) => {
      self.fetch = self.XMLHttpRequest = self.WebSocket = undefined;
      return py;
    });
    onmessage = async (e) => {
      const out = [];
      try {
        const py = await ready;
        postMessage({ ready: true });
        py.setStdout({ batched: (t) => out.push(t) });
        py.setStderr({ batched: (t) => out.push(t) });
        py.setStdin({ stdin: () => { throw new Error("input() không dùng được ở đây, hãy gán giá trị trực tiếp trong code."); } });
        self.fetch = realFetch;
        try { await py.loadPackagesFromImports(e.data, { messageCallback: () => {} }); } finally { self.fetch = undefined; }
        let r = await py.runPythonAsync(e.data, { globals: py.globals.get("dict")() });
        if (r !== undefined && r !== null && !out.length) out.push(String(r?.toString?.() ?? r));
        r?.destroy?.();
      } catch (err) {
        // Chỉ giữ phần cuối của traceback Python (phần đầu là code nội bộ của Pyodide).
        const msg = String(err.message || err).split("\n").filter((l) => !/\/lib\/python3|_pyodide|pyodide\//.test(l));
        out.push(msg.slice(-12).join("\n"));
      }
      postMessage({ out: out.join("\n") });
    };
  }
  let pyWorker = null, pyReady = false;
  let pyQueue = Promise.resolve();
  function runPy(code) {
    const run = pyQueue.then(() => runPyNow(code));
    pyQueue = run.catch(() => {});
    return run;
  }
  function runPyNow(code) {
    pyWorker ??= new Worker(URL.createObjectURL(new Blob([`const PYODIDE = ${JSON.stringify(PYODIDE)};(${pyMain})()`], { type: "text/javascript" })));
    const w = pyWorker;
    return new Promise((resolve) => {
      let timer = null;
      const done = (text) => {
        clearTimeout(timer); w.onmessage = w.onerror = null;
        resolve(text.length > 4000 ? text.slice(0, 4000) + "\n…(đã cắt bớt)" : text);
      };
      // Code chạy quá lâu thì bỏ Worker này, lần sau tạo Worker mới.
      const kill = (msg) => { w.terminate(); pyWorker = null; pyReady = false; done(msg); };
      const arm = (ms, msg) => { clearTimeout(timer); timer = setTimeout(() => kill(msg), ms); };
      arm(90000, "Lỗi: không tải được Python. Kiểm tra kết nối mạng rồi thử lại.");
      w.onmessage = (e) => {
        if (e.data.ready) { pyReady = true; arm(15000 + (/^\s*(import|from)\s/m.test(code) ? 45000 : 0), "Lỗi: code chạy quá lâu nên đã bị dừng."); return; }
        done(String(e.data.out).trim() || "(không có gì được in ra, hãy dùng print)");
      };
      w.onerror = (e) => { e.preventDefault(); kill("Lỗi: " + e.message); };
      w.postMessage(code);
    });
  }

  // Chạy C++ thật qua Compiler Explorer (godbolt.org, GCC 13.2, miễn phí, có CORS). Dữ liệu cho cin đặt sau dòng ---INPUT---.
  const GODBOLT = "https://godbolt.org/api/compiler/g132/compile";
  async function runCpp(block) {
    const [code, stdin = ""] = block.split(/^---INPUT---\s*$/m);
    const plain = (t) => t.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");
    const lines = (arr) => plain((arr || []).map((x) => x.text).join("\n")).trim();
    try {
      const signal = AbortSignal.any ? AbortSignal.any([controller.signal, AbortSignal.timeout(60000)]) : controller.signal;
      const res = await fetch(GODBOLT, {
        method: "POST", signal, headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          source: code, lang: "c++", allowStoreCodeDebug: false,
          options: { userArguments: "-O2 -std=c++17", executeParameters: { args: [], stdin: stdin.replace(/^\n/, "") },
            compilerOptions: { executorRequest: true }, filters: { execute: true }, tools: [], libraries: [] },
        }),
      });
      if (res.status === 429) return "Lỗi: Compiler Explorer đang giới hạn lượt, đợi một lúc rồi chạy lại.";
      if (!res.ok) return `Lỗi: Compiler Explorer trả lỗi ${res.status}.`;
      const j = await res.json();
      const cut = (t) => (t.length > 4000 ? t.slice(0, 4000) + "\n…(đã cắt bớt)" : t);
      if (j.buildResult && j.buildResult.code !== 0) return cut("Lỗi biên dịch:\n" + lines(j.buildResult.stderr).split("\n").slice(0, 40).join("\n"));
      const out = lines(j.stdout), err = lines(j.stderr);
      if (j.timedOut) return cut((out ? out + "\n" : "") + "Lỗi: chương trình chạy quá thời gian (khoảng 20 giây) nên đã bị dừng.");
      return cut((out || "(không có gì được in ra, hãy dùng cout)") + (err ? "\n[stderr]\n" + err : "") +
        (j.code ? `\n(chương trình kết thúc với mã lỗi ${j.code})` : "") + `\n(thời gian chạy ${j.execTime ?? "?"} ms)`);
    } catch (e) { return toolError(e); }
  }

  async function apiError(res) {
    const text = await res.text();
    let msg = text;
    try { const j = JSON.parse(text); msg = j.error?.message || j.message || j.msg || text; } catch {}
    msg = String(msg).slice(0, 300);
    if (res.status === 401 || res.status === 403) return `Máy chủ từ chối yêu cầu (${res.status}): ${msg}`;
    if (res.status === 429) return `Đã vượt giới hạn số lượt hỏi, đợi một lúc rồi thử lại (429): ${msg}`;
    return `Server trả lỗi ${res.status}: ${msg}`;
  }

  // Gửi một yêu cầu và stream kết quả vào `reply`. Dừng sớm khi `stopOn(content)` trả về true.
  async function runPass(messages, reply, node, stopOn) {
    const t0 = performance.now();
    let tThinkEnd = null, tokens = 0, tFirst = null, stopped = false;
    const pass = new AbortController();
    const onAbort = () => pass.abort();
    const outer = reply.stop?.signal || controller.signal;
    outer.addEventListener("abort", onAbort, { once: true });
    let pending = false;
    const repaint = () => {
      if (pending) return; pending = true;
      // Vẽ lại tối đa ~6 lần/giây để trình duyệt không tranh GPU với mô hình.
      setTimeout(() => { pending = false; if (controller) { paintAssistant(node, reply, true); scrollDown(); } }, 150);
    };
    try {
      const stream = apiDeltas(messages, reply, node, pass.signal);
      reply.truncated = false; reply.lastFinish = null;
      for await (const { think, text, tps, finish } of stream) {
        if (finish) { reply.truncated = finish === "length"; reply.lastFinish = finish; }
        if (think) reply.reasoning += think;
        if (text) { reply.content += text; delete reply.notice; }
        if (think || text) {
          tokens++; tFirst ??= performance.now();
          // Mốc kết thúc suy nghĩ: token trả lời đầu tiên sau phần reasoning, hoặc khi gặp </think>.
          if (tThinkEnd === null && ((reply.reasoning && text) || reply.content.includes("</think>"))) tThinkEnd = performance.now();
        }
        if (tps) reply.tps = tps.toFixed(1);
        repaint();
        if (stopOn?.(reply.content)) { stopped = true; pass.abort(); break; }
      }
    } catch (e) {
      if (!(stopped && e.name === "AbortError")) throw e;
    } finally {
      outer.removeEventListener("abort", onAbort);
      if (tThinkEnd || reply.reasoning || reply.content.includes("</think>")) {
        reply.thinkSecs = (reply.thinkSecs || 0) + Math.max(1, Math.round(((tThinkEnd || performance.now()) - t0) / 1000));
      }
      if (!reply.tps && tokens > 1 && tFirst) reply.tps = (tokens / ((performance.now() - tFirst) / 1000)).toFixed(1);
    }
  }

  // API kiểu OpenAI (máy chủ chung): đọc luồng SSE, trả ra từng mẩu suy nghĩ/chữ.
  async function* apiDeltas(messages, reply, node, signal) {
    const notice = reply.notice;
    const show = (text) => { reply.notice = text; setStatus("", text); paintAssistant(node, reply, true); };
    const wait = (ms) => new Promise((ok, fail) => {
      const t = setTimeout(ok, ms);
      signal.addEventListener("abort", () => { clearTimeout(t); fail(new DOMException("", "AbortError")); }, { once: true });
    });
    // Bản miễn phí hay bị quá tải: 429/503 thì chờ rồi thử lại; máy chủ treo (502/504/524, hoặc 60 giây chưa trả lời)
    // thì chuyển ngay sang mô hình khác. Thứ tự: mô hình đang chọn trước, rồi các mô hình còn lại.
    // Câu hỏi có ảnh chỉ gửi được tới mô hình đọc ảnh, nên thử lại nhiều lần hơn thay vì đổi mô hình.
    const vision = messages.some((m) => Array.isArray(m.content));
    // Mô hình trên NVIDIA: máy chủ tự xử lý ảnh (dùng GLM-5.3 Flash) và tự chuyển sang GLM của Z.ai khi bận,
    // nên trang chỉ thử thêm các mô hình của Z.ai.
    const onNvidia = (m) => PROVIDERS.shared.nvidia.includes(m);
    const chosen = reply.forceModel || cloudModel(); // forceModel: mô hình riêng của một lời giải trong chế độ Nghĩ kỹ
    const order = vision ? [["shared", PROVIDERS.shared.visionModels.includes(chosen) ? chosen : PROVIDERS.shared.visionNvidia]] : [[settings.provider, chosen]];
    if (!vision) for (const id of Object.keys(PROVIDERS)) for (const m of PROVIDERS[id].models) if ((id !== order[0][0] || m !== order[0][1]) && !onNvidia(m)) order.push([id, m]);
    const retries = vision ? 4 : 1;
    let res = null, used, model;
    for (let i = 0; i < order.length; i++) {
      const [id, m] = order[i], p = PROVIDERS[id];
      used = id; model = m;
      const body = JSON.stringify({
        messages: withProfile(messages, m), stream: true,
        temperature: Number(settings.temperature), max_tokens: MAX_OUTPUT, top_p: 0.95,
        model, ...p.extra,
        ...(["careful", "max", "ultra"].includes(settings.level) && !reply.fast ? { effort: "max" } : {}),
        // Mức Nhanh, hoặc khi cần viết ngay câu trả lời: không suy nghĩ dài.
        ...(reply.fast || settings.level === "fast" ? { thinking: { type: "disabled" } } : {}),
      });
      let hung = false;
      for (let attempt = 0; ; attempt++) {
        // Mô hình trên NVIDIA: máy chủ có thể chờ NVIDIA tới 25 giây rồi mới chuyển sang Z.ai, nên chờ lâu hơn.
        const slow = new AbortController(), timer = setTimeout(() => slow.abort(), onNvidia(m) ? 90000 : 60000);
        const both = AbortSignal.any ? AbortSignal.any([signal, slow.signal]) : signal;
        try {
          res = await fetch(p.url, { method: "POST", headers: { "Content-Type": "application/json" }, body, signal: both });
        } catch (e) {
          if (signal.aborted || !slow.signal.aborted) throw e;
          res = null;
        } finally { clearTimeout(timer); }
        hung = !res || [502, 504, 524].includes(res.status);
        if ((hung && !vision) || (res && res.status !== 429 && res.status !== 503 && !hung) || attempt >= retries) break;
        const text = res ? await res.text().catch(() => "") : "";
        const secs = Math.min(30, Number(res?.headers.get("Retry-After")) || Number(text.match(/retry after (\d+)/i)?.[1]) || 5 * (attempt + 1));
        show(`${modelTitle(id, m)} đang quá tải, tự thử lại sau ${secs} giây…`);
        await wait(secs * 1000);
      }
      const busy = hung || res.status === 429 || res.status === 503;
      if (!busy || i === order.length - 1) break;
      await res?.body?.cancel();
      show(`${modelTitle(id, m)} đang quá tải, chuyển sang ${modelTitle(...order[i + 1])}…`);
    }
    if (!res) throw new Error("Máy chủ của Astra không phản hồi. Đợi một lúc rồi thử lại.");
    if (vision && [429, 502, 503, 504, 524].includes(res.status)) {
      await res.body?.cancel();
      throw new Error(`Mô hình đọc ảnh (${modelTitle("shared", model)}) đang quá tải. Đợi khoảng một phút rồi bấm Tạo lại.`);
    }
    reply.notice = notice;
    if (!res.ok) throw new Error(await apiError(res));
    // Máy chủ cho biết mô hình thật đã trả lời (nó tự đổi khi GLM-5.3 Flash chưa bật, quá tải hoặc lỗi).
    // Worker bản cũ không gửi tên mô hình và chưa có GLM-5.3 Flash: khi đó nó đã dùng mô hình dự phòng của Z.ai.
    const real = res.headers.get("X-GLM-Model") || (onNvidia(model) ? (vision ? PROVIDERS.shared.vision : "glm-4.7-flash") : null);
    const asked = model;
    if (real && PROVIDERS[used].titles[real]) model = real;
    reply.drafter = modelTitle(used, model);
    if (vision) reply.via = `${modelTitle(used, model)} (mô hình đọc được ảnh)`;
    else if (used !== settings.provider || model !== chosen) {
      // Máy chủ ghi lý do không dùng được GLM-5.3 Flash (key sai, hết lượt, quá lâu…) trong X-GLM-Note.
      let note = "";
      try { note = brandNote(decodeURIComponent(res.headers.get("X-GLM-Note") || "")); } catch {}
      reply.via = `${modelTitle(used, model)} vì ` + (note || `${modelTitle(used, asked === model ? chosen : asked)} đang ${onNvidia(asked) && real !== asked ? "bận hoặc chưa bật" : "quá tải"}`);
    }
    setStatus("ok", `${PROVIDERS[used].name} · ${modelTitle(used, model)}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", lastText = Date.now();
    // Máy chủ đôi khi vẫn giữ kết nối nhưng không gửi thêm chữ nào: quá 2 phút thì ngắt, coi như mất kết nối
    // (TypeError) để runPass tự nối lại hoặc báo lỗi, thay vì chờ mãi.
    const IDLE = 120000;
    while (true) {
      let idle;
      const { value, done } = await Promise.race([reader.read(), new Promise((_, no) => {
        idle = setTimeout(() => no(new TypeError("Mô hình không gửi thêm nội dung")), Math.max(1000, IDLE - (Date.now() - lastText)));
      })]).finally(() => clearTimeout(idle)).catch((e) => { reader.cancel().catch(() => {}); throw e; });
      if (done) return;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n"); buf = parts.pop();
      for (const line of parts) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        const delta = j.choices?.[0]?.delta || {};
        // Z.ai dùng reasoning_content, một số máy chủ khác dùng reasoning.
        if (delta.reasoning_content || delta.reasoning || delta.content) lastText = Date.now();
        yield { think: delta.reasoning_content || delta.reasoning, text: delta.content, tps: j.timings?.predicted_per_second, finish: j.choices?.[0]?.finish_reason };
      }
    }
  }
